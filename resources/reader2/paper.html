<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>paper</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    /* footnote popup host used by the fork's footnote path (kept for parity) */
    #footnote-dialog { display: none; }
    foliate-view { width: 100%; height: 100%; }
  </style>
  <!--
    Production paper page: native QML chrome sits above this. The native Reader2Bridge is
    registered on the view's QWebChannel as "bridge" (Paper.qml Component.onCompleted); the
    two classic scripts below build window.bridge from it — qwebchannel.js defines
    QWebChannel, bridge_boot.js runs the handshake. This is the PROVEN in-repo pattern (the
    old reader's ebook_reader.html loads qwebchannel.js + its shim the same way); it works
    over file:// in QtWebEngine because the view's `webChannel` provides qt.webChannelTransport
    before page scripts run. Order matters: qwebchannel BEFORE bridge_boot BEFORE paper_glue.
    PDF support needs pdf.js (classic) loaded before any PDF is opened; harmless otherwise.
  -->
  <script src="./qwebchannel.js"></script>
  <script src="./bridge_boot.js"></script>
  <script src="./vendor/foliate-anx/src/vendor/pdfjs/pdf.js"></script>
</head>
<body>
  <dialog id="footnote-dialog"><main></main></dialog>
  <!-- CLASSIC script (NOT type=module): a module entry with top-level static imports is
       blocked over file:// in QtWebEngine. paper_glue.js dynamic-imports its vendor modules
       in boot() instead, so it loads over both file:// (Qt) and http:// (bench). -->
  <script src="./paper_glue.js"></script>
</body>
</html>
