<!DOCTYPE html>
<!--
  host.html — the LOCAL parent page for hosted playback (VidKing). It is served from
  qrc:/hostedplayer/host.html and owns the cross-origin iframe. It carries only one
  iframe and two scripts (QWebChannel + host.js). The CSP is the cage:

    default-src 'none'   — nothing loads unless explicitly allowed below
    frame-src  vidking   — the ONLY place an iframe may point
    script-src 'self' qrc:  — only our bundled qrc scripts run (no inline, no remote)
    connect-src 'none'   — the page itself makes no network requests
    img-src 'none'       — no images loaded by the parent page

  The iframe content (VidKing) runs in its own origin and is NOT governed by this CSP;
  the wrapper never trusts it — see host.js, which validates every postMessage.
-->
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; frame-src https://www.vidking.net; script-src 'self' qrc:; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #player { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
</style>
</head>
<body>
  <iframe id="player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="host.js"></script>
</body>
</html>
