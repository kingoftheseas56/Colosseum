<!-- Colosseum original glyph (Lucide 24-grid, 2px round stroke) - the Single Page layout: one
     page, alone, on the stage. -->
<svg
  class="colosseum comicreader-layout-single"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="#ffffff"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <rect x="6" y="3" width="12" height="18" rx="1.5" />
</svg>
