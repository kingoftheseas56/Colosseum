<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#06070b">
  <title>Developer Web Colosseum</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script defer src="./bridge.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div id="app" class="app-shell" data-surface="Home">
    <div id="wallpaper" class="wallpaper" aria-hidden="true"></div>
    <div class="wallpaper-scrim" aria-hidden="true"></div>

    <header id="topbar" class="topbar">
      <button id="home-button" class="home-button" type="button" hidden>
        <span aria-hidden="true">‹</span> Home
      </button>
      <button id="brand-button" class="brand" type="button" aria-label="Colosseum home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-name">Colosseum</span>
      </button>
      <nav id="world-nav" class="world-nav" aria-label="Colosseum worlds">
        <button type="button" data-world="Tankoban">Tankoban</button>
        <button type="button" data-world="Biblio">Biblio</button>
        <button type="button" data-world="Theatre">Theatre</button>
      </nav>

      <div class="topbar-actions">
        <button id="search-button" class="icon-button" type="button" aria-label="Search" title="Search">⌕</button>
        <button id="trackers-button" class="icon-button" type="button" aria-label="Trackers" title="Trackers">⇄</button>
        <button id="wallpaper-button" class="icon-button" type="button" aria-label="Wallpaper" title="Wallpaper">◫</button>
        <button id="account-button" class="account-button" type="button" aria-label="Account"><span>?</span></button>
        <span class="window-divider" aria-hidden="true"></span>
        <button id="minimize-button" class="window-button" type="button" aria-label="Minimize">−</button>
        <button id="fullscreen-button" class="window-button" type="button" aria-label="Toggle fullscreen">□</button>
        <button id="close-button" class="window-button close" type="button" aria-label="Close">×</button>
      </div>
    </header>

    <main id="surface" class="surface" tabindex="-1" aria-live="polite"></main>

    <div id="backend-status" class="backend-status" role="status">
      Waiting for Colosseum backend
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <div id="search-overlay" class="overlay" hidden>
      <section class="overlay-panel search-panel" role="dialog" aria-modal="true" aria-labelledby="search-title">
        <div class="overlay-head">
          <div>
            <p class="eyebrow">Current frontend snapshot</p>
            <h2 id="search-title">Search</h2>
          </div>
          <button id="search-close" class="icon-button" type="button" aria-label="Close search">×</button>
        </div>
        <label class="search-field">
          <span aria-hidden="true">⌕</span>
          <input id="search-input" type="search" autocomplete="off" placeholder="Search loaded titles">
        </label>
        <div id="search-results" class="search-results"></div>
      </section>
    </div>
  </div>
</body>
</html>
