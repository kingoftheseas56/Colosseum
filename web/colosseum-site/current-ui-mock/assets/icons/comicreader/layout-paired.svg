<!-- Colosseum original glyph (Lucide 24-grid, 2px round stroke) - the Paired Pages layout: two
     pages meeting at the spine. -->
<svg
  class="colosseum comicreader-layout-paired"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="#ffffff"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <rect x="2.5" y="3" width="8.5" height="18" rx="1.5" />
  <rect x="13" y="3" width="8.5" height="18" rx="1.5" />
</svg>
