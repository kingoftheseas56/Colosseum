<!-- Colosseum original glyph (Lucide 24-grid, 2px round stroke) - the Pages command. Draws the
     approved temporary filmstrip itself: neighbour pages flanking an enlarged current page. -->
<svg
  class="colosseum comicreader-pages"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="#ffffff"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <rect x="2" y="7.5" width="4.5" height="9" rx="1" />
  <rect x="8.5" y="4" width="7" height="16" rx="1" />
  <rect x="17.5" y="7.5" width="4.5" height="9" rx="1" />
</svg>
