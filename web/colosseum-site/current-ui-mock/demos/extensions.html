<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Extensions · Colosseum</title>
    <!-- Reconciled from the existing Brotherhood demo; current source 2916fe85812643c2e0ae45b0aec132cb6eb4e507. Local fixture operations only. -->
    <style>
      @font-face {
        font-family: Fraunces;
        src: url("../assets/Fraunces-Regular.ttf") format("truetype");
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --gold: #f0c44a;
        --ink: #f7f7f5;
        --dim: #c9c8d0;
        --dimmer: #9a99a5;
        --edge: rgba(255, 255, 255, 0.18);
        --ui: "Segoe UI", system-ui;
        --display: Fraunces, Georgia, serif;
      }
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #0a0b10;
      }
      body {
        font-family: var(--ui);
        color: var(--ink);
        position: relative;
        user-select: none;
        cursor: default;
      }
      .wall {
        position: absolute;
        inset: 0;
        background: url("../assets/cold-ripple.jpg") center/cover;
      }
      .wall:after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.34),
          rgba(0, 0, 0, 0.1) 50%,
          rgba(0, 0, 0, 0.46)
        );
      }
      .glass {
        background: linear-gradient(#00000024, #00000024), #ffffff1a;
        backdrop-filter: blur(24px);
        border: 1px solid var(--edge);
      }
      .topbar {
        position: absolute;
        left: 54px;
        top: 30px;
        width: 1172px;
        height: 56px;
        z-index: 20;
      }
      .clock b {
        font: 32px/1 var(--display);
        font-weight: 400;
      }
      .clock i {
        font-style: normal;
        font-size: 16px;
        color: var(--dim);
        margin-left: 5px;
      }
      .clock small {
        display: block;
        margin-top: 3px;
        font-size: 13px;
        color: var(--dim);
      }
      .picker {
        position: absolute;
        left: 50%;
        top: 5px;
        transform: translateX(-50%);
        height: 46px;
        padding: 0 7px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .picker span {
        height: 34px;
        padding: 0 17px;
        display: flex;
        align-items: center;
        font-size: 14px;
        font-weight: 500;
        color: var(--dim);
      }
      .sys {
        position: absolute;
        right: 0;
        top: 17px;
        display: flex;
        gap: 20px;
        align-items: center;
      }
      .sys img {
        width: 22px;
        height: 22px;
        opacity: 0.72;
      }
      .acct {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1.5px solid #ffffff61;
        position: relative;
      }
      .acct:before {
        content: "";
        position: absolute;
        left: 7px;
        top: 3.5px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #fff;
        opacity: 0.82;
      }
      .acct:after {
        content: "";
        position: absolute;
        left: 4.5px;
        top: 10px;
        width: 10px;
        height: 6px;
        border-radius: 3px;
        background: #fff;
        opacity: 0.82;
      }
      .page {
        position: absolute;
        top: 96px;
        left: 0;
        right: 0;
        height: 624px;
        overflow: hidden;
      }
      .board {
        position: absolute;
        left: 54px;
        top: 0;
        width: 1172px;
        display: flex;
        flex-direction: column;
        will-change: transform;
      }
      .art {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .rail-window {
        overflow: hidden;
      }
      .img-wrap {
        overflow: hidden;
        background: linear-gradient(150deg, #532f49, #1d121b);
      }
      img.failed {
        opacity: 0;
      }
      .scrollbar {
        position: absolute;
        right: 4px;
        top: 106px;
        width: 3px;
        height: 78px;
        background: #f0c44a80;
        border-radius: 3px;
        opacity: 0;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .back {
        font-size: 32px;
        color: var(--dim);
        line-height: 1;
      }
      .page-title h1 {
        font: 24px var(--display);
      }
      .page-title p {
        font-size: 11px;
        color: var(--dim);
        margin-top: 2px;
      }
      .board {
        padding: 12px 0 40px;
        gap: 36px;
      }
      .house {
        position: relative;
        flex: none;
        height: 330px;
        border-radius: 28px;
        border: 1px solid #ffffff1a;
        overflow: hidden;
        background: linear-gradient(140deg, #243746, #0b0d12);
      }
      .house > .art {
        position: absolute;
        inset: 0;
      }
      .house:after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(#0005, #0000000d 42%, #00000024 62%, #0008);
      }
      .search {
        position: absolute;
        right: 26px;
        top: 20px;
        z-index: 2;
        height: 34px;
        border-radius: 17px;
        padding: 0 18px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: #0f1016c7;
        border: 1px solid #ffffff1f;
        font-size: 14px;
        color: #ffffffc7;
      }
      .search img {
        width: 15px;
        height: 15px;
        opacity: 0.78;
      }
      .tray {
        position: absolute;
        left: 3%;
        right: 3%;
        bottom: 22px;
        height: 174px;
        border-radius: 31px;
        border: 1px solid #ffffff4d;
        background: linear-gradient(90deg, #ece5d852, #dcd4c621);
        backdrop-filter: blur(34px);
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .house-app {
        width: 122px;
        height: 140px;
        position: relative;
        flex: none;
      }
      .app-tile {
        width: 82px;
        height: 82px;
        margin: 0 auto;
        background: #fafaf8f7;
        border-radius: 19px;
        box-shadow: 0 12px 25px #0004;
        display: grid;
        place-items: center;
        color: #39444a;
        font: 38px var(--display);
      }
      .app-tile img {
        width: 48px;
        height: 48px;
      }
      .app-caption {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 8px;
      }
      .name-chip {
        height: 28px;
        max-width: 112px;
        border-radius: 11px;
        background: #191a1d47;
        border: 1px solid #ffffff29;
        color: #ffffffdb;
        display: flex;
        align-items: center;
        padding: 0 10px;
        font-size: 11px;
        white-space: nowrap;
      }
      .toggle {
        height: 28px;
        width: 28px;
        border-radius: 50%;
        background: #121318b8;
        border: 1px solid #ffffff57;
        display: grid;
        place-items: center;
        font-size: 14px;
        opacity: 0.5;
      }
      .toggle.on {
        background: #287852d1;
        border-color: #9fffd28c;
        opacity: 1;
      }
      .rail {
        flex: none;
      }
      .rail-head {
        position: relative;
        margin-bottom: 14px;
      }
      .rail-head h2 {
        font: 600 26px/32px var(--display);
      }
      .rail-head p {
        font-size: 14px;
        color: var(--dimmer);
        margin-top: 5px;
        line-height: 18px;
      }
      .seeall {
        position: absolute;
        right: 0;
        bottom: 0;
        font-size: 15px;
        color: var(--dim);
      }
      .cards {
        display: flex;
        gap: 22px;
        will-change: transform;
      }
      .addon {
        width: 365px;
        flex: none;
        height: 299px;
      }
      .addon-art {
        height: 220px;
        position: relative;
        overflow: hidden;
        border-radius: 23px;
        border: 1px solid #ffffff1a;
        background: linear-gradient(100deg, var(--tone1), var(--tone2));
      }
      .addon.hot .addon-art {
        border-color: #f0c44a6b;
      }
      .logo-stage {
        position: absolute;
        left: calc(50% - 56px);
        top: 54px;
        width: 112px;
        height: 112px;
        border-radius: 26px;
        background: #18191feb;
        border: 1px solid #ffffff17;
        display: grid;
        place-items: center;
        font: 42px var(--display);
        color: var(--dim);
      }
      .addon.hot .logo-stage {
        transform: translateY(-4.5px) scale(1.045);
      }
      .addon h3 {
        font-size: 18px;
        font-weight: 600;
        line-height: 24px;
        margin-top: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .addon p {
        height: 40px;
        font-size: 14px;
        line-height: 20px;
        color: #aaa69e;
        margin-top: 3px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .install-state {
        position: absolute;
        right: 14px;
        top: 14px;
        border-radius: 13px;
        height: 26px;
        line-height: 24px;
        padding: 0 11px;
        background: #0a0b0f9e;
        border: 1px solid #ffffff29;
        font-size: 11px;
        font-weight: 600;
        opacity: 0;
      }
      .install-state.visible {
        opacity: 1;
      }
      .install-state.installed {
        color: var(--gold);
        border-color: #f0c44a73;
      }
      .footer {
        font-size: 12px;
        color: #ffffff57;
      }
    </style>
    <link rel="stylesheet" href="extensions-current.css" />
  </head>
  <body>
    <div class="wall"></div>
    <header class="topbar">
      <button data-action="back" aria-label="Back">‹</button>
      <div class="page-title">
        <h1>Extensions</h1>
        <p>Add-ons and sources for every world.</p>
      </div>
    </header>
    <main class="page" id="page"><div class="board" id="board"></div></main>
    <dialog id="setup" aria-labelledby="setup-title"></dialog>
    <script src="../shared/mock-runtime.js"></script>
    <script src="extensions-logos.js"></script>
    <script src="extensions-current.js"></script>
  </body>
</html>
