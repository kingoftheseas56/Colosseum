<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Feria · Colosseum</title>
    <!-- Reconciled from Brotherhood Feria demo. Source pin 2916fe85812643c2e0ae45b0aec132cb6eb4e507; browser presentation follows 2026-10-07 contract. -->
    <style>
      @font-face {
        font-family: "Fraunces";
        src: url("../assets/Fraunces-Regular.ttf") format("truetype");
      }
      :root {
        --gold: #f0c44a;
        --ink: #f7f7f5;
        --ink-dim: #c9c8d0;
        --ink-dimmer: #9a99a5;
        --edge: rgba(255, 255, 255, 0.18);
        --ui: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
        --display: "Fraunces", Georgia, serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #0a0b10;
      }
      body {
        font-family: var(--ui);
        color: var(--ink);
        position: relative;
        user-select: none;
        cursor: default;
      }
      .wall {
        position: absolute;
        inset: 0;
        background: url("../assets/cold-ripple.jpg") center/cover;
      }
      /* Main.qml vignette over the wallpaper */
      .wall::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.34),
          rgba(0, 0, 0, 0.1) 50%,
          rgba(0, 0, 0, 0.46)
        );
      }
      .glass {
        background:
          linear-gradient(rgba(0, 0, 0, 0.14), rgba(0, 0, 0, 0.14)),
          rgba(255, 255, 255, 0.1);
        -webkit-backdrop-filter: blur(24px);
        backdrop-filter: blur(24px);
        border: 1px solid var(--edge);
      }

      /* ---- TopBar: x54 y30, 56 high ---- */
      .topbar {
        position: absolute;
        left: 54px;
        top: 30px;
        width: 1172px;
        height: 56px;
        z-index: 30;
      }
      .left {
        position: absolute;
        left: 0;
        top: 0;
        height: 56px;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .back {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--ink-dim);
      }
      .back svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .clock b {
        font-family: var(--display);
        font-weight: 400;
        font-size: 32px;
        line-height: 1;
      }
      .clock i {
        font-style: normal;
        font-size: 16px;
        color: var(--ink-dim);
        margin-left: 5px;
      }
      .clock small {
        display: block;
        margin-top: 3px;
        font-size: 13px;
        color: var(--ink-dim);
      }
      .picker {
        position: absolute;
        left: 50%;
        top: 5px;
        transform: translateX(-50%);
        height: 46px;
        padding: 0 7px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .picker span {
        height: 34px;
        padding: 0 17px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink-dim);
      }
      .picker span.on {
        background: var(--gold);
        color: #1a1408;
        font-weight: 600;
      }
      .sys {
        position: absolute;
        right: 0;
        top: 17px;
        display: flex;
        gap: 20px;
        align-items: center;
      }
      .sys img {
        width: 22px;
        height: 22px;
        opacity: 0.72;
      }
      .acct {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1.5px solid rgba(255, 255, 255, 0.38);
        position: relative;
        opacity: 0.92;
      }
      .acct::before {
        content: "";
        position: absolute;
        left: 7px;
        top: 3.5px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #fff;
        opacity: 0.82;
      }
      .acct::after {
        content: "";
        position: absolute;
        left: 4.5px;
        top: 10px;
        width: 10px;
        height: 6px;
        border-radius: 3px;
        background: #fff;
        opacity: 0.82;
      }

      .picker span {
        padding: 0 12px;
        font-size: 13px;
      }
      .picker {
        gap: 2px;
      }
      .back {
        min-width: 50px;
      }
      .clock small {
        font-size: 12px;
      }
      img {
        color: transparent;
      }
      .screen {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 30px;
      }
      .head h2 {
        font: 22px var(--display);
        font-weight: 400;
      }
      .head span {
        font: 17px var(--display);
        color: var(--ink-dim);
      }

      .ambient {
        position: absolute;
        inset: 0 0 130px;
        background: #1b2029 url("../assets/feria/assets/stranger-bg.jpg") center
          top/cover;
        opacity: 0.42;
      }
      .ambient:after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, #06070bdd, #06070b33 62%, #06070b80),
          linear-gradient(0deg, #0a0b10, transparent 55%);
      }
      .fhome {
        position: absolute;
        inset: 0;
      }
      .feature {
        position: absolute;
        left: 134px;
        top: 108px;
        width: 832px;
        height: 330px;
      }
      .featurecopy {
        position: absolute;
        bottom: 53.6px;
        width: 640px;
      }
      .service {
        font-size: 13px;
        color: var(--ink-dim);
        margin-bottom: 8px;
      }
      .feature h1 {
        font: 500 42px var(--display);
        margin-bottom: 8px;
      }
      .facts {
        display: flex;
        gap: 19px;
        font-size: 13px;
        color: var(--ink-dim);
        margin-bottom: 8px;
      }
      .feature p {
        font-size: 14px;
        line-height: 1.55;
        color: var(--ink-dim);
      }
      .apps {
        position: absolute;
        left: 134px;
        top: 458px;
        width: 1092px;
      }
      .appgrid {
        display: flex;
        gap: 20px;
        margin-top: 20px;
      }
      .app {
        width: 180px;
        height: 108px;
        border: 1px solid #ffffff1a;
        border-radius: 12px;
        background: #ffffff0c;
        position: relative;
        display: grid;
        place-items: center;
        font-size: 14px;
        font-weight: 600;
        color: var(--ink-dim);
      }
      .app small {
        position: absolute;
        left: 13px;
        top: 10px;
        font-size: 11.5px;
        color: var(--ink-dimmer);
        font-weight: 400;
      }
      .app.hot {
        box-shadow: 0 0 0 2px var(--gold);
        background: linear-gradient(90deg, #ffffff24, #ffffff13);
        transform: translateY(-7px);
        color: var(--ink);
      }
      .app.add {
        background: transparent;
        border-color: var(--edge);
      }
      .lenses {
        position: absolute;
        left: 360px;
        top: 652px;
        width: 640px;
        height: 54px;
        border-radius: 18px;
        padding: 6px;
        display: flex;
        gap: 6px;
      }
      .lenses span {
        flex: 1;
        display: grid;
        place-items: center;
        border: 1px solid #ffffff1a;
        border-radius: 14px;
        font-size: 14px;
        font-weight: 600;
      }
      .lenses .on {
        background: var(--gold);
        color: #17120a;
      }
      .index {
        position: absolute;
        left: 49px;
        top: 458px;
        width: 52px;
        height: 180px;
        border-right: 1px solid #ffffff20;
        color: var(--ink-dim);
        font-size: 20px;
        padding-top: 8px;
        text-align: center;
      }
      .index div {
        height: 46px;
      }
      .host {
        position: absolute;
        inset: 108px 0 0;
        opacity: 0;
      }
      .browserbar {
        height: 52px;
        margin: 0 54px;
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 14px;
        color: var(--ink-dim);
      }
      .browserbar .nav {
        display: flex;
        gap: 23px;
        font-size: 19px;
      }
      .browserbar .url {
        font-size: 12px;
        border: 1px solid #ffffff25;
        border-radius: 8px;
        padding: 7px 11px;
      }
      .window {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 10px 15px;
        border-radius: 11px;
        background: #11131977;
        border: 1px solid #ffffff25;
        font-size: 20px;
      }
      .browser {
        position: absolute;
        left: 54px;
        right: 54px;
        top: 52px;
        height: 472px;
        display: flex;
        border: 1px solid #ffffff20;
        border-radius: 12px;
        overflow: hidden;
        background: #101014;
      }
      .spaces {
        width: 42px;
        flex: none;
        overflow: hidden;
        background: #15171dd9;
        backdrop-filter: blur(24px);
        border-right: 1px solid #ffffff14;
      }
      .sideinside {
        width: 218px;
        padding: 14px 12px;
        height: 100%;
        position: relative;
      }
      .sidehead {
        height: 38px;
        display: flex;
        gap: 17px;
        align-items: flex-start;
        font-size: 14px;
      }
      .sidehead .icon {
        font-size: 20px;
        line-height: 20px;
      }
      .sidecopy {
        opacity: 0;
      }
      .slabel {
        font-size: 12px;
        color: var(--ink-dimmer);
        margin: 17px 0 9px;
      }
      .space {
        height: 40px;
        display: flex;
        align-items: center;
        font-size: 12px;
        padding: 0 9px;
        gap: 9px;
        white-space: nowrap;
        border-radius: 4px;
        color: var(--ink-dim);
      }
      .space:nth-of-type(2)::before,
      .space:nth-of-type(3)::before {
        content: "";
        width: 10px;
        height: 13px;
        flex: none;
        border: 1px solid #c9c8d099;
        border-radius: 2px;
      }
      .space.active {
        background: #ffffff0c;
        color: var(--ink);
      }
      .space .close {
        margin-left: auto;
        color: var(--ink-dimmer);
      }
      .sidebottom {
        position: absolute;
        bottom: 17px;
        left: 12px;
        right: 12px;
        border-top: 1px solid #ffffff12;
        padding-top: 10px;
      }
      .sidebottom p {
        padding: 8px;
        font-size: 12px;
        color: var(--ink-dim);
      }
      .site {
        position: relative;
        flex: 1;
        min-width: 0;
        background: #262328;
        overflow: hidden;
      }
      .siteart {
        position: absolute;
        inset: 0;
        background: #3c3039 url("../assets/feria/assets/stranger-bg.jpg")
          center/cover;
      }
      .siteart:after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, #100f17ed, #100f1770 70%),
          linear-gradient(0deg, #101014, transparent 70%);
      }
      .sitenav {
        position: absolute;
        top: 22px;
        left: 32px;
        display: flex;
        align-items: center;
        gap: 25px;
        color: #e5e2e6;
        font-size: 12px;
      }
      .sitenav b {
        font-size: 16px;
        font-weight: 500;
        margin-right: 15px;
      }
      .sitecopy {
        position: absolute;
        left: 40px;
        top: 110px;
        width: 490px;
      }
      .sitecopy h2 {
        font: 40px var(--display);
        margin: 9px 0 14px;
      }
      .sitecopy p {
        font-size: 13px;
        color: #d4d0d7;
        line-height: 1.6;
        max-width: 430px;
      }
      .sitecopy .episode {
        font-size: 11px;
        letter-spacing: 1.5px;
        color: #ddd9e1;
      }
      .siteactions {
        display: flex;
        gap: 10px;
        margin-top: 24px;
      }
      .siteactions span {
        border-radius: 7px;
        padding: 11px 19px;
        background: #ffffff20;
        font-size: 12px;
      }
      .siteactions span:first-child {
        background: #eeedf0;
        color: #17131b;
      }
      .sitefoot {
        position: absolute;
        bottom: 24px;
        left: 40px;
        font-size: 13px;
        color: #d4d0d7;
      }
      .appdock {
        position: absolute;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        height: 46px;
        padding: 0 25px;
        display: flex;
        align-items: center;
        gap: 28px;
        border-radius: 16px;
        color: var(--ink-dim);
        font-size: 12px;
      }
      .appdock .selected {
        color: var(--ink);
        border-bottom: 2px solid var(--gold);
        padding: 10px 0;
      }
    </style>
    <link rel="stylesheet" href="feria-current.css" />
  </head>
  <body>
    <div class="wall"></div>
    <header class="topbar">
      <button data-action="home">‹ Feria</button
      ><span class="page-label">Feria</span>
      <div class="feria-tools">
        <button data-action="search" aria-label="Search Feria">
          <img src="../assets/icons/search.svg" alt="" /></button
        ><button data-action="account" aria-label="Your Feria">
          Your Feria
        </button>
      </div>
    </header>
    <main id="main" aria-label="Feria"></main>
    <dialog id="apps-dialog" aria-labelledby="apps-heading"></dialog>
    <script src="../shared/mock-runtime.js"></script>
    <script src="feria-data.js"></script>
    <script src="feria-current.js"></script>
  </body>
</html>
