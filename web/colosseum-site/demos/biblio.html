function esc(x){return String(x).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));}
function faux(b,extra=""){
 return '<div class="faux '+extra+'" style="--c1:'+b.color[0]+';--c2:'+b.color[1]+'"><span class="tiny">Colosseum · Biblio</span><span class="fake-title">'+esc(b.title)+'</span><span class="fake-author">'+esc(b.author)+'</span></div>';
}
function cover(b,extra=""){return b.img?'<img class="'+extra+'" src="'+esc(b.img)+'" alt="'+esc(b.title)+' cover">':faux(b,extra);}
function ordered(offset,n){return Array.from({length:n},(_,i)=>BOOKS[(offset+i)%BOOKS.length]);}
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');}
function wireCards(root){root.querySelectorAll('[data-book]').forEach(el=>{let book=BOOKS[+el.dataset.book];el.addEventListener('click',()=>toast('Preview only · '+book.title));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click();}});});}
function bookCard(b,num=-1){const index=BOOKS.indexOf(b);return '<article class="book" role="button" tabindex="0" data-book="'+index+'" title="'+esc(b.title)+' · '+esc(b.author)+'">'+(num>=0?'<b class="rank-num">'+(num+1)+'</b>':'')+'<div class="cover-box">'+cover(b)+'</div><strong>'+esc(b.title)+'</strong><small>'+esc(b.author)+'</small><span class="hover-meta">★ '+esc(b.rating)+' · Preview</span></article>';}
function bookRail(title,i){
 const ranked=i===0,books=ordered(ranked?0:i+1,ranked?10:8);
 return '<section class="shelf" data-title="'+esc(title)+'"><div class="shelf-head"><h2>'+esc(title)+'</h2><button type="button" class="see-all" data-shelf="'+esc(title)+'">See All</button></div><div class="books'+(ranked?' ranked':'')+'">'+books.map((b,n)=>bookCard(b,ranked?n:-1)).join('')+'</div></section>';
}
function mosaic(title,i){
 let books=ordered(i+1,7);
 return '<section class="shelf mosaic" data-title="'+esc(title)+'" role="button" tabindex="0" aria-label="Explore '+esc(title)+'"><div class="mosaic-covers">'+books.map(b=>'<div class="mosaic-cover">'+cover(b)+'</div>').join('')+'</div><strong>'+esc(title)+'</strong></section>';
}
function buildExplore(){
 const host=$('shelves');host.innerHTML=SHELF_NAMES.map(bookRail).join('')+'<div class="mosaics">'+FACETS.map(mosaic).join('')+'</div>';
 wireCards(host);host.querySelectorAll('.see-all').forEach(b=>b.onclick=()=>toast('See All · '+b.dataset.shelf+' (offline preview)'));
 host.querySelectorAll('.mosaic').forEach(el=>{el.onclick=()=>toast('Explore '+el.dataset.title+' (offline preview)');el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click();}};});
 buildIndex();
}
function iconPaths(title){
 const t=title.toLowerCase();
 if(/collection|library|shelf|shelves/.test(t))return '<path d="M4 4v16h5V4zM9 6h5v14H9zM16 4l4 15-4 1-4-15z"/>';
 if(/top|rated|popular|best/.test(t))return '<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/>';
 if(/recent|new|available|release|continue/.test(t))return '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>';
 if(/explore|discover|genre/.test(t))return '<circle cx="12" cy="12" r="9"/><path d="m16 8-3 5-5 3 3-5z"/>';
 if(/edition|omnibus|omnibuses|complete|run/.test(t))return '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/>';
 return '<path d="M4 6h16M4 12h16M4 18h16"/>';
}
function buildIndex(){
 const titles=SHELF_NAMES.concat(FACETS);
 $('row-links').innerHTML=titles.map((t,i)=>'<button class="ri-link" title="'+esc(t)+'" data-row="'+i+'" aria-label="'+esc(t)+'"><svg viewBox="0 0 24 24">'+iconPaths(t)+'</svg><span>'+esc(t)+'</span></button>').join('');
 $('row-links').querySelectorAll('.ri-link').forEach(link=>link.onclick=()=>{
  const title=titles[+link.dataset.row];
  const el=Array.from($('shelves').querySelectorAll('.shelf')).find(x=>x.dataset.title===title);
  if(!el)return;
  const vp=$('viewport');vp.scrollTo({top:vp.scrollTop+el.getBoundingClientRect().top-vp.getBoundingClientRect().top-78,behavior:'smooth'});
 });
}
function updateIndex(){
 if($('explore').hidden)return;
 const vp=$('viewport'),sections=Array.from($('shelves').querySelectorAll('.shelf')),links=Array.from($('row-links').children);
 let at=0;for(let i=0;i<sections.length;i++){if(sections[i].getBoundingClientRect().top-vp.getBoundingClientRect().top<=82)at=i;}
 if(vp.scrollTop>=vp.scrollHeight-vp.clientHeight-2)at=sections.length-1;
 links.forEach((b,i)=>b.classList.toggle('current',at===i));
}
function showIndex(open){
 $('index-shell').classList.toggle('open',open);$('explore-aside').classList.toggle('expanded',open);
 $('index-toggle').setAttribute('aria-expanded',String(open));$('index-toggle').setAttribute('aria-label',open?'Retract row index':'Expand row index');
 scrollState();
}
function buildDiscover(){
 let order=ordered(2,32);
 $('discover-grid').innerHTML=order.map(b=>'<article class="grid-card" role="button" tabindex="0" data-book="'+BOOKS.indexOf(b)+'" title="'+esc(b.title)+'"><div class="grid-cover">'+cover(b)+'</div><strong>'+esc(b.title)+'</strong><small>'+esc(b.author)+'</small></article>').join('');
 wireCards($('discover-grid'));
}
function buildLibrary(){
 const progress=[43,28];$('library-grid').innerHTML=[BOOKS[0],BOOKS[1]].map((b,i)=>'<article class="lib-card" role="button" tabindex="0" data-book="'+BOOKS.indexOf(b)+'"><div class="lib-cover">'+cover(b)+'</div><strong>'+esc(b.title)+'</strong><small>'+esc(b.author)+'</small><div class="progress"><i style="width:'+progress[i]+'%"></i></div></article>').join('');wireCards($('library-grid'));
}
let slide=0;const featured=[BOOKS[1],BOOKS[0],BOOKS[2],BOOKS[3]];
function showSlide(i){
 slide=(i+featured.length)%featured.length;const b=featured[slide];
 $('hero-title').textContent=b.title;$('hero-author').textContent='By '+b.author+'.';
 $('hero-cover-slot').innerHTML=cover(b,'hero-cover');
 $('hero-dots').innerHTML=featured.map((_,n)=>'<button aria-label="Feature '+(n+1)+'" class="'+(slide===n?'on':'')+'" data-slide="'+n+'"></button>').join('');
 $('hero-dots').querySelectorAll('button').forEach(btn=>btn.onclick=()=>showSlide(+btn.dataset.slide));
}
const positions={discover:0,explore:0,library:0};let active='discover';
function selectTab(key,restore=true){
 if(!['discover','explore','library'].includes(key))key='discover';
 const vp=$('viewport');if(restore)positions[active]=vp.scrollTop;
 active=key;document.querySelectorAll('.content-panel').forEach(x=>x.hidden=x.id!==key);
 document.querySelectorAll('[data-tab]').forEach(b=>{let on=b.dataset.tab===key;b.classList.toggle('on',on);b.setAttribute('aria-selected',String(on));});
 $('toast').classList.remove('show');
 if(restore){vp.scrollTop=positions[key];requestAnimationFrame(()=>{vp.scrollTop=positions[key];scrollState();});}
 else scrollState();
}
function scrollState(){
 const vp=$('viewport'),docked=vp.scrollTop>=374;const slot=$('tabslot');
 slot.classList.toggle('docked',docked);
 slot.style.setProperty('--dock-shift',active==='library'?'0px':$('explore-aside').classList.contains('expanded')&&active==='explore'?'134px':'40px');
 updateIndex();
}
$('viewport').addEventListener('scroll',scrollState,{passive:true});
$('index-toggle').onclick=()=>showIndex(!$('index-shell').classList.contains('open'));
$('discover-toggle').onclick=()=>toast('Apple Books · Biblio catalogue sources');
$('catalogue-menu').onclick=()=>toast('Popular · Apple Books (offline preview)');
$('filter-toggle').onclick=()=>toast('Filter · All (offline preview)');
$('customize').onclick=()=>toast('Shelf customization available in the Colosseum app');
$('read-hero').onclick=()=>toast('Read · '+featured[slide].title+' (offline preview)');
$('detail-hero').onclick=()=>toast('Details · '+featured[slide].title+' (offline preview)');
document.querySelectorAll('.sys button,.picker button,.dock button,.back').forEach(b=>b.onclick=()=>toast((b.title||b.textContent||'Colosseum').trim()+' · preview only'));
document.querySelectorAll('[data-tab]').forEach(btn=>btn.onclick=()=>selectTab(btn.dataset.tab));
document.querySelector('.tabs').addEventListener('keydown',e=>{
 const buttons=Array.from(document.querySelectorAll('[data-tab]'));
 const i=buttons.indexOf(document.activeElement);
 if(i<0)return;
 let j=i;if(e.key==='ArrowRight')j=Math.min(2,i+1);else if(e.key==='ArrowLeft')j=Math.max(0,i-1);else if(e.key==='Home')j=0;else if(e.key==='End')j=2;else return;
 e.preventDefault();buttons[j].focus();selectTab(buttons[j].dataset.tab);
});
buildExplore();buildDiscover();buildLibrary();showSlide(0);
selectTab(params.get('tab')||'discover',false);
if(params.get('index')==='open')showIndex(true);
const initialY=Math.max(0,Number(params.get('y')||0)||0);
$('viewport').scrollTop=initialY;
requestAnimationFrame(()=>{$('viewport').scrollTop=initialY;scrollState();});
</script><script src="autoscroll.js"></script></body></html>
