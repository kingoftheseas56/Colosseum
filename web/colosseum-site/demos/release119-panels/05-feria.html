<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Colosseum · Feria 2.0.1</title><style>
@font-face{font-family:Fraunces;src:url(../../assets/Fraunces-Regular.ttf)}
:root{--gold:#f0c44a;--ink:#f6f5f2;--dim:#c4c3cb}
*{box-sizing:border-box;margin:0}html,body{width:2000px;height:1415px;overflow:hidden;background:#0b0b0d}

.pill{height:50px;padding:0 30px;border-radius:25px;display:flex;align-items:center;font-weight:600;font-size:18px;color:var(--gold);background:#1e1e22b8;border:1.5px solid #f0c44a59}.dash{border-style:dashed}

.lede{position:absolute;right:72px;top:206px;font-family:Fraunces,Georgia,serif;font-size:44px;color:#ecebe8;text-align:right}
.screen{position:absolute;overflow:hidden;border-radius:22px;background:#09090c;box-shadow:0 30px 80px #0009,0 0 0 1.5px #ffffff26}.screen img{width:100%;height:100%;display:block;object-fit:contain}
.label{font-size:17px;font-weight:600;letter-spacing:.22em;color:var(--gold)}
.note{position:absolute;bottom:25px;left:72px;right:72px;color:#aaa8ae;font-size:16px;text-align:right}
.copy h2{font:400 60px/1.12 Fraunces,Georgia,serif}.copy p{font-size:25px;line-height:1.6;color:var(--dim)}


.discovery{left:72px;top:450px;width:914px;height:730px}
.browser{left:1014px;top:450px;width:914px;height:730px;border:1.5px solid #f0c44aaa;box-shadow:0 36px 100px #000b}
.view-label{position:absolute;font-size:16px;font-weight:600;letter-spacing:.23em;color:var(--gold)}
.discovery-label{left:90px;top:400px}.browser-label{left:1032px;top:400px}
.lede{font-size:42px}.note{font-size:15px;bottom:13px}
</style><style>.screen.browser iframe{display:block;width:100%;height:100%;border:0;background:#09090c}</style></head><body>
