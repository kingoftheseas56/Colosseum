movies:['Top 10','Recently Released','Top Rated','Hidden Gems','Cult Classics','Under Two Hours','Documentary Movies','Animated Movies','International Cinema','Japanese Cinema','Korean Cinema','French Cinema','2020s Movies','2010s Movies','2000s Movies','1990s Movies','1980s Movies','1970s Movies'],
shows:['Top 10','Currently Airing','Recently Premiered','Top Rated','Hidden Gems','Cult Classics','Long-Running Series','Limited Series','Drama Series','Comedy Series','Crime and Mystery','Science Fiction and Fantasy','Documentary Series','Animated Series','Korean Drama'],
anime:['Top 10','Trending','Airing Now','Top Airing','Upcoming Season','Top Series','Top Anime Movies','Most Popular','Top Rated','Hidden Gems','2020s Anime','2010s Anime','2000s Anime','1990s and Earlier','Action and Adventure','Romance','Slice of Life','Mecha','Fantasy','Science Fiction','Psychological','Horror and Supernatural']
};
const SERVICE=[
{title:'Netflix',slot:15,provider:'via Streaming Catalogs'},
{title:'Prime Video',slot:16,provider:'via Streaming Catalogs'},
{title:'Disney+',slot:17,provider:'via Streaming Catalogs'},
{title:'HBO Max',slot:18,provider:'via Streaming Catalogs'},
{title:'Apple TV+',slot:19,provider:'via Streaming Catalogs'}
];
const GENRES={
movies:['Action','Drama','Comedy','Sci-Fi','Thriller','Horror','Romance','Animation','Adventure','Crime','Mystery','Fantasy','Documentary'],
shows:['Drama','Comedy','Crime','Sci-Fi','Thriller','Mystery','Action','Animation','Adventure','Fantasy','Documentary','Romance','Horror'],
anime:['Action','Adventure','Comedy','Drama','Fantasy','Horror','Mystery','Romance','Sci-Fi','Slice of Life','Sports','Supernatural']
};
const FEATURES=[
{title:'Stranger Things',cover:feria('stranger'),art:AS+'feria/assets/stranger-bg.jpg',ghost:'S',desc:'A missing child, a secret laboratory, and a town where the impossible is never far away.'},
{title:'Dune: Part Two',cover:poster('dune'),art:poster('dune'),ghost:'M',desc:'Paul Atreides faces a destiny that could change the fate of Arrakis.'},
{title:'Oppenheimer',cover:poster('oppenheimer'),art:poster('oppenheimer'),ghost:'M',desc:'An ambitious physicist helps shape a world-altering moment in history.'},
{title:'The Batman',cover:poster('batman'),art:poster('batman'),ghost:'M',desc:'Gotham has its secrets, and the city is about to confront them.'}
];
const TABS=['Discover','Movies','Shows','Anime','Library'];
const $=id=>document.getElementById(id);
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search);
let activeTab=(params.get('tab')||'discover').toLowerCase();if(!TABS.some(t=>t.toLowerCase()===activeTab))activeTab='discover';
let indexOpen=params.get('index')==='open',currentGenre='Genre',currentLens='movie',currentSource='colosseum';
let currentSlide=0;
function toast(message){const el=$('toast');el.textContent=message;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',1800)}
document.querySelectorAll('[data-toast]').forEach(b=>b.addEventListener('click',()=>toast(b.dataset.toast)));
document.querySelectorAll('.world-picker .world-pill:not(.selected)').forEach(b=>b.addEventListener('click',()=>toast(b.textContent+' is another world in the full Colosseum app')));
document.querySelectorAll('.topbar .sysicon,.dockbar .dockbutton,.back,.device').forEach(b=>b.addEventListener('click',()=>toast(b.title||b.getAttribute('aria-label')||'Colosseum')));
const clock=new Date();
$('clockHour').textContent=new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',hour12:true}).format(clock).replace(/\s[AP]M$/,'');
$('clockAmpm').textContent=clock.getHours()>=12?'PM':'AM';
$('clockDate').textContent=new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric'}).format(clock);
function showSlide(n){currentSlide=(n+FEATURES.length)%FEATURES.length;const d=FEATURES[currentSlide];
$('heroArt').style.backgroundImage='url("'+d.art+'")';$('heroTitle').textContent=d.title;$('heroDesc').textContent=d.desc;$('heroGhost').textContent=d.ghost;
$('heroDots').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===currentSlide))}
$('heroDots').innerHTML=FEATURES.map((_,i)=>'<button aria-label="Feature '+(i+1)+'"></button>').join('');
$('heroDots').querySelectorAll('button').forEach((b,i)=>b.addEventListener('click',()=>showSlide(i)));showSlide(0);
function makeContinue(items,showProgress){return items.map((d,i)=>'<div class="continue-tile" role="button" tabindex="0" data-item="'+E(d.title)+'"><img src="'+d.cover+'" alt=""><div class="scrim"></div><span class="play-circle">▶</span><div class="tile-caption">'+E(d.title)+(showProgress?'<span class="episode">'+d.progress+'% watched</span>':'<span class="episode">Up next</span>')+'</div>'+(showProgress?'<div class="progress"><i style="width:'+d.progress+'%"></i></div>':'')+'</div>').join('')}
$('nextTiles').innerHTML=makeContinue([SHOWS[0],SHOWS[1],ANIME[0],SHOWS[2],ANIME[2]],false);
$('continueTiles').innerHTML=makeContinue([...MOVIES,...SHOWS].filter(d=>d.progress),true);
document.querySelectorAll('.continue-tile').forEach(el=>el.addEventListener('click',()=>toast('Open '+el.dataset.item+' in Theatre')));
function iconPaths(title){
const t=title.toLowerCase();
if(/collection|library|shelf|shelves/.test(t))return '<path d="M4 4v16h5V4zM9 6h5v14H9zM16 4l4 15-4 1-4-15z"/>';
if(/top|rated|popular|best/.test(t))return '<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/>';
if(/recent|new|available|release|continue/.test(t))return '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>';
if(/explore|discover|genre/.test(t))return '<circle cx="12" cy="12" r="9"/><path d="m16 8-3 5-5 3 3-5z"/>';
if(/edition|omnibus|omnibuses|complete|run/.test(t))return '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/>';
return '<path d="M4 6h16M4 12h16M4 18h16"/>';
}
function railRows(tab){
const out=HOUSE[tab].slice();
if(tab==='shows')out.splice(2,0,'HBO Max','Disney+','Prime Video','Netflix','Apple TV+');
return out;
}
function renderTabs(){for(const id of ['flowTabs','dockTabs'])$(id).innerHTML=TABS.map(t=>'<button data-tab="'+t.toLowerCase()+'" class="'+(activeTab===t.toLowerCase()?'on':'')+'" aria-pressed="'+(activeTab===t.toLowerCase())+'">'+t+'</button>').join('')}
document.querySelectorAll('#flowTabs,#dockTabs').forEach(nav=>nav.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)switchTab(b.dataset.tab)}));
function makePoster(d,i,ranked){return '<div class="poster-card'+(ranked?' ranked':'')+'" role="button" tabindex="0" data-item="'+E(d.title)+'">'+(ranked?'<b class="rank-no">'+(i+1)+'</b>':'')+'<div class="poster-art"><img src="'+d.cover+'" alt=""></div><p>'+E(d.title)+'</p></div>'}
function sampleItems(list,n,seed){return Array.from({length:n},(_,i)=>list[(i+seed)%list.length])}
function shelfHTML(title,items,seed,provider){const ranked=title==='Top 10';const cards=sampleItems(items,ranked?10:9,seed);
return '<section class="shelf" data-row="'+E(title)+'"><div class="shelf-head"><h2>'+E(title)+(provider?'<small>via Streaming Catalogs</small>':'')+'</h2><button data-toast="Explore '+E(title)+'">See all ›</button></div><div class="poster-track'+(ranked?' ranked':'')+'">'+cards.map((d,i)=>makePoster(d,i,ranked)).join('')+'</div></section>'}
function genresHTML(tab,items){return '<section class="shelf" data-row="'+(tab==='anime'?'Anime':tab==='shows'?'Show':'Movie')+' Genres"><div class="shelf-head"><h2>'+ (tab==='anime'?'Anime':tab==='shows'?'Show':'Movie') +' Genres</h2><button data-toast="Explore genres">Explore ›</button></div><div class="genre-grid">'+GENRES[tab].map((name,i)=>'<div class="genre-item" data-genre="'+E(name)+'"><img src="'+items[i%items.length].cover+'" alt=""><strong>'+E(name)+'</strong></div>').join('')+'</div></section>'}
function renderCatalogue(tab){const items=DATA[tab],rows=railRows(tab);
const sections=rows.map((title,i)=>shelfHTML(title,items,i,tab==='shows'&&SERVICE.some(s=>s.title===title))).join('')+genresHTML(tab,items);
$('panel').innerHTML='<div class="catalogue"><aside class="row-index'+(indexOpen?' open':'')+'" id="rowIndex">'+
'<button class="index-toggle" id="indexToggle" aria-label="Expand or close row index" aria-expanded="'+indexOpen+'"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>'+
'<div class="index-brand"><small>WORLD</small><b>Theatre</b></div><div class="index-list" id="indexList"></div></aside>'+
'<div class="catalogue-main"><div class="customize"><button data-toast="Customize rows">Customize rows</button></div>'+sections+'</div></div>';
const all=[...rows,(tab==='anime'?'Anime':tab==='shows'?'Show':'Movie')+' Genres'];
$('indexList').innerHTML=all.map((title,i)=>'<button class="index-row" title="'+E(title)+'" data-index="'+i+'"><svg viewBox="0 0 24 24">'+iconPaths(title)+'</svg><span>'+E(title)+'</span></button>').join('');
$('indexToggle').onclick=()=>{indexOpen=!indexOpen;$('rowIndex').classList.toggle('open',indexOpen);$('indexToggle').setAttribute('aria-expanded',indexOpen);updateDock()};
$('indexList').querySelectorAll('[data-index]').forEach(el=>el.addEventListener('click',()=>{const shelf=$('panel').querySelectorAll('.shelf')[+el.dataset.index];if(!shelf)return;
const box=shelf.getBoundingClientRect(),origin=$('frame').getBoundingClientRect();$('frame').scrollTo({top:$('frame').scrollTop+box.top-origin.top-76,behavior:'smooth'});}));
$('panel').querySelectorAll('.poster-card').forEach(el=>el.addEventListener('click',()=>toast('Open '+el.dataset.item)));
$('panel').querySelectorAll('.genre-item').forEach(el=>el.addEventListener('click',()=>toast('Explore '+el.dataset.genre)));
wireToasts();updateDock();updateIndex();
}
function wireToasts(){$('panel').querySelectorAll('[data-toast]').forEach(b=>b.addEventListener('click',()=>toast(b.dataset.toast)))}
const SOURCES=[
{name:'Cinemeta',mark:'C'},
{name:'Streaming Catalogs',icon:AS+'addon-logos/streaming-catalogs.png'},
{name:'Anime Kitsu',icon:AS+'addon-logos/anime-kitsu.png'},
{name:'Netflix',icon:AS+'addon-logos/netflix-catalog.png'},
{name:'TVDB',icon:AS+'addon-logos/tvdb.svg'}
];
function discoverMarkup(){return '<div class="discover"><aside class="source-rail" id="sourceRail">'+
'<button class="source-toggle" id="sourceToggle" aria-label="Expand sources"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>'+
'<div class="source-list">'+SOURCES.map((s,i)=>'<button class="source-item'+(i===0?' active':'')+'" data-source="'+i+'" title="'+E(s.name)+'">'+(s.icon?'<img src="'+s.icon+'" alt="">':'<b class="source-mark">'+s.mark+'</b>')+'<span>'+E(s.name)+'</span></button>').join('')+'</div></aside>'+
'<div class="discover-main"><div class="discover-mast">'+
'<div class="discover-lenses">'+['Movie','Series','Anime'].map((t,i)=>'<button data-lens="'+(['movie','series','anime'][i])+'" class="'+(currentLens===['movie','series','anime'][i]?'on':'')+'">'+t+'</button>').join('')+'</div>'+
'<div class="browsing"><small>NOW BROWSING</small><strong>Popular</strong><em id="sourceByline">Cinemeta</em></div></div>'+
'<div class="filter-line"><b>FILTER</b><div class="filter-menu"><button class="genre-toggle" id="genreToggle">'+E(currentGenre)+' <span>⌄</span></button><div class="genre-options" id="genreOptions" hidden></div></div></div>'+
'<div class="discover-grid" id="discoverGrid"></div></div></div>'}
function updateDiscoverGrid(){const cat=currentLens==='movie'?'movies':currentLens==='series'?'shows':'anime';let items=DATA[cat];
if(currentGenre!=='Genre'){items=items.filter(d=>d.genre.toLowerCase()===currentGenre.toLowerCase());}
const grid=$('discoverGrid');if(!grid)return;grid.innerHTML=items.length?sampleItems(items,21,0).map(d=>'<div class="discover-card" role="button" tabindex="0" data-item="'+E(d.title)+'"><img src="'+d.cover+'" alt=""><p>'+E(d.title)+'</p></div>').join(''):'<p class="empty-note">No staged titles in this genre.</p>';
grid.querySelectorAll('[data-item]').forEach(card=>card.addEventListener('click',()=>toast('Open '+card.dataset.item)));
}
function renderDiscover(){$('panel').innerHTML=discoverMarkup();
const src=$('sourceRail');$('sourceToggle').onclick=()=>src.classList.toggle('expanded');
$('panel').querySelectorAll('[data-source]').forEach(b=>b.addEventListener('click',()=>{currentSource=SOURCES[+b.dataset.source].name;
$('panel').querySelectorAll('[data-source]').forEach(x=>x.classList.toggle('active',x===b));$('sourceByline').textContent=currentSource}));
$('panel').querySelectorAll('[data-lens]').forEach(b=>b.addEventListener('click',()=>{currentLens=b.dataset.lens;currentGenre='Genre';$('genreToggle').innerHTML='Genre <span>⌄</span>';
$('panel').querySelectorAll('[data-lens]').forEach(x=>x.classList.toggle('on',x===b));fillGenres();updateDiscoverGrid()}));
$('genreToggle').onclick=()=>{$('genreOptions').hidden=!$('genreOptions').hidden};fillGenres();updateDiscoverGrid();
}
function fillGenres(){const kind=currentLens==='movie'?'movies':currentLens==='series'?'shows':'anime';
$('genreOptions').innerHTML=['Genre',...GENRES[kind]].map(t=>'<button data-genre="'+E(t)+'">'+E(t)+'</button>').join('');
$('genreOptions').querySelectorAll('[data-genre]').forEach(b=>b.onclick=()=>{currentGenre=b.dataset.genre;$('genreToggle').innerHTML=E(currentGenre)+' <span>⌄</span>';$('genreOptions').hidden=true;updateDiscoverGrid()})}
function renderLibrary(){const saved=[...MOVIES,...SHOWS,...ANIME].filter(x=>x.progress>0);$('panel').innerHTML='<div class="library-view">'+
'<h2 class="library-title">Your Library</h2><p class="library-sub">Movies, shows, and anime you have saved in Theatre.</p>'+
'<section class="shelf"><div class="shelf-head"><h2>Continue Watching</h2></div><div class="poster-track">'+saved.map((d,i)=>makePoster(d,i,false)).join('')+'</div></section>'+
'<section class="shelf" style="margin-top:46px"><div class="shelf-head"><h2>Saved for Later</h2></div><div class="poster-track">'+[MOVIES[2],SHOWS[2],ANIME[0],MOVIES[3]].map((d,i)=>makePoster(d,i,false)).join('')+'</div></section></div>';
$('panel').querySelectorAll('[data-item]').forEach(el=>el.addEventListener('click',()=>toast('Open '+el.dataset.item)))}
function switchTab(tab){activeTab=tab;renderTabs();if(tab==='discover')renderDiscover();else if(tab==='library')renderLibrary();else renderCatalogue(tab);updateDock()}
function updateDock(){const frame=$('frame'),slot=$('tabslot'),dock=$('tabDock');
const fixed=frame.clientHeight>0 && slot.getBoundingClientRect().top < frame.getBoundingClientRect().top+4;
dock.classList.toggle('visible',fixed);const sidebar=(activeTab==='movies'||activeTab==='shows'||activeTab==='anime')?(indexOpen?268:80):80;
dock.style.left=(54+sidebar)+'px';dock.style.right='54px';updateIndex()}
function updateIndex(){if(!['movies','shows','anime'].includes(activeTab))return;const list=$('indexList');if(!list)return;
const shelves=[...$('panel').querySelectorAll('.shelf')],top=$('frame').getBoundingClientRect().top+78;
let selected=0;shelves.forEach((s,i)=>{if(s.getBoundingClientRect().top<=top+4)selected=i});
if($('frame').scrollTop >= $('frame').scrollHeight-$('frame').clientHeight-2)selected=shelves.length-1;
list.querySelectorAll('.index-row').forEach((b,i)=>b.classList.toggle('active',i===selected));
}
$('frame').addEventListener('scroll',updateDock,{passive:true});window.addEventListener('load',updateDock);window.addEventListener('resize',updateDock);if('ResizeObserver' in window)new ResizeObserver(updateDock).observe($('frame'));window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('genreOptions'))$('genreOptions').hidden=true});
switchTab(activeTab);
if(params.has('y'))requestAnimationFrame(()=>{$('frame').scrollTop=Math.max(0,Number(params.get('y'))||0);updateDock()});
})();
</script><script src="autoscroll.js"></script></body></html>
