let active=tabs.includes(q.get("tab"))?q.get("tab"):"discover",expanded=q.get("index")==="open",discoverType="manga",slide=0;
let libFilter="",libSort="lastRead",libQuery="",menuId=null;const removed=new Set();
function safe(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function notice(msg){const el=$("toast");el.textContent=msg;el.classList.add("visible");clearTimeout(notice.job);notice.job=setTimeout(()=>el.classList.remove("visible"),2200);}
function buttonTab(key){return '<button type="button" role="tab" data-tab="'+key+'" aria-selected="'+(active===key)+'" class="'+(active===key?"active":"")+'">'+key.charAt(0).toUpperCase()+key.slice(1)+'</button>';}
function updateTabs(){["flow-tabs","dock-tabs"].forEach(id=>$(id).innerHTML=tabs.map(buttonTab).join(""));}
function showSlide(n){
slide=(n+featured.length)%featured.length;const f=featured[slide],item=all[f.id];
$("hero-title").textContent=f.title;$("hero-description").textContent=f.desc;
$("hero-poster").src=item.cover;$("hero-poster").alt=f.title+" cover";
$("hero-dots").innerHTML=featured.map((s,i)=>'<button type="button" data-slide="'+i+'" aria-label="Feature '+(i+1)+'" class="'+(i===slide?"on":"")+'"></button>').join("");
}
function header(title,more){return '<div class="shelf-head"><h2>'+safe(title)+'</h2>'+(more?'<button class="more" data-more="'+safe(title)+'" type="button">'+more+' ›</button>':'')+'</div>';}
function collection(items){return '<section class="shelf" data-title="Your Collection">'+header("Your Collection","")+'<div class="collect-tiles">'+items.filter(x=>x.progress).map(x=>
'<div class="collect-tile" data-title-card="'+x.id+'"><img src="'+x.cover+'" alt=""><span class="collect-title">'+safe(x.title)+'</span><span class="collect-sub">'+x.progress+'% complete</span><div class="progress"><i style="width:'+x.progress+'%"></i></div></div>').join("")+'</div></section>';}
function rotated(items,start){return items.map((v,i)=>items[(i+start)%items.length]);}
function ranked(title,items,more){return '<section class="shelf" data-title="'+safe(title)+'">'+header(title,more?"Explore":"")+'<div class="rankstrip">'+items.map((x,i)=>
'<div class="rankitem" data-title-card="'+x.id+'"><b class="ranknum">'+(i+1)+'</b><div class="portrait"><img src="'+x.cover+'" alt=""><span>'+safe(x.title)+'</span></div></div>').join("")+'</div></section>';}
function mosaic(title,data,pool,more){
return '<section class="shelf" data-title="'+safe(title)+'">'+header(title,more?"Explore":"")+'<div class="genres">'+data.map((g,i)=>
'<div class="genre-card" data-genre="'+safe(g[0])+'"><img src="'+pool[i%pool.length].cover+'" alt=""><em>'+g[1]+'</em><strong>'+safe(g[0])+'</strong></div>').join("")+'</div></section>';}
function iconPaths(title){
const t=title.toLowerCase();
if(/collection|library|shelf|shelves/.test(t))return '<path d="M4 4v16h5V4zM9 6h5v14H9zM16 4l4 15-4 1-4-15z"/>';
if(/top|rated|popular|best/.test(t))return '<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/>';
if(/recent|new|available|release|continue/.test(t))return '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>';
if(/explore|discover|genre/.test(t))return '<circle cx="12" cy="12" r="9"/><path d="m16 8-3 5-5 3 3-5z"/>';
if(/edition|omnibus|omnibuses|complete|run/.test(t))return '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/>';
return '<path d="M4 6h16M4 12h16M4 18h16"/>';
}
function indexRow(title,i){return '<button type="button" class="ri-row" data-row="'+i+'" title="'+safe(title)+'" aria-label="Jump to '+safe(title)+'"><svg viewBox="0 0 24 24">'+iconPaths(title)+'</svg><span>'+safe(title)+'</span></button>';}
function catalogue(type){
const selected=type==="manga"?manga:comics;
const main=type==="manga"?collection(selected)+ranked("Top in Tankoban — Manga",selected,true)+mosaic("Explore by Genre — Manga",genreM,selected,true):
collection(selected)+ranked("Top in Tankoban — Comics",selected,true)+comicShelves.map((title,i)=>ranked(title,rotated(selected,(i+1)%selected.length),i<11)).join("")+mosaic("Explore Comics",genreC,selected,false);
const labels=type==="manga"?["Your Collection","Top in Tankoban — Manga","Explore by Genre — Manga"]:["Your Collection","Top in Tankoban — Comics"].concat(comicShelves,["Explore Comics"]);
return '<div class="catalogue"><aside class="rowindex '+(expanded?"open":"")+'" id="rowindex"><div class="ri-stick"><button type="button" id="ri-toggle" class="ri-toggle" aria-label="'+(expanded?"Collapse":"Expand")+' row index" title="Toggle row index">'+(expanded?"‹":"›")+'</button><div class="ri-brand"><small>WORLD</small><b>Tankoban</b></div><div class="ri-list">'+labels.map(indexRow).join("")+'</div></div></aside><div class="cat-main">'+main+'</div></div>';
}
function discover(){
const pool=discoverType==="manga"?manga:comics, provider=discoverType==="manga"?"Jikan":"Grand Database";
const image=discoverType==="manga"?"../current-ui-mock/assets/addon-logos/jikan.png":"../current-ui-mock/assets/addon-logos/colosseum-grand-database.png";
return '<div class="discover"><aside class="disc-sidebar"><button type="button" class="disc-toggle" title="Discover sources" data-discover-action="sources">›</button><button type="button" class="disc-source" data-discover-action="sources" title="'+provider+'"><img src="'+image+'" alt="'+provider+'"></button></aside><div class="disc-main">'+
'<div class="disc-mast"><div class="lens"><button type="button" data-disc-type="manga" class="'+(discoverType==="manga"?"active":"")+'">Manga</button><button type="button" data-disc-type="comics" class="'+(discoverType==="comics"?"active":"")+'">Comics</button></div><div class="now"><small>NOW BROWSING</small><b>Popular <i>▼</i></b><em>'+provider+'</em></div></div>'+
'<div class="disc-filter"><strong>FILTER</strong><button type="button" data-discover-action="filters">All <span>▾</span></button></div>'+
'<div class="disc-grid">'+pool.concat(pool).map(x=>'<div class="disc-card" data-title-card="'+x.id+'"><div class="disc-cov"><img src="'+x.cover+'" alt=""></div><p>'+safe(x.title)+'</p></div>').join("")+'</div></div></div>';
}
function filteredLibrary(){
let a=all.filter(x=>!removed.has(x.id));
if(libFilter==="inProgress")a=a.filter(x=>x.progress>0);
if(libFilter==="downloaded")a=a.filter(x=>[0,1,6,7].includes(x.id));
if(libQuery.trim())a=a.filter(x=>x.title.toLowerCase().includes(libQuery.trim().toLowerCase()));
if(libSort==="az")a.sort((a,b)=>a.title.localeCompare(b.title));
if(libSort==="added")a.reverse();
return a;
}
function controlButton(label,val,mode){const on=(mode==="filter"?libFilter:libSort)===val;return '<button type="button" class="'+(on?"active":"")+'" data-lib-'+mode+'="'+val+'">'+label+'</button>';}
function library(){
const filt=controlButton("All","","filter")+controlButton("In Progress","inProgress","filter")+controlButton("Downloaded","downloaded","filter");
const sort=controlButton("Last Read","lastRead","sort")+controlButton("Recently Added","added","sort")+controlButton("A-Z","az","sort");
return '<div class="library"><div class="library-toolbar"><input class="library-search" id="library-search" type="search" autocomplete="off" placeholder="Search your library" aria-label="Search your library" value="'+safe(libQuery)+'"><div class="lib-controls">'+filt+'</div><div class="lib-controls">'+sort+'</div></div><div id="library-results">'+libraryResults()+'</div></div>';
}
function libraryResults(){
const rows=filteredLibrary();
if(!rows.length)return '<div class="empty">'+(removed.size===all.length?"Your library is empty":"No matches")+'<small>Try a different filter or search.</small></div>';
return '<div class="library-grid">'+rows.map(x=>'<div class="lib-card" data-title-card="'+x.id+'"><div class="lib-poster"><img src="'+x.cover+'" alt=""></div><p>'+safe(x.title)+'</p><button type="button" class="lib-dots" data-lib-menu="'+x.id+'" aria-label="Options for '+safe(x.title)+'">⋮</button>'+
(menuId===x.id?'<div class="lib-menu"><button type="button" data-lib-remove="'+x.id+'">Remove from Library</button></div>':"")+'</div>').join("")+'</div>';
}
function render(){host.innerHTML=active==="discover"?discover():active==="library"?library():catalogue(active);updateTabs();updateDock();updateIndex();}
function updateDock(){
const stick=$("tabslot").getBoundingClientRect().top<96;
$("docked").classList.toggle("show",stick);
$("flow-tabs").style.visibility=stick?"hidden":"visible";
const left=54+(active==="manga"||active==="comics"?(expanded?240:52)+28:active==="discover"?80:0);
$("docked").style.left=((left+1226-520)/2)+"px";
page.classList.toggle("scrolled",page.scrollTop>0);
}
function updateIndex(){
const idx=$("rowindex");if(!idx)return;
const sections=Array.from(host.querySelectorAll(".shelf"));let current=0;
sections.forEach((s,i)=>{if(s.getBoundingClientRect().top<=178)current=i;});
if(page.scrollTop+page.clientHeight>=page.scrollHeight-2)current=sections.length-1;
idx.querySelectorAll(".ri-row").forEach((b,i)=>{b.classList.toggle("selected",i===current);b.setAttribute("aria-current",i===current?"location":"false");});
}
function chooseTab(tab){if(!tabs.includes(tab))return;active=tab;menuId=null;render();if(page.scrollTop>0&&page.scrollTop>page.scrollHeight-page.clientHeight)page.scrollTop=Math.max(0,page.scrollHeight-page.clientHeight);updateDock();}
document.addEventListener("click",function(event){
let b=event.target.closest("button"),card=event.target.closest("[data-title-card]");
if(b&&b.dataset.tab){chooseTab(b.dataset.tab);return;}
if(b&&b.dataset.slide!==undefined){showSlide(Number(b.dataset.slide));return;}
if(b&&b.id==="ri-toggle"){expanded=!expanded;const idx=$("rowindex");idx.classList.toggle("open",expanded);b.textContent=expanded?"‹":"›";b.title=expanded?"Collapse row index":"Expand row index";b.setAttribute("aria-label",b.title);updateDock();return;}
if(b&&b.dataset.row!==undefined){const section=host.querySelectorAll(".shelf")[Number(b.dataset.row)];if(section)page.scrollTo({top:page.scrollTop+section.getBoundingClientRect().top-174,behavior:"smooth"});return;}
if(b&&b.dataset.discType){discoverType=b.dataset.discType;render();return;}
if(b&&b.dataset.discoverAction){notice("Browse "+(discoverType==="manga"?"Jikan manga":"Grand Database comics")+" in this local preview.");return;}
if(b&&b.dataset.more){notice(b.dataset.more+" · catalogue preview");return;}
if(b&&b.dataset.libFilter!==undefined){libFilter=b.dataset.libFilter;menuId=null;render();return;}
if(b&&b.dataset.libSort!==undefined){libSort=b.dataset.libSort;menuId=null;render();return;}
if(b&&b.dataset.libMenu!==undefined){menuId=Number(b.dataset.libMenu);$("library-results").innerHTML=libraryResults();return;}
if(b&&b.dataset.libRemove!==undefined){removed.add(Number(b.dataset.libRemove));menuId=null;$("library-results").innerHTML=libraryResults();notice("Removed from the staged library");return;}
if(event.target.closest("[data-genre]")){notice(event.target.closest("[data-genre]").dataset.genre+" · genre preview");return;}
if(card){const item=all[Number(card.dataset.titleCard)];if(item)notice(item.title+" · detail preview");return;}
if(b&&b.closest(".picker")){if(b.textContent!=="Tankoban")notice(b.textContent+" is another Colosseum world");return;}
if(b&&b.closest(".dock")){notice(b.title+" · Colosseum dock");return;}
if(b&&b.closest(".system")){notice(b.title+" · local preview");return;}
if(b&&b.id==="home"){chooseTab("discover");page.scrollTop=0;return;}
if(b&&b.id==="hero-read"){notice(featured[slide].title+" · reading preview");return;}
if(b&&b.id==="hero-details"){notice(featured[slide].title+" · series details preview");return;}
});
host.addEventListener("input",function(e){if(e.target.id==="library-search"){libQuery=e.target.value;menuId=null;$("library-results").innerHTML=libraryResults();}});
page.addEventListener("scroll",function(){updateDock();updateIndex();},{passive:true});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&menuId!==null){menuId=null;const target=$("library-results");if(target)target.innerHTML=libraryResults();}});
render();showSlide(0);
const scrollStart=Number(q.get("y")||0);
if(Number.isFinite(scrollStart)&&scrollStart>0){page.scrollTop=scrollStart;updateDock();updateIndex();}
requestAnimationFrame(()=>{updateDock();updateIndex();});
})();
</script><script src="autoscroll.js"></script></body></html>
