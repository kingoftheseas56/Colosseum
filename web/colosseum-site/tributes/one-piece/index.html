<style id="arcCatalogueStyle">
/*
 * One Piece Tribute HTML — Layer 2 Arc-Detail & Catalogue Stylesheet
 * Faithful translation of:
 *   - qml/OnePieceArcPage.qml
 *   - qml/OnePieceArcCatalogue.qml
 *   - qml/OnePieceEpisodeCard.qml
 *   - qml/OnePieceVolumeCard.qml
 *   - qml/WidgetHeader.qml
 *   - qml/BackAction.qml
 *   - qml/ChromeScrim.qml
 *   - qml/UniverseChromeAction.qml
 *   - qml/Theme.qml
 */

:root {
  --op-gold: #f0c44a;
  --op-ink: #f7f7f5;
  --op-ink-dim: #c9c8d0;
  --op-ink-dimmer: #9a99a5;
  --op-edge: rgba(255, 255, 255, 0.18);
  --op-edge-hover: rgba(255, 255, 255, 0.34);
  --op-glass-tint: rgba(255, 255, 255, 0.10);
  --op-glass-hi: rgba(255, 255, 255, 0.14);
  --op-biblio-top: #0c0f18;
  --op-biblio-bottom: #06070b;
  --op-ui: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  --op-display: "Fraunces", Georgia, "Times New Roman", serif;
  --op-margin: 54px;
}

#onePieceArcPage {
  position: fixed;
  inset: 0;
  z-index: 90;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  background: #080b0f;
  color: var(--op-ink);
  font-family: var(--op-ui);
  overflow: hidden;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

#onePieceArcPage[hidden] {
  display: none !important;
}

/* Backdrop: OnePieceArcPage.qml pageBackdrop + OnePieceArcCatalogue.qml gradient */
.op-arc-backdrop {
  position: absolute;
  inset: 0;
  background: #080b0f;
  overflow: hidden;
  pointer-events: none;
  z-index: 1;
}

#onePieceArcHero {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center center;
  opacity: 0.30;
  transition: opacity 180ms ease;
}

#onePieceArcHero[hidden] {
  display: none !important;
}

.op-arc-backdrop-scrim {
  position: absolute;
  inset: 0;
  background: rgba(4, 5, 6, 0.58);
}

.op-arc-catalogue-wash {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(5, 6, 8, 0.72) 0%,
    rgba(5, 6, 8, 0.90) 34%,
    rgba(3, 3, 4, 0.98) 100%
  );
  pointer-events: none;
  z-index: 2;
}

/* ChromeScrim.qml: height 120, top 0.55 black -> transparent, z: 16 */
.op-chrome-scrim {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 120px;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0) 100%);
  pointer-events: none;
  z-index: 16;
}

/* BackAction.qml: plain variant at x: theme.margin, y: 28, z: 20, >=44px hit target */
#arcBackAction {
  position: absolute;
  left: var(--op-margin);
  top: 23px;
  z-index: 20;
  min-width: 84px;
  min-height: 44px;
  padding: 5px 10px 5px 2px;
  margin-left: -2px;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  background: transparent;
  border: 0;
  border-radius: 7px;
  color: var(--op-ink);
  font-family: var(--op-ui);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: color 120ms ease, background-color 120ms ease;
}

#arcBackAction:hover,
#arcBackAction:focus,
#arcBackAction:focus-visible {
  color: var(--op-gold);
  outline: none;
}

#arcBackAction svg {
  width: 20px;
  height: 20px;
  flex: 0 0 20px;
  display: block;
}

/* Top centered header: OnePieceArcCatalogue.qml y: 34, z: 20 */
#arcTopHeader {
  position: absolute;
  left: 50%;
  top: 34px;
  transform: translateX(-50%);
  z-index: 20;
  max-width: calc(100vw - 420px);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--op-ink-dim);
  font-family: var(--op-ui);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2.0px;
  text-transform: uppercase;
  pointer-events: none;
}

/* Top-right chrome actions: OnePieceArcPage.qml z: 40, rightMargin: theme.margin, y: 34 */
.op-chrome-actions {
  position: absolute;
  right: var(--op-margin);
  top: 23px;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 12px;
}

.op-chrome-pill {
  min-height: 36px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--op-edge);
  background: rgba(12, 16, 22, 0.72);
  color: var(--op-ink-dim);
  font-family: var(--op-ui);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color 120ms ease, color 120ms ease, background 120ms ease;
}

.op-chrome-pill[aria-pressed="true"] {
  border-color: rgba(240, 196, 74, 0.55);
  color: var(--op-gold);
}

.op-chrome-pill:hover,
.op-chrome-pill:focus-visible {
  border-color: var(--op-gold);
  color: var(--op-gold);
  outline: none;
}

.op-chrome-icon-btn {
  min-width: 44px;
  min-height: 44px;
  padding: 0 12px;
  border-radius: 7px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--op-ink);
  opacity: 0.78;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: var(--op-ui);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.0px;
  cursor: pointer;
  transition: opacity 120ms ease, color 120ms ease, border-color 120ms ease;
}

.op-chrome-icon-btn:hover,
.op-chrome-icon-btn:focus-visible {
  opacity: 1;
  color: var(--op-gold);
  border-color: var(--op-gold);
  outline: none;
}

/* Main Flickable equivalent: OnePieceArcCatalogue.qml topMargin: 92 */
#onePieceArcCatalogue {
  position: absolute;
  left: 0;
  right: 0;
  top: 92px;
  bottom: 0;
  z-index: 10;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  scroll-behavior: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.22) transparent;
}

#arcContentCol {
  padding: 0 var(--op-margin) 88px;
  display: flex;
  flex-direction: column;
  gap: 42px;
  max-width: 100%;
}

/* Hero text block: OnePieceArcCatalogue.qml spacing: 7 */
.op-hero-header {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

#arcSeaEyebrow {
  color: var(--op-gold);
  font-family: var(--op-ui);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2.6px;
  text-transform: uppercase;
  margin: 0;
}

#arcHeroTitle {
  color: var(--op-ink);
  font-family: var(--op-display);
  font-size: 44px;
  font-weight: 700;
  line-height: 1.08;

}

#arcHeroSummary {
  width: min(76%, 900px);
  color: var(--op-ink-dim);
  font-family: var(--op-ui);
  font-size: 13px;
  line-height: 1.25;

}

/* Source metadata & lane navigation strip */
.op-hero-meta-strip {
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 18px;
}

.op-meta-fact {
  display: inline-flex;
  align-items: baseline;

}

.op-meta-fact strong {
  color: var(--op-ink-dimmer);

  text-transform: uppercase;
}

.op-ongoing-badge {

  color: var(--op-gold);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.3px;
  text-transform: uppercase;
}

.op-mapping-note {
  margin: 2px 0 0;
  width: min(76%, 900px);
  color: var(--op-ink-dimmer);

}

.op-lane-jump-bar {
  margin-top: 6px;

}

.op-lane-jump-btn {

  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--op-edge);

  color: var(--op-ink-dim);
  font-family: var(--op-ui);
  font-size: 11px;

}

.op-lane-jump-btn:hover,
.op-lane-jump-btn:focus-visible,
.op-lane-jump-btn[aria-current="true"] {
  border-color: var(--op-gold);
  color: var(--op-gold);
  background: rgba(240, 196, 74, 0.10);
  outline: none;
}

/* Lane section block: OnePieceArcCatalogue.qml spacing: 18 */
.op-catalogue-lane {
  display: flex;
  flex-direction: column;
  gap: 18px;
  width: 100%;
}

.op-catalogue-lane[hidden] {
  display: none !important;
}

/* WidgetHeader.qml: implicitHeight 30, title 22px Fraunces, sub 12px Segoe UI */
.op-widget-header {
  min-height: 30px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}

.op-widget-header-left {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 10px;
}

.op-widget-title {
  margin: 0;
  color: var(--op-ink);
  font-family: var(--op-display);
  font-size: 22px;
  font-weight: 600;
  line-height: 1.15;
}

.op-widget-sub {
  color: var(--op-ink-dim);
  font-family: var(--op-ui);
  font-size: 12px;
}

/* Horizontal Flickable row for 16:9 episode/title cards (height: 216, spacing: 20) */
.op-episode-strip {
  width: 100%;
  height: 216px;
  overflow-x: auto;
  overflow-y: hidden;
  display: flex;
  align-items: flex-start;
  gap: 20px;
  padding: 2px 2px 6px;
  scroll-behavior: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
}

/* OnePieceEpisodeCard.qml: width 278, height 208, radius 14, color #101419 */
.op-episode-card {
  width: 278px;
  height: 208px;
  flex: 0 0 278px;
  position: relative;
  border-radius: 14px;

  color: var(--op-ink);
  font-family: var(--op-ui);
  overflow: hidden;
  cursor: pointer;
  transition: border-color 120ms ease, box-shadow 120ms ease;
}

.op-episode-card:hover,
.op-episode-card:focus-visible {
  border-color: var(--op-gold);
  box-shadow: 0 0 0 1px var(--op-gold);
  outline: none;
}

/* Top 16:9 media slot: height 150 */
.op-episode-media {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 150px;
  background: linear-gradient(145deg, #121821 0%, #0b0f15 100%);
  overflow: hidden;
}

/* Neutral 16:9 placeholder slot (ARTWORK-SEAM.md) */
.op-episode-placeholder {
  position: absolute;
  inset: 0;
  padding: 14px 14px 30px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  pointer-events: none;
}

.op-placeholder-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.op-placeholder-badge {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: var(--op-ink-dim);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.1px;
  text-transform: uppercase;
}

.op-placeholder-aspect {
  color: var(--op-ink-dimmer);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.8px;
}

.op-placeholder-center {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.op-placeholder-epnum {
  color: var(--op-ink-dim);
  font-family: var(--op-display);
  font-size: 20px;
  font-weight: 700;
  line-height: 1.1;
}

.op-placeholder-key {
  color: var(--op-ink-dimmer);
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 9px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.op-resolved-art {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  z-index: 2;
}

/* Bottom gradient & caption: OnePieceEpisodeCard.qml height 76, margins 12 */
.op-episode-scrim {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 76px;
  background: linear-gradient(
    180deg,
    rgba(8, 10, 13, 0.35) 0%,
    rgba(8, 10, 13, 0.98) 100%
  );
  z-index: 3;
  pointer-events: none;
}

.op-episode-caption {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 12px;
  z-index: 4;
  display: flex;
  flex-direction: column;
  gap: 3px;
  pointer-events: none;
}

.op-episode-source {
  color: var(--op-gold);
  font-family: var(--op-ui);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.op-episode-title {
  color: var(--op-ink);
  font-family: var(--op-ui);
  font-size: 12px;
  font-weight: 700;
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Horizontal Flickable row for 2:3 volume cards (OnePieceArcCatalogue.qml height: 380, Row y: 36, spacing: 20) */
.op-volume-strip {
  width: 100%;
  height: 380px;
  padding-top: 36px;
  overflow-x: auto;
  overflow-y: hidden;
  display: flex;
  align-items: flex-start;
  gap: 20px;
  scroll-behavior: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
}

/* OnePieceVolumeCard.qml: bookWidth 184, bookHeight 276 (2:3), captionHeight 54 -> 202x330 */
.op-volume-card {
  width: 202px;
  height: 330px;
  flex: 0 0 202px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--op-ink);
  font-family: var(--op-ui);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  transform-origin: center bottom;
  transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
}

.op-volume-card:hover,
.op-volume-card:focus-visible {
  transform: scale(1.10);
  outline: none;
}

.op-volume-cover-box {
  width: 184px;
  height: 276px;
  flex: 0 0 276px;
  position: relative;
  border-radius: 6px;
  overflow: hidden;
  background: var(--op-glass-tint);
  border: 1px solid var(--op-edge);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: border-color 140ms ease, border-width 140ms ease;
}

.op-volume-card:hover .op-volume-cover-box {
  border-color: var(--op-edge-hover);
}

.op-volume-card:focus-visible .op-volume-cover-box {
  border: 2px solid var(--op-gold);
}

.op-volume-placeholder {
  position: absolute;
  inset: 0;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  text-align: center;
  pointer-events: none;
}

.op-volume-edition-pill {
  padding: 3px 8px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: var(--op-ink-dim);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.1px;
  text-transform: uppercase;
}

.op-volume-card[data-edition="color"] .op-volume-edition-pill {
  border-color: rgba(240, 196, 74, 0.42);
  color: var(--op-gold);
  background: rgba(240, 196, 74, 0.10);
}

.op-volume-vol-label {
  color: var(--op-ink-dimmer);
  font-family: var(--op-display);
  font-size: 28px;
  font-weight: 700;
  line-height: 1.1;
}

.op-volume-seam-meta {
  width: 100%;
  color: var(--op-ink-dimmer);
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 8.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.op-volume-caption {
  margin-top: 12px;
  width: 184px;
  color: var(--op-ink);
  font-family: var(--op-ui);
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Unmapped lane quiet notice (when Live Action has 0 mapped episodes on an arc) */
.op-lane-empty-note {
  padding: 16px 20px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.10);
  color: var(--op-ink-dimmer);
  font-size: 12px;
  line-height: 1.4;
}

  left: 50%;
  bottom: 20px;

  border-radius: 10px;
  background: rgba(12, 16, 23, 0.96);
  border: 1px solid var(--op-gold);
  box-shadow: 0 10px 32px rgba(0, 0, 0, 0.65);
  color: var(--op-ink);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  font-size: 12px;
  line-height: 1.4;
}

#arcRouteToast[hidden] {
  display: none !important;
}

.op-toast-details {
  min-width: 0;
  flex: 1;
}

.op-toast-kicker {
  color: var(--op-gold);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 1.3px;
  text-transform: uppercase;
}

.op-toast-body {
  color: var(--op-ink);
  font-weight: 600;
  margin-top: 2px;
}

.op-toast-seam {
  color: var(--op-ink-dimmer);
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 10.5px;
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.op-toast-close {
  min-width: 44px;
  min-height: 36px;
  padding: 0 10px;
  border-radius: 6px;
  border: 1px solid var(--op-edge);
  background: rgba(255, 255, 255, 0.06);
  color: var(--op-ink);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}

.op-toast-close:hover,
.op-toast-close:focus-visible {
  border-color: var(--op-gold);
  color: var(--op-gold);
  outline: none;
}

/* Reduced motion & mobile responsiveness */
@media (prefers-reduced-motion: reduce) {
  #onePieceArcCatalogue,
  .op-episode-strip,
  .op-volume-strip {
    scroll-behavior: auto !important;
  }
  .op-volume-card {
    transition: none !important;
  }
  .op-volume-card:hover,
  .op-volume-card:focus-visible {
    transform: none !important;
  }
}

@media (max-width: 680px) {
  :root {
