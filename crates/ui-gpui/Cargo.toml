[package]
name = "ui-gpui"
version.workspace = true
edition.workspace = true

[dependencies]
gpui = "0.2"
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json = "1"
env_logger = "0.11"
image = { version = "0.25", default-features = false }
smallvec = "1"
player = { path = "../player" }
ui-widgets = { path = "../ui-widgets" }

# macOS .app bundle metadata for cargo-bundle (see scripts/bundle-macos.sh).
# The executable is the package's single [[bin]] target: `ui-gpui` (src/main.rs);
# cargo-bundle emits CFBundleName/CFBundleExecutable/NSHighResolutionCapable itself.
[package.metadata.bundle]
name = "Colosseum"
identifier = "io.Brotherhood.Colosseum"
