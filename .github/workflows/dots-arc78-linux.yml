# Validation-only workflow: application source stays pinned; no release publication.
name: Arc 78 Linux plugins validation
'on':
  push:
    branches:
    - dots/arc78-plugins-linux-validation
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: arc78-linux-plugins-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 446d50c085fc7bcaec32ec3e7822eeda7352d35c
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Public path guard tests
      run: python -m unittest -v tests.test_public_path_guard
    - name: Reject maintainer-private paths
      run: python scripts/check_public_paths.py
  linux-runtime-contract:
    needs: public-trust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 446d50c085fc7bcaec32ec3e7822eeda7352d35c
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install minimum Linux runtime libraries
      run: "sudo apt-get update\nsudo apt-get install -y --no-install-recommends \\\n  libxcb-cursor0 libmpv2\n"
    - name: Verify Linux runtime dependency contract
      run: 'python -m unittest -v tests.test_linux_runtime_dependency_gate

        python scripts/linux_runtime_dependency_gate.py

        # mpv CLI is optional for the beta: missing means DVR fails closed, not Player 1.

        apt-cache show mpv >/dev/null

        '
  linux-desktop:
    needs: public-trust
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ECM_VERSION: 6.15.0
      ECM_SHA256: f7cd022095a9e6bdbe5897720a24bfda81d211757b7c08b173061962bf2ee0b2
      MPVQT_VERSION: 1.2.0
      MPVQT_SHA256: 8660ad79c0d60fed77f29b36e1742841466af5405de702c81a121e6eeb625ebb
      LLVM_VERSION: 20.1.2
    steps:
    - uses: actions/checkout@v7
      with:
        ref: 446d50c085fc7bcaec32ec3e7822eeda7352d35c
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install Qt 6.11.1
      uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
      with:
        version: 6.11.1
        host: linux
        target: desktop
        arch: linux_gcc_64
        modules: qtwebengine qtwebchannel qtwebsockets qtpositioning qtserialport qtimageformats qtquick3d qtshadertools
        aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
        cache: true
    - name: Install Linux desktop dependencies
      run: "sudo apt-get update\nsudo apt-get install -y --no-install-recommends \\\n  build-essential ninja-build pkg-config\
        \ ccache \\\n  libmpv-dev libtorrent-rasterbar-dev libboost-all-dev libssl-dev libsecret-1-dev libsecret-tools \\\n\
        \  libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxcb-cursor0 \\\n  xvfb xauth ffmpeg p7zip-full libarchive-tools\
        \ patchelf dpkg-dev libgdk-pixbuf-2.0-dev librsvg2-common gnome-keyring dbus-daemon xdotool scrot\nccache --max-size=1G\n"
    - name: Linux release packaging contract
      run: '# Relocation fixtures must not inherit the build SDK loader override.

        env -u LD_LIBRARY_PATH -u LD_PRELOAD python3 tools/linux-release/test_packaging.py

        '
    - name: Install and verify Linux clang-tidy
      id: clang_tidy_setup
      timeout-minutes: 90
      run: 'sudo apt-get install -y --no-install-recommends clang-tidy-20

        clang-tidy-20 --version

        '
    - name: Restore Linux compiler cache
      id: restore-linux-ccache
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/ccache
        key: linux-ccache-v1-${{ runner.os }}-${{ github.sha }}
        restore-keys: 'linux-ccache-v1-${{ runner.os }}-

          '
    - name: Verify Linux toolchain
      run: 'cmake --version

        ninja --version

        c++ --version | head -1

        ccache --version | head -1

        pkg-config --modversion mpv

        '
    - name: Validate clang-tidy gate helper on Linux
      id: clang_tidy_helper
      timeout-minutes: 90
      env:
        PYTHONPATH: .
      run: python tests/test_clang_tidy_quality_gate.py
    - name: Build Extra CMake Modules
      run: "archive=\"$RUNNER_TEMP/extra-cmake-modules.tar.xz\"\nsource=\"$RUNNER_TEMP/ecm-source\"\nbuild=\"$RUNNER_TEMP/ecm-build\"\
        \ninstall=\"$RUNNER_TEMP/ecm-install\"\ncurl --fail --location --retry 3 \\\n  \"https://download.kde.org/Attic/frameworks/6.15/extra-cmake-modules-$ECM_VERSION.tar.xz\"\
        \ \\\n  --output \"$archive\"\necho \"$ECM_SHA256  $archive\" | sha256sum --check --strict\nmkdir -p \"$source\"\n\
        tar -xf \"$archive\" -C \"$source\" --strip-components=1\ncmake -S \"$source\" -B \"$build\" -G Ninja \\\n  -DCMAKE_BUILD_TYPE=Release\
        \ \\\n  -DBUILD_TESTING=OFF \\\n  -DCMAKE_INSTALL_PREFIX=\"$install\"\ncmake --build \"$build\" --target install --parallel\
        \ 2\necho \"ECM_ROOT=$install\" >> \"$GITHUB_ENV\"\n"
    - name: Build MpvQt
      run: "archive=\"$RUNNER_TEMP/mpvqt.tar.xz\"\nsource=\"$RUNNER_TEMP/mpvqt-source\"\nbuild=\"$RUNNER_TEMP/mpvqt-build\"\
        \ninstall=\"$RUNNER_TEMP/mpvqt-install\"\ncurl --fail --location --retry 3 --retry-all-errors \\\n  --retry-delay\
        \ 5 --connect-timeout 30 --max-time 180 \\\n  \"https://download.kde.org/stable/mpvqt/mpvqt-$MPVQT_VERSION.tar.xz\"\
        \ \\\n  --output \"$archive\"\necho \"$MPVQT_SHA256  $archive\" | sha256sum --check --strict\nmkdir -p \"$source\"\
        \ntar -xf \"$archive\" -C \"$source\" --strip-components=1\ncmake -S \"$source\" -B \"$build\" -G Ninja \\\n  -DCMAKE_BUILD_TYPE=Release\
        \ \\\n  -DBUILD_EXAMPLES=OFF \\\n  -DCMAKE_INSTALL_PREFIX=\"$install\" \\\n  -DCMAKE_PREFIX_PATH=\"$QT_ROOT_DIR;$ECM_ROOT\"\
        \ncmake --build \"$build\" --target install --parallel 2\necho \"MPVQT_ROOT=$install\" >> \"$GITHUB_ENV\"\n"
    - name: Configure Colosseum on Linux
      env:
        COLOSSEUM_TMDB_KEY: ${{ secrets.COLOSSEUM_TMDB_KEY }}
      run: "build=\"$RUNNER_TEMP/colosseum-linux-build\"\nprefix=\"$QT_ROOT_DIR;$ECM_ROOT;$MPVQT_ROOT\"\ncmake -S native -B\
        \ \"$build\" -G Ninja \\\n  -DCMAKE_BUILD_TYPE=Release \\\n  -DBUILD_TESTING=ON \\\n    -DCOLOSSEUM_NO_ACCOUNT_EDITION=OFF\
        \ \\\n    -DCOLOSSEUM_UPDATE_TESTING=OFF \\\n    -DCOLOSSEUM_FERIA_IN_APP=OFF \\\n    -DCOLOSSEUM_VINYL_IN_APP=OFF\
        \ \\\n    -DCOLOSSEUM_ENABLE_VINYL_QUALIFICATION=OFF \\\n    -DCOLOSSEUM_ENABLE_VINYL_TEST_FIXTURES=OFF \\\n    -DCOLOSSEUM_CONTENT_API_URL=https://colosseum-content-api.colosseum-watchparty-relay.workers.dev\
        \ \\\n  -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \\\n  -DCOLOSSEUM_BUILD_PLAYER2=OFF \\\n  -DCOLOSSEUM_PLAYER2_IN_APP=OFF\
        \ \\\n  -DCOLOSSEUM_NO_COMPILER_CACHE=ON \\\n  -DCMAKE_C_COMPILER_LAUNCHER=ccache \\\n  -DCMAKE_CXX_COMPILER_LAUNCHER=ccache\
        \ \\\n  -DCMAKE_PREFIX_PATH=\"$prefix\" \\\n  -DMPVQT_PREFIX=\"$MPVQT_ROOT\"\ngrep -Eq '^CMAKE_C_COMPILER_LAUNCHER:.*=ccache$'\
        \ \"$build/CMakeCache.txt\"\ngrep -Eq '^CMAKE_CXX_COMPILER_LAUNCHER:.*=ccache$' \"$build/CMakeCache.txt\"\necho \"\
        COLOSSEUM_LINUX_BUILD=$build\" >> \"$GITHUB_ENV\"\n"
    - name: Build Linux desktop and tests
      run: cmake --build "$COLOSSEUM_LINUX_BUILD" --parallel 2
    - name: Save Linux compiler cache
      if: always() && steps.restore-linux-ccache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/ccache
        key: ${{ steps.restore-linux-ccache.outputs.cache-primary-key }}
    - name: Audit Linux CTest inventory
      run: "inventory=\"$RUNNER_TEMP/ctest-inventory.json\"\nctest --test-dir \"$COLOSSEUM_LINUX_BUILD\" --show-only=json-v1\
        \ > \"$inventory\"\npython - \"$inventory\" <<'PY'\nimport json\nimport sys\n\ntests = json.load(open(sys.argv[1],\
        \ encoding=\"utf-8\"))[\"tests\"]\nwindows = []\nnon_windows = []\nrequires_x11 = []\nshell_leaks = []\nmissing_commands\
        \ = []\nnuvio_tests = {\n    \"colosseum.nuvio_repository_store_test\",\n    \"colosseum.nuvio_plugin_host_test\"\
        ,\n    \"colosseum.nuvio_source_resolver_test\",\n}\ncanary = None\nfor test in tests:\n    props = {p[\"name\"]:\
        \ p[\"value\"] for p in test.get(\"properties\", [])}\n    labels = {str(label).lower() for label in props.get(\"\
        LABELS\", [])}\n    command = test.get(\"command\", [])\n    if \"windows\" in labels:\n        windows.append(test[\"\
        name\"])\n    else:\n        non_windows.append(test[\"name\"])\n    if \"requires-x11\" in labels:\n        requires_x11.append(test[\"\
        name\"])\n    if \"windows\" not in labels and not command:\n        missing_commands.append(test[\"name\"])\n   \
        \ if command and \"powershell\" in str(command[0]).lower() and \"windows\" not in labels:\n        shell_leaks.append(test[\"\
        name\"])\n    if test[\"name\"] == \"colosseum.selftest.red_canary\":\n        canary = props.get(\"WILL_FAIL\")\n\
        \nprint(f\"CTEST_TOTAL={len(tests)}\")\nprint(f\"CTEST_WINDOWS={len(windows)}\")\nprint(f\"CTEST_NON_WINDOWS={len(non_windows)}\"\
        )\nprint(f\"CTEST_REQUIRES_X11={len(requires_x11)}\")\nregistered = {test[\"name\"] for test in tests}\nmissing_nuvio\
        \ = sorted(nuvio_tests - registered)\nif missing_nuvio:\n    raise SystemExit(f\"missing Nuvio CTests: {missing_nuvio}\"\
        )\nnuvio_windows = sorted(nuvio_tests.intersection(windows))\nif nuvio_windows:\n    raise SystemExit(f\"Nuvio CTests\
        \ must remain runnable on Linux: {nuvio_windows}\")\nexpected_x11 = [\"colosseum.qttest.journey_play_video\"]\nif\
        \ requires_x11 != expected_x11:\n    raise SystemExit(f\"unexpected X11 CTest inventory: {requires_x11}\")\nif shell_leaks:\n\
        \    raise SystemExit(f\"PowerShell tests leaked into Linux surface: {shell_leaks}\")\nif missing_commands:\n    raise\
        \ SystemExit(f\"Linux CTests have unresolved commands: {missing_commands}\")\nif canary is not True:\n    raise SystemExit(f\"\
        red canary lost WILL_FAIL semantics: {canary!r}\")\nPY\nctest --test-dir \"$COLOSSEUM_LINUX_BUILD\" -N -LE windows\n"
    - name: Advisory Vinyl CTests
      continue-on-error: true
      env:
        QT_QPA_PLATFORM: offscreen
        QT_FORCE_STDERR_LOGGING: '1'
      run: "mkdir -p linux-evidence\n# Vinyl remains advisory until Vinyl is scheduled.\nctest --test-dir \"$COLOSSEUM_LINUX_BUILD\"\
        \ \\\n  -L \"^vinyl$\" \\\n  -LE \"^(windows|requires-x11)$\" \\\n  --output-on-failure \\\n  --no-tests=error \\\n\
        \  --parallel 1 --output-junit \"$GITHUB_WORKSPACE/linux-evidence/vinyl.xml\"\n"
    - name: Explicit Nuvio and Sources Sheet tests
      env:
        QT_QPA_PLATFORM: offscreen
        QT_QUICK_BACKEND: software
        QT_FORCE_STDERR_LOGGING: '1'
      run: 'mkdir -p linux-evidence

        ctest --test-dir "$COLOSSEUM_LINUX_BUILD" -R ''^colosseum\.nuvio_(repository_store|plugin_host|source_resolver)_test$''
        --no-tests=error --output-on-failure 2>&1 | tee linux-evidence/nuvio-ctests.log

        "$COLOSSEUM_LINUX_BUILD/colosseum_qml_tests" -input tests/qml/tst_sources_sheet_nuvio.qml 2>&1 | tee linux-evidence/sources-sheet-qml.log

        '
    - name: Run platform-neutral Linux CTests
      env: &id001
        QT_QPA_PLATFORM: offscreen
        QT_FORCE_STDERR_LOGGING: '1'
      run: "# This full suite includes an explicit unavailable-vault negative contract.\n# Do not let runner D-Bus autoactivate\
        \ a locked keyring. The real unlocked\n# platform path is exercised separately below without skipping any CTest.\n\
        mkdir -p linux-evidence\nabsent_bus=\"$(mktemp -d)\"\ntrap 'rm -rf \"$absent_bus\"' EXIT\nDBUS_SESSION_BUS_ADDRESS=\"\
        unix:path=$absent_bus/absent-session\" \\\nctest --test-dir \"$COLOSSEUM_LINUX_BUILD\" \\\n  -LE \"^(windows|requires-x11|vinyl)$\"\
        \ \\\n  --output-on-failure --parallel 1 \\\n  --output-junit \"$GITHUB_WORKSPACE/linux-evidence/blocking.xml\" \\\
        \n  | tee linux-evidence/blocking.log\n"
    - name: Verify Stremio persistence with real Linux secure storage
      env: *id001
      run: "# A reachable Secret Service is not necessarily an unlocked writable vault.\n# Exercise the real Linux credential\
        \ backend with a disposable private keyring.\nkeyring_root=\"$(mktemp -d)\"\ntrap 'rm -rf \"$keyring_root\"' EXIT\n\
        mkdir -p \"$keyring_root/data\" \"$keyring_root/config\" \"$keyring_root/runtime\" \"$keyring_root/control\"\nchmod\
        \ 700 \"$keyring_root/runtime\"\nXDG_DATA_HOME=\"$keyring_root/data\" XDG_CONFIG_HOME=\"$keyring_root/config\" \\\n\
        XDG_RUNTIME_DIR=\"$keyring_root/runtime\" GNOME_KEYRING_CONTROL=\"$keyring_root/control\" \\\ndbus-run-session --\
        \ bash -euo pipefail -c '\n  printf \"%s\\n\" \"isolated-validation-password\" | gnome-keyring-daemon --unlock --components=secrets\
        \ --control-directory \"$GNOME_KEYRING_CONTROL\"\n  printf \"%s\" \"roundtrip-proof\" | secret-tool store --label=\"\
        CI availability probe\" colosseum-ci probe\n  test \"$(secret-tool lookup colosseum-ci probe)\" = \"roundtrip-proof\"\
        \n  secret-tool clear colosseum-ci probe\n  mapfile -t binaries < <(find \"$COLOSSEUM_LINUX_BUILD\" -type f -name\
        \ tst_account_attachment_runtime)\n  test \"${#binaries[@]}\" = 1\n  \"${binaries[0]}\" stremioBrowserLoginPersistsAcrossRuntimeRestart\
        \ | tee linux-evidence/stremio-secure-store.log\n'\n"
    - name: Run X11-dependent Linux CTests
      env:
        QT_QPA_PLATFORM: xcb
        QT_FORCE_STDERR_LOGGING: '1'
        LIBGL_ALWAYS_SOFTWARE: '1'
      run: "xvfb-run -a ctest --test-dir \"$COLOSSEUM_LINUX_BUILD\" \\\n  -L requires-x11 \\\n  -LE windows \\\n  --output-on-failure\
        \ \\\n  --parallel 1 --output-junit \"$GITHUB_WORKSPACE/linux-evidence/x11.xml\"\n"
    - name: Build matching Qt TIFF plugin with bundled libtiff
      run: "git init \"$RUNNER_TEMP/qtimageformats\"\ngit -C \"$RUNNER_TEMP/qtimageformats\" remote add origin https://github.com/qt/qtimageformats.git\n\
        git -C \"$RUNNER_TEMP/qtimageformats\" fetch --depth 1 origin 77f35e5694885844c3eb3a737769b5ed290b8ccc\ngit -C \"\
        $RUNNER_TEMP/qtimageformats\" checkout --detach FETCH_HEAD\ncmake -S \"$RUNNER_TEMP/qtimageformats\" -B \"$RUNNER_TEMP/qtimageformats-build\"\
        \ -G Ninja \\\n  -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=\"$QT_ROOT_DIR\" \\\n  -DFEATURE_system_tiff=OFF -DQT_BUILD_EXAMPLES=OFF\
        \ -DQT_BUILD_TESTS=OFF\ncmake --build \"$RUNNER_TEMP/qtimageformats-build\" --target QTiffPlugin --parallel 2\n"
    - name: Assemble and verify Linux runtime
      run: "notices=\"$RUNNER_TEMP/notices\"\nmkdir -p \"$notices/host-copyrights\"\ncp -r \"$RUNNER_TEMP/mpvqt-source/LICENSES\"\
        \ \"$notices/MpvQt-LICENSES\"\ncp -r \"$RUNNER_TEMP/qtimageformats/LICENSES\" \"$notices/QtImageFormats-LICENSES\"\
        \ncp \"$RUNNER_TEMP/qtimageformats/src/3rdparty/libtiff/COPYRIGHT\" \"$notices/libtiff-COPYRIGHT\"\ncp \"$RUNNER_TEMP/qtimageformats/src/3rdparty/libtiff/qt_attribution.json\"\
        \ \"$notices/libtiff-qt_attribution.json\"\nfind /usr/share/doc -name copyright -type f -exec cp --parents '{}' \"\
        $notices/host-copyrights/\" ';'\ndpkg-query -W -f='${Package}\\t${Version}\\t${source:Package}\\t${source:Version}\\\
        n' > \"$notices/ubuntu-package-provenance.tsv\"\nprintf '%s\\n' 'Private review candidate. Bundled libmpv/FFmpeg/Qt\
        \ dependencies retain their own licenses. Corresponding-source and redistribution obligations remain a public-release\
        \ gate.' > \"$notices/NOTICE-CANDIDATE.txt\"\nargs=()\n# The app uses SQLite, not the SDK's optional external database\
        \ clients.\nfor plugin in \"$QT_ROOT_DIR\"/plugins/sqldrivers/*.so; do\n  [[ \"$(basename \"$plugin\")\" == libqsqlite.so\
        \ ]] || args+=(--exclude-plugin \"sqldrivers/$(basename \"$plugin\")\")\ndone\ntiff=\"$(find \"$RUNNER_TEMP/qtimageformats-build\"\
        \ -name libqtiff.so -type f -print -quit)\"\ntest -n \"$tiff\"\nargs+=(--plugin-override \"imageformats/libqtiff.so=$tiff\"\
        )\npixbuf_loaders=\"$(pkg-config --variable=gdk_pixbuf_moduledir gdk-pixbuf-2.0)\"\npixbuf_query=\"$(pkg-config --variable=gdk_pixbuf_query_loaders\
        \ gdk-pixbuf-2.0)\"\ntest -d \"$pixbuf_loaders\"\ntest -x \"$pixbuf_query\"\nargs+=(--gdk-pixbuf-loaders-dir \"$pixbuf_loaders\"\
        \ --gdk-pixbuf-query-loaders \"$pixbuf_query\")\npython3 tools/linux-release/assemble.py \\\n  --source \"$GITHUB_WORKSPACE\"\
        \ --build \"$COLOSSEUM_LINUX_BUILD\" --qt \"$QT_ROOT_DIR\" \\\n  --stage \"$RUNNER_TEMP/AppDir\" --commit \"$(git\
        \ rev-parse HEAD)\" --patchelf \"$(command -v patchelf)\" \\\n  --dep-lib \"$RUNNER_TEMP/mpvqt-install/lib\" --dep-lib\
        \ \"$RUNNER_TEMP/mpvqt-install/lib/x86_64-linux-gnu\" \\\n  --binary /usr/bin/ffmpeg --binary /usr/bin/ffprobe --dependency-notices\
        \ \"$notices\" \"${args[@]}\"\nmkdir -p release-output\npython3 tools/linux-release/check_package.py \"$RUNNER_TEMP/AppDir\"\
        \ --report release-output/package-check.json\npython3 scripts/linux_runtime_dependency_gate.py --appdir \"$RUNNER_TEMP/AppDir\"\
        \ncp \"$RUNNER_TEMP/AppDir/BUILD-IDENTITY.json\" release-output/\npython3 tools/linux-release/package_deb.py --stage\
        \ \"$RUNNER_TEMP/AppDir\" --output release-output/Colosseum-arc78-linux-amd64.deb\nar t release-output/Colosseum-arc78-linux-amd64.deb\
        \ > release-output/deb-archive-members.txt\nprintf 'debian-binary\\ncontrol.tar.xz\\ndata.tar.xz\\n' | diff -u - release-output/deb-archive-members.txt\n"
    - name: Upload exact Linux package and identity
      uses: actions/upload-artifact@v4
      with:
        name: arc78-linux-package
        path: release-output/
        retention-days: 7
        if-no-files-found: error
    - name: Run clang-tidy correctness gate on Linux
      id: clang_tidy_analysis
      if: steps.clang_tidy_setup.outcome == 'success'
      timeout-minutes: 90
      run: "python scripts/clang_tidy_quality_gate.py \\\n  --clang-tidy \"$(command -v clang-tidy-20)\" \\\n  --compile-commands\
        \ \"$COLOSSEUM_LINUX_BUILD/compile_commands.json\" \\\n  --source-root native \\\n  --allowlist .github/clang-tidy-allowlist.txt\
        \ \\\n  --required-version \"$LLVM_VERSION\" \\\n  --jobs 1 \\\n  --min-files 184\n"
    - name: Show compiler-cache statistics
      if: always()
      run: ccache --show-stats || true
    - name: Collect validation evidence
      if: always()
      run: 'mkdir -p linux-evidence

        cp "$COLOSSEUM_LINUX_BUILD"/Testing/Temporary/Last*.log linux-evidence/ 2>/dev/null || true

        cp "$RUNNER_TEMP/ctest-inventory.json" linux-evidence/ 2>/dev/null || true

        git rev-parse HEAD > linux-evidence/tested-source-sha.txt

        '
    - name: Upload Linux test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: arc78-linux-tests
        path: linux-evidence/
        retention-days: 7
