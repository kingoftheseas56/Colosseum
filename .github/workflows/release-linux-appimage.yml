name: Qualify Colosseum 1.3.0 AppImage

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Existing tagged application identity; no source build occurs
        required: true
        default: '1c22f0b3935367073dee1ad3e1e2dc0b16857d53'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  package:
    name: Package checked AppDir (no rebuild)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify fixed application pin
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$SOURCE_SHA" = 1c22f0b3935367073dee1ad3e1e2dc0b16857d53
      - uses: actions/download-artifact@v4
        with:
          name: Colosseum-1.3.0-linux-deb-candidate
          run-id: '43232636422'
          github-token: ${{ github.token }}
          path: received
      - name: Install packaging tools and system graphics baseline
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 binutils zstd desktop-file-utils libgl1 libegl1 libglx0 libglvnd0 libopengl0 libdrm2 libgbm1 libvulkan1 libva2 libva-drm2 libva-x11-2
      - name: Package the retained checked AppDir and audit extracted contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd received
          sha256sum --check --strict Colosseum-1.3.0-linux-AppDir.tar.zst.sha256
          cd ..
          python3 tools/linux-release/package_appimage.py \
            --archive received/Colosseum-1.3.0-linux-AppDir.tar.zst \
            --baseline-report received/package-check.json --output candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Colosseum-1.3.0-linux-appimage-candidate
          path: candidate/
          if-no-files-found: warn
          retention-days: 14

  qualify:
    needs: package
    name: AppImage (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-24.04
            image: ubuntu@sha256:77eb101c607d6e3d4f5ad0c8a02c2136c689b98aba1f359e6502ba517e5c57ec
          - label: fedora-41
            image: registry.fedoraproject.org/fedora@sha256:3fb969dd07e631c17d12f5955bcb6db2078a6997eb68be76b6492e7bd6052e88
          - label: arch
            image: archlinux@sha256:fcee73ea1b96e236248f53a213f71276cc9072d9025b58bce9915e32f19963ae
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: Colosseum-1.3.0-linux-appimage-candidate
          path: candidate
      - name: Install desktop system baseline without a Qt SDK
        env:
          DISTRO: ${{ matrix.label }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          case "$DISTRO" in
            ubuntu-24.04)
              apt-get update
              apt-get install -y --no-install-recommends python3 binutils xvfb dbus ca-certificates fontconfig fonts-dejavu-core libgl1-mesa-dri libgl1 libegl1 libglx0 libglvnd0 libopengl0 libdrm2 libgbm1 libvulkan1 libva2 libva-drm2 libva-x11-2
              ;;
            fedora-41)
              dnf -y --disablerepo='*' --enablerepo=fedora --enablerepo=updates \
                --setopt=fedora.metalink= --setopt=updates.metalink= \
                --setopt=fedora.baseurl=https://archives.fedoraproject.org/pub/archive/fedora/linux/releases/41/Everything/x86_64/os/ \
                --setopt=updates.baseurl=https://archives.fedoraproject.org/pub/archive/fedora/linux/updates/41/Everything/x86_64/ \
                install python3 binutils xorg-x11-server-Xvfb dbus-daemon dbus-tools ca-certificates fontconfig dejavu-sans-fonts shadow-utils util-linux mesa-dri-drivers mesa-libGL mesa-libEGL libglvnd-glx libglvnd-opengl mesa-libgbm libdrm vulkan-loader libva
              ;;
            arch)
              pacman -Syu --noconfirm --needed python binutils xorg-server-xvfb dbus ca-certificates fontconfig ttf-dejavu shadow util-linux mesa libglvnd libdrm vulkan-icd-loader libva
              ;;
            *) exit 1 ;;
          esac
          useradd --create-home --shell /bin/bash appimage-test
          mkdir -p /tmp/.X11-unix
          chmod 1777 /tmp/.X11-unix
          python3 scripts/restore_source_archive_media.py --scope capture
          chmod 0644 tests/lanista_capture/assets/Colosseum.mp4
      - name: Prepare isolated AppImage launch adapter
        run: |
          cd candidate
          sha256sum --check --strict Colosseum-1.3.0-x86_64.AppImage.sha256
          cd ..
          python3 tools/linux-release/smoke_appimage.py --prepare \
            --image "$GITHUB_WORKSPACE/candidate/Colosseum-1.3.0-x86_64.AppImage" \
            --identity candidate/AppImage-identity.json \
            --baseline-report candidate/appimage-package-check.json \
            --fixture "$GITHUB_WORKSPACE/tests/lanista_capture/assets/Colosseum.mp4" \
            --output /tmp/appimage-evidence
      - name: Qualify real AppImage Home WebEngine mpv and profile restart
        run: |
          cat /etc/os-release > /tmp/appimage-evidence/os-release.txt
          getconf GNU_LIBC_VERSION > /tmp/appimage-evidence/glibc-version.txt
          (dpkg-query -W 2>/dev/null || rpm -qa 2>/dev/null || pacman -Q) > /tmp/appimage-evidence/system-packages.txt
          runuser -u appimage-test -- env TMPDIR=/tmp/colosseum-appimage-130 \
            dbus-run-session -- python3 tools/linux-release/smoke_appimage.py \
            --image "$GITHUB_WORKSPACE/candidate/Colosseum-1.3.0-x86_64.AppImage" \
            --identity candidate/AppImage-identity.json \
            --baseline-report candidate/appimage-package-check.json \
            --fixture "$GITHUB_WORKSPACE/tests/lanista_capture/assets/Colosseum.mp4" \
            --output /tmp/appimage-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Colosseum-1.3.0-appimage-evidence-${{ matrix.label }}
          path: /tmp/appimage-evidence/
          if-no-files-found: warn
          retention-days: 14
