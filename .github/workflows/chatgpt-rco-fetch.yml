name: Temporary RCO popularity fetch

on:
  push:
    branches:
      - chatgpt-rco-snapshot-scratch
    paths:
      - .github/workflows/chatgpt-rco-fetch.yml
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/chatgpt-rco-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-rco-snapshot-scratch

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Query URLScan captures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import quote

          import requests
          from bs4 import BeautifulSoup

          OUT = Path('.chatgpt-rco-fetch')
          OUT.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers.update({'User-Agent': 'Colosseum-RCO-Recovery/1.0'})

          def parse_titles(html):
              soup = BeautifulSoup(html or '', 'html.parser')
              titles = []
              for block in soup.select('.list-comic .item'):
                  title = ''
                  tooltip_html = block.get('title', '')
                  if tooltip_html:
                      tooltip = BeautifulSoup(tooltip_html, 'html.parser')
                      node = tooltip.select_one('p.title')
                      if node:
                          title = node.get_text(' ', strip=True)
                  if not title:
                      node = block.select_one('span.title')
                      if node:
                          title = node.get_text(' ', strip=True)
                  if not title:
                      anchor = block.select_one('a[href*="/Comic/"]')
                      if anchor:
                          title = anchor.get_text(' ', strip=True)
                  if title:
                      titles.append(title)
              return titles

          report = {'pages': {}}
          for page in (3, 6):
              target = f'https://readcomiconline.li/ComicList/MostPopular?page={page}'
              queries = [
                  f'page.url:"{target}"',
                  f'task.url:"{target}"',
                  f'filename:"MostPopular" AND domain:readcomiconline.li',
                  f'domain:readcomiconline.li AND page.url:*MostPopular*page={page}*',
              ]
              page_report = {'target': target, 'searches': [], 'captures': []}
              uuids = []
              for query in queries:
                  item = {'query': query}
                  try:
                      response = session.get('https://urlscan.io/api/v1/search/', params={'q': query, 'size': 100}, timeout=30)
                      item.update({'status': response.status_code, 'url': response.url, 'prefix': response.text[:1000]})
                      response.raise_for_status()
                      payload = response.json()
                      item['total'] = payload.get('total')
                      item['results_count'] = len(payload.get('results', []))
                      for result in payload.get('results', []):
                          uuid = (result.get('_id') or (result.get('task') or {}).get('uuid') or '').strip()
                          if uuid and uuid not in uuids:
                              uuids.append(uuid)
                  except Exception as exc:
                      item['error'] = repr(exc)
                  page_report['searches'].append(item)

              for uuid in uuids[:100]:
                  capture = {'uuid': uuid}
                  try:
                      result_response = session.get(f'https://urlscan.io/api/v1/result/{uuid}/', timeout=30)
                      capture['result_status'] = result_response.status_code
                      if result_response.ok:
                          payload = result_response.json()
                          capture['task'] = payload.get('task')
                          capture['page'] = payload.get('page')
                          capture['stats'] = payload.get('stats')
                  except Exception as exc:
                      capture['result_error'] = repr(exc)

                  dom_urls = [
                      f'https://urlscan.io/dom/{uuid}/',
                      f'https://urlscan.io/dom/{uuid}',
                      f'https://urlscan.io/screenshots/{uuid}.png',
                  ]
                  for dom_url in dom_urls[:2]:
                      try:
                          dom = session.get(dom_url, timeout=40)
                          titles = parse_titles(dom.text)
                          capture.setdefault('dom_attempts', []).append({
                              'url': dom_url,
                              'status': dom.status_code,
                              'bytes': len(dom.content),
                              'title_count': len(titles),
                              'prefix': dom.text[:500],
                          })
                          if len(titles) == 32:
                              capture['titles'] = titles
                              safe_uuid = uuid.replace('/', '-')
                              (OUT / f'urlscan-page-{page}-{safe_uuid}.html').write_text(dom.text, encoding='utf-8', errors='ignore')
                              break
                      except Exception as exc:
                          capture.setdefault('dom_attempts', []).append({'url': dom_url, 'error': repr(exc)})
                  page_report['captures'].append(capture)

              report['pages'][str(page)] = page_report
              valid = [c for c in page_report['captures'] if len(c.get('titles', [])) == 32]
              print(f'Page {page}: searches={len(page_report["searches"])} uuids={len(uuids)} valid={len(valid)}')

          (OUT / 'urlscan-recovery.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Commit URLScan result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .chatgpt-rco-fetch
          if ! git diff --cached --quiet; then
            git commit -m "chore: store temporary URLScan RCO result"
            git push origin HEAD:chatgpt-rco-snapshot-scratch
          fi
