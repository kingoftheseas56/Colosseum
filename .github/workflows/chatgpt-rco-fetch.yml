name: Temporary RCO popularity fetch

on:
  push:
    branches:
      - chatgpt-rco-snapshot-scratch
    paths:
      - .github/workflows/chatgpt-rco-fetch.yml
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/chatgpt-rco-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-rco-snapshot-scratch

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Query Common Crawl for pages 3 and 6
        run: |
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          OUT = Path('.chatgpt-rco-fetch')
          OUT.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers.update({'User-Agent': 'Colosseum-RCO-Recovery/1.0'})

          def parse_titles(html):
              soup = BeautifulSoup(html or '', 'html.parser')
              titles = []
              for block in soup.select('.list-comic .item'):
                  title = ''
                  tooltip_html = block.get('title', '')
                  if tooltip_html:
                      tooltip = BeautifulSoup(tooltip_html, 'html.parser')
                      node = tooltip.select_one('p.title')
                      if node:
                          title = node.get_text(' ', strip=True)
                  if not title:
                      node = block.select_one('span.title')
                      if node:
                          title = node.get_text(' ', strip=True)
                  if not title:
                      anchor = block.select_one('a[href^="/Comic/"]')
                      if anchor:
                          title = anchor.get_text(' ', strip=True)
                  if title:
                      titles.append(title)
              return titles

          def extract_http_body(warc_bytes):
              try:
                  raw = gzip.decompress(warc_bytes)
              except Exception:
                  raw = warc_bytes
              # Strip WARC headers, then embedded HTTP headers.
              parts = raw.split(b'\r\n\r\n', 2)
              if len(parts) >= 3:
                  body = parts[2]
              elif len(parts) == 2:
                  body = parts[1]
              else:
                  body = raw
              return body.decode('utf-8', errors='ignore')

          report = {'collections': [], 'pages': {}}
          try:
              collections_response = session.get('https://index.commoncrawl.org/collinfo.json', timeout=30)
              collections_response.raise_for_status()
              collections = collections_response.json()
          except Exception as exc:
              report['collections_error'] = repr(exc)
              collections = []

          for collection in collections[:24]:
              report['collections'].append({'id': collection.get('id'), 'api': collection.get('cdx-api')})

          for page in (3, 6):
              url = f'https://readcomiconline.li/ComicList/MostPopular?page={page}'
              page_report = {'url': url, 'queries': [], 'candidates': []}
              for collection in collections[:24]:
                  cid = collection.get('id')
                  api = collection.get('cdx-api')
                  if not api:
                      continue
                  query = {'collection': cid, 'api': api}
                  try:
                      response = session.get(api, params={'url': url, 'output': 'json'}, timeout=30)
                      query.update({'status': response.status_code, 'prefix': response.text[:500]})
                      response.raise_for_status()
                      records = []
                      for line in response.text.splitlines():
                          line = line.strip()
                          if line.startswith('{'):
                              records.append(json.loads(line))
                      query['record_count'] = len(records)
                      for record in reversed(records[-10:]):
                          candidate = {'collection': cid, 'record': record}
                          try:
                              filename = record['filename']
                              offset = int(record['offset'])
                              length = int(record['length'])
                              headers = {'Range': f'bytes={offset}-{offset + length - 1}'}
                              data_url = f'https://data.commoncrawl.org/{filename}'
                              warc_response = session.get(data_url, headers=headers, timeout=60)
                              candidate.update({'status': warc_response.status_code, 'bytes': len(warc_response.content), 'data_url': data_url})
                              warc_response.raise_for_status()
                              html = extract_http_body(warc_response.content)
                              titles = parse_titles(html)
                              candidate['titles'] = titles
                              if len(titles) == 32:
                                  safe_cid = str(cid).replace('/', '-')
                                  (OUT / f'commoncrawl-page-{page}-{safe_cid}.html').write_text(html, encoding='utf-8', errors='ignore')
                                  page_report['candidates'].append(candidate)
                                  break
                          except Exception as exc:
                              candidate['error'] = repr(exc)
                          page_report['candidates'].append(candidate)
                      if any(len(c.get('titles', [])) == 32 for c in page_report['candidates']):
                          page_report['winning_collection'] = cid
                          break
                  except Exception as exc:
                      query['error'] = repr(exc)
                  page_report['queries'].append(query)
              report['pages'][str(page)] = page_report
              valid = [c for c in page_report['candidates'] if len(c.get('titles', [])) == 32]
              print(f'Page {page}: {len(valid)} valid Common Crawl captures')

          (OUT / 'commoncrawl-recovery.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Commit Common Crawl result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .chatgpt-rco-fetch
          if ! git diff --cached --quiet; then
            git commit -m "chore: store temporary Common Crawl RCO result"
            git push origin HEAD:chatgpt-rco-snapshot-scratch
          fi
