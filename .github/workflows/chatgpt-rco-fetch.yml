name: Temporary RCO popularity fetch

on:
  push:
    branches:
      - chatgpt-rco-snapshot-scratch
    paths:
      - .github/workflows/chatgpt-rco-fetch.yml
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/chatgpt-rco-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-rco-snapshot-scratch

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Fetch and parse pages 3 and 6
        run: |
          python - <<'PY'
          import ipaddress
          import json
          import subprocess
          import time
          from pathlib import Path

          import requests
          import urllib3
          from bs4 import BeautifulSoup

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          HOST = "readcomiconline.li"
          out_dir = Path(".chatgpt-rco-fetch")
          out_dir.mkdir(exist_ok=True)

          def valid_ipv4(value):
              try:
                  return ipaddress.ip_address(value).version == 4
              except ValueError:
                  return False

          def resolve_doh():
              ips = []
              attempts = []
              queries = [
                  ("google", "https://dns.google/resolve", {"name": HOST, "type": "A"}, {}, True),
                  ("cloudflare", "https://cloudflare-dns.com/dns-query", {"name": HOST, "type": "A"}, {"accept": "application/dns-json"}, True),
                  ("cloudflare-ip", "https://1.1.1.1/dns-query", {"name": HOST, "type": "A"}, {"accept": "application/dns-json", "host": "cloudflare-dns.com"}, False),
              ]
              for label, endpoint, params, headers, verify in queries:
                  try:
                      response = requests.get(endpoint, params=params, headers=headers, timeout=30, verify=verify)
                      attempts.append({"resolver": label, "status": response.status_code, "body_prefix": response.text[:500]})
                      response.raise_for_status()
                      payload = response.json()
                      for answer in payload.get("Answer", []):
                          candidate = str(answer.get("data", "")).strip()
                          if valid_ipv4(candidate) and candidate not in ips:
                              ips.append(candidate)
                  except Exception as exc:
                      attempts.append({"resolver": label, "error": repr(exc)})
              return ips, attempts

          ips, dns_attempts = resolve_doh()
          print("Resolved IPs:", ips)
          results = {"dns": {"ips": ips, "attempts": dns_attempts}}

          for page in (3, 6):
              url = f"https://{HOST}/ComicList/MostPopular?page={page}"
              html = ""
              attempts = []

              for ip in ips:
                  for try_number in range(1, 4):
                      command = [
                          "curl", "-4", "-L", "--fail", "--silent", "--show-error",
                          "--connect-timeout", "20", "--max-time", "75",
                          "--resolve", f"{HOST}:443:{ip}",
                          "-A", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36",
                          "-H", "Accept-Language: en-US,en;q=0.9",
                          "-H", "Cache-Control: no-cache",
                          url,
                      ]
                      completed = subprocess.run(command, capture_output=True)
                      body = completed.stdout.decode("utf-8", errors="ignore")
                      attempts.append({
                          "ip": ip,
                          "try": try_number,
                          "returncode": completed.returncode,
                          "bytes": len(completed.stdout),
                          "stderr": completed.stderr.decode("utf-8", errors="ignore")[:1000],
                      })
                      if completed.returncode == 0 and ".list-comic" in body:
                          html = body
                          break
                      time.sleep(try_number * 2)
                  if html:
                      break

              (out_dir / f"page-{page}.html").write_text(html, encoding="utf-8", errors="ignore")
              soup = BeautifulSoup(html, "html.parser")
              titles = []
              urls = []
              for block in soup.select(".list-comic .item"):
                  anchor = block.select_one('a[href^="/Comic/"]')
                  title_node = block.select_one("span.title")
                  title = title_node.get_text(" ", strip=True) if title_node else ""
                  if not title:
                      tooltip_html = block.get("title", "")
                      if tooltip_html:
                          tooltip = BeautifulSoup(tooltip_html, "html.parser")
                          tooltip_title = tooltip.select_one("p.title")
                          if tooltip_title:
                              title = tooltip_title.get_text(" ", strip=True)
                  if not title and anchor:
                      title = anchor.get_text(" ", strip=True)
                  if title:
                      titles.append(title)
                      href = anchor.get("href", "") if anchor else ""
                      urls.append(requests.compat.urljoin(f"https://{HOST}", href))

              results[str(page)] = {
                  "source_url": url,
                  "html_bytes": len(html.encode("utf-8")),
                  "titles": titles,
                  "series_urls": urls,
                  "attempts": attempts,
                  "valid": len(titles) == 32,
              }

          (out_dir / "pages-3-6.json").write_text(json.dumps(results, ensure_ascii=False, indent=2), encoding="utf-8")

          for page in (3, 6):
              titles = results[str(page)]["titles"]
              print(f"Page {page}: {len(titles)} titles")
              for index, title in enumerate(titles, start=(page - 1) * 32 + 1):
                  print(f"{index}. {title}")

          if any(not results[str(page)]["valid"] for page in (3, 6)):
              raise SystemExit("Expected exactly 32 titles from each page")
          PY

      - name: Commit fetched snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .chatgpt-rco-fetch
          if ! git diff --cached --quiet; then
            git commit -m "chore: store temporary RCO page snapshot"
            git push origin HEAD:chatgpt-rco-snapshot-scratch
          fi
