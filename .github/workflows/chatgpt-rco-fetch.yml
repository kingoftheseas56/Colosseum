name: Temporary RCO popularity fetch

on:
  push:
    branches:
      - chatgpt-rco-snapshot-scratch
    paths:
      - .github/workflows/chatgpt-rco-fetch.yml
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/chatgpt-rco-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-rco-snapshot-scratch

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Fetch surviving RCO mirror pages
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          OUT = Path('.chatgpt-rco-fetch')
          OUT.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
          })

          def parse_titles(html):
              soup = BeautifulSoup(html or '', 'html.parser')
              titles = []
              for block in soup.select('.list-comic .item'):
                  title = ''
                  tooltip_html = block.get('title', '')
                  if tooltip_html:
                      tooltip = BeautifulSoup(tooltip_html, 'html.parser')
                      node = tooltip.select_one('p.title')
                      if node:
                          title = node.get_text(' ', strip=True)
                  if not title:
                      node = block.select_one('span.title')
                      if node:
                          title = node.get_text(' ', strip=True)
                  if not title:
                      anchor = block.select_one('a[href^="/Comic/"]')
                      if anchor:
                          title = anchor.get_text(' ', strip=True)
                  if title:
                      titles.append(title)
              return titles

          report = {'pages': {}}
          for page in range(1, 9):
              url = 'https://rcostation.xyz/ComicList/MostPopular' + ('' if page == 1 else f'?page={page}')
              entry = {'url': url}
              try:
                  response = session.get(url, timeout=40, allow_redirects=True)
                  titles = parse_titles(response.text)
                  entry.update({'status': response.status_code, 'final_url': response.url, 'bytes': len(response.content), 'titles': titles})
                  (OUT / f'rcostation-page-{page}.html').write_text(response.text, encoding='utf-8', errors='ignore')
              except Exception as exc:
                  entry['error'] = repr(exc)
              report['pages'][str(page)] = entry
              print(f'Page {page}: {len(entry.get("titles", []))} titles')

          (OUT / 'rcostation-pages-1-8.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Commit mirror snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .chatgpt-rco-fetch
          if ! git diff --cached --quiet; then
            git commit -m "chore: store temporary RCO mirror snapshot"
            git push origin HEAD:chatgpt-rco-snapshot-scratch
          fi
