name: Temporary RCO popularity fetch

on:
  push:
    branches:
      - chatgpt-rco-snapshot-scratch
    paths:
      - .github/workflows/chatgpt-rco-fetch.yml
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/chatgpt-rco-fetch.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-rco-snapshot-scratch

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Fetch and parse pages 3 and 6
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          out_dir = Path(".chatgpt-rco-fetch")
          out_dir.mkdir(exist_ok=True)

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
              "Cache-Control": "no-cache",
              "Pragma": "no-cache",
          }

          session = requests.Session()
          session.headers.update(headers)
          results = {}

          for page in (3, 6):
              url = f"https://readcomiconline.li/ComicList/MostPopular?page={page}"
              last_error = None
              html = ""
              status = None
              final_url = url

              for attempt in range(1, 6):
                  try:
                      response = session.get(url, timeout=45, allow_redirects=True)
                      status = response.status_code
                      final_url = response.url
                      html = response.text
                      if response.ok and ".list-comic" in html:
                          break
                      last_error = f"HTTP {status}; bytes={len(response.content)}; final={final_url}"
                  except Exception as exc:
                      last_error = repr(exc)
                  time.sleep(attempt * 3)

              (out_dir / f"page-{page}.html").write_text(html, encoding="utf-8", errors="ignore")
              soup = BeautifulSoup(html, "html.parser")
              titles = []
              urls = []
              for block in soup.select(".list-comic .item"):
                  anchor = block.select_one('a[href^="/Comic/"]')
                  title_node = block.select_one("span.title")
                  title = title_node.get_text(" ", strip=True) if title_node else ""
                  if not title:
                      tooltip_html = block.get("title", "")
                      if tooltip_html:
                          tooltip = BeautifulSoup(tooltip_html, "html.parser")
                          tooltip_title = tooltip.select_one("p.title")
                          if tooltip_title:
                              title = tooltip_title.get_text(" ", strip=True)
                  if not title and anchor:
                      title = anchor.get_text(" ", strip=True)
                  if title:
                      titles.append(title)
                      urls.append(requests.compat.urljoin("https://readcomiconline.li", anchor.get("href", "")) if anchor else "")

              results[str(page)] = {
                  "source_url": url,
                  "final_url": final_url,
                  "status": status,
                  "html_bytes": len(html.encode("utf-8")),
                  "titles": titles,
                  "series_urls": urls,
                  "error": last_error if len(titles) != 32 else None,
              }

          (out_dir / "pages-3-6.json").write_text(
              json.dumps(results, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          for page in (3, 6):
              count = len(results[str(page)]["titles"])
              print(f"Page {page}: {count} titles")
              for index, title in enumerate(results[str(page)]["titles"], start=(page - 1) * 32 + 1):
                  print(f"{index}. {title}")

          if any(len(results[str(page)]["titles"]) != 32 for page in (3, 6)):
              raise SystemExit("Expected exactly 32 titles from each page")
          PY

      - name: Commit fetched snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .chatgpt-rco-fetch
          if ! git diff --cached --quiet; then
            git commit -m "chore: store temporary RCO page snapshot"
            git push origin HEAD:chatgpt-rco-snapshot-scratch
          fi
