name: desktop-ci

on:
  workflow_dispatch:
    inputs:
      b1_native_qualification:
        description: "Run only the bounded Linux B1 full-app catalogue/poster qualification"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-trust:
    if: ${{ !inputs.b1_native_qualification && github.ref != 'refs/heads/dots/b1-cloud-system-proxy-20261018' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Public path guard tests
        run: python -m unittest -v tests.test_public_path_guard
      - name: Reject maintainer-private paths
        run: python scripts/check_public_paths.py

  linux-runtime-contract:
    if: ${{ !inputs.b1_native_qualification && github.ref != 'refs/heads/dots/b1-cloud-system-proxy-20261018' }}
    needs: public-trust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install minimum Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libmpv2
      - name: Verify Linux runtime dependency contract
        run: |
          python -m unittest -v tests.test_linux_runtime_dependency_gate
          python scripts/linux_runtime_dependency_gate.py
          # mpv CLI is optional for the beta: missing means DVR fails closed, not Player 1.
          apt-cache show mpv >/dev/null

  windows-desktop:
    if: ${{ !inputs.b1_native_qualification && github.ref != 'refs/heads/dots/b1-cloud-system-proxy-20261018' }}
    needs: public-trust
    runs-on: windows-2025
    # Dependency setup, CodeQL, clang-tidy, and the ASAN probe build exceed
    # the default 90-minute window on the hosted Windows runner.
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
      security-events: write
    env:
      VCPKG_TAG: "2026.07.29"
      # Upstream retains weekly SourceForge archives; GitHub keeps only 30 tags.
      MPV_VERSION: "20261011-git-accb7b2821"
      MPV_SHA256: "cf63b4ce66e03e5e70acf2648cbc3177656c77c5b9583e16d83efc58801182b7"
      MPVQT_VERSION: "1.2.0"
      MPVQT_SHA256: "8660ad79c0d60fed77f29b36e1742841466af5405de702c81a121e6eeb625ebb"
      LLVM_VERSION: "22.1.8"
      LLVM_SHA256: "16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.11.1"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qtwebengine qtwebchannel qtwebsockets qtpositioning"
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          cache: true
      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Verify desktop toolchain
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          cl 2>&1 | Select-Object -First 5

      - name: Install pinned LLVM clang-tidy
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_VERSION-win64.exe"
          $install = Join-Path $env:RUNNER_TEMP "llvm-$env:LLVM_VERSION"
          $uri = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.exe"
          Invoke-WebRequest -Uri $uri -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:LLVM_SHA256) { throw "LLVM installer checksum mismatch" }
          $process = Start-Process -FilePath $installer -ArgumentList "/S", "/D=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          $clangTidy = Join-Path $install "bin/clang-tidy.exe"
          if (-not (Test-Path $clangTidy)) { throw "clang-tidy.exe missing after LLVM install" }
          "CLANG_TIDY_EXE=$clangTidy" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install native dependencies
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --depth 1 --branch $env:VCPKG_TAG https://github.com/microsoft/vcpkg.git $vcpkg
          & "$vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$vcpkg/vcpkg.exe" install `
            libtorrent:x64-windows `
            openssl:x64-windows `
            boost-filesystem:x64-windows `
            boost-system:x64-windows `
            ecm:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$vcpkg" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "$vcpkg/installed/x64-windows/bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare libmpv
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "mpv-dev.7z"
          $extract = Join-Path $env:RUNNER_TEMP "libmpv"
          $uri = "https://downloads.sourceforge.net/project/mpv-player-windows/libmpv/mpv-dev-x86_64-$env:MPV_VERSION.7z"
          # curl.exe follows the binary mirror redirect instead of the HTML download page.
          curl.exe --fail --location --retry 2 --retry-delay 5 --connect-timeout 30 --max-time 180 --output $archive $uri
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:MPV_SHA256) { throw "libmpv checksum mismatch" }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          7z x $archive "-o$extract" -y | Out-Null
          $dll = Get-ChildItem $extract -Recurse -Filter "libmpv-2.dll" | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll missing from development archive" }
          $root = $dll.Directory.FullName
          $libDir = Join-Path $root "lib"
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null
          $def = Join-Path $root "mpv.def"
          @("LIBRARY libmpv-2.dll", "EXPORTS") | Set-Content $def
          dumpbin /exports $dll.FullName | ForEach-Object {
            if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(mpv_\S+)\s*$') {
              $Matches[1]
            }
          } | Sort-Object -Unique | Add-Content $def
          lib.exe "/def:$def" "/out:$libDir/mpv.lib" /machine:x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $root "include/mpv/client.h"))) { throw "libmpv headers missing" }
          "LIBMPV_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $root | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build MpvQt
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "mpvqt.tar.xz"
          $sourceRoot = Join-Path $env:RUNNER_TEMP "mpvqt-source"
          $build = Join-Path $env:RUNNER_TEMP "mpvqt-build"
          $install = Join-Path $env:RUNNER_TEMP "mpvqt-install"
          $uri = "https://download.kde.org/stable/mpvqt/mpvqt-$env:MPVQT_VERSION.tar.xz"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:MPVQT_SHA256) { throw "MpvQt checksum mismatch" }
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
          tar -xf $archive -C $sourceRoot
          $source = Get-ChildItem $sourceRoot -Directory -Filter "mpvqt-*" | Select-Object -First 1
          if (-not $source) { throw "MpvQt source directory missing" }
          $prefix = "$env:QT_ROOT_DIR;$env:VCPKG_ROOT/installed/x64-windows"
          cmake -S $source.FullName -B $build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_INSTALL_PREFIX=$install" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DCMAKE_PREFIX_PATH=$prefix" `
            "-DLibmpv_INCLUDE_DIRS=$env:LIBMPV_ROOT/include" `
            "-DLibmpv_LIBRARIES=$env:LIBMPV_ROOT/lib/mpv.lib" `
            -DBUILD_EXAMPLES=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build --target install --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "MPVQT_ROOT=$install" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "$install/bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Initialize CodeQL C++
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Configure Colosseum
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "colosseum-build"
          $prefix = "$env:QT_ROOT_DIR;$env:MPVQT_ROOT;$env:VCPKG_ROOT/installed/x64-windows"
          cmake -S native -B $build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DCMAKE_PREFIX_PATH=$prefix" `
            "-DMPVQT_PREFIX=$env:MPVQT_ROOT" `
            "-DLIBMPV_PREFIX=$env:LIBMPV_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "COLOSSEUM_CI_BUILD=$build" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build desktop and release smoke targets
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "colosseum-build.log"
          cmake --build $env:COLOSSEUM_CI_BUILD --target `
            colosseum `
            update_manifest_trust_harness `
            update_install_bridge_harness `
            --parallel 2 2>&1 | Tee-Object -FilePath $log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            Get-Content $log | Where-Object { $_ -match 'FAILED:|fatal error|\berror\b|LNK\d+' } | Select-Object -Last 30 | ForEach-Object {
              $message = $_.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error::$message"
            }
            exit $buildExit
          }

      - name: Release-critical smoke
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          ctest --test-dir $env:COLOSSEUM_CI_BUILD `
            -R 'colosseum\.(update_manifest_trust_harness|update_install_bridge_harness)$' `
            --output-on-failure

      - name: Analyze C++
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp

      - name: Run clang-tidy correctness gate
        shell: pwsh
        run: |
          python scripts/clang_tidy_quality_gate.py `
            --clang-tidy "$env:CLANG_TIDY_EXE" `
            --compile-commands "$env:COLOSSEUM_CI_BUILD/compile_commands.json" `
            --source-root native `
            --allowlist .github/clang-tidy-allowlist.txt `
            --required-version "$env:LLVM_VERSION" `
            --jobs 2 `
            --min-files 184

      - name: Configure AddressSanitizer probes
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "colosseum-asan"
          $prefix = "$env:QT_ROOT_DIR;$env:MPVQT_ROOT;$env:VCPKG_ROOT/installed/x64-windows"
          cmake -S native -B $build -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DBUILD_TESTING=ON `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DCMAKE_PREFIX_PATH=$prefix" `
            "-DMPVQT_PREFIX=$env:MPVQT_ROOT" `
            "-DLIBMPV_PREFIX=$env:LIBMPV_ROOT" `
            "-DCMAKE_C_FLAGS=/fsanitize=address /Zi" `
            "-DCMAKE_CXX_FLAGS=/fsanitize=address /Zi /EHsc /D_DISABLE_VECTOR_ANNOTATION /D_DISABLE_STRING_ANNOTATION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "COLOSSEUM_ASAN_BUILD=$build" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run AddressSanitizer probes
        shell: pwsh
        run: |
          cmake --build $env:COLOSSEUM_ASAN_BUILD --target `
            comicreader_provider_harness `
            comicreader_decode_harness `
            tst_vault_scanner `
            tst_watchparty_lifecycle `
            cbz_archive_probe_harness `
            --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $asanRuntime = Join-Path $env:VCToolsInstallDir "bin/Hostx64/x64"
          if (-not (Test-Path (Join-Path $asanRuntime "clang_rt.asan_dynamic-x86_64.dll"))) {
            throw "MSVC AddressSanitizer runtime missing"
          }
          $env:PATH = "$asanRuntime;$env:QT_ROOT_DIR\bin;$env:PATH"
          $env:ASAN_OPTIONS = "halt_on_error=1:abort_on_error=1"
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_FORCE_STDERR_LOGGING = "1"
          foreach ($target in @(
            "comicreader_provider_harness",
            "comicreader_decode_harness",
            "tst_vault_scanner",
            "tst_watchparty_lifecycle",
            "cbz_archive_probe_harness"
          )) {
            & (Join-Path $env:COLOSSEUM_ASAN_BUILD "$target.exe")
            if ($LASTEXITCODE -ne 0) { throw "$target failed under AddressSanitizer" }
          }

  linux-desktop:
    if: ${{ !inputs.b1_native_qualification && github.ref != 'refs/heads/dots/b1-cloud-system-proxy-20261018' }}
    needs: public-trust
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ECM_VERSION: "6.15.0"
      ECM_SHA256: "f7cd022095a9e6bdbe5897720a24bfda81d211757b7c08b173061962bf2ee0b2"
      MPVQT_VERSION: "1.2.0"
      MPVQT_SHA256: "8660ad79c0d60fed77f29b36e1742841466af5405de702c81a121e6eeb625ebb"
      LLVM_VERSION: "20.1.2"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.11.1"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: "qtwebengine qtwebchannel qtwebsockets qtpositioning"
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          cache: true

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config ccache \
            clang-tidy-20 \
            libmpv-dev libtorrent-rasterbar-dev libboost-all-dev libssl-dev libsecret-1-dev \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxcb-cursor0 \
            xvfb xauth ffmpeg p7zip-full libarchive-tools
          ccache --max-size=1G

      - name: Restore Linux compiler cache
        id: restore-linux-ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: linux-ccache-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            linux-ccache-v1-${{ runner.os }}-

      - name: Verify Linux toolchain
        run: |
          cmake --version
          ninja --version
          c++ --version | head -1
          ccache --version | head -1
          clang-tidy-20 --version | head -3
          pkg-config --modversion mpv

      - name: Validate clang-tidy gate helper on Linux
        env:
          PYTHONPATH: .
        run: python tests/test_clang_tidy_quality_gate.py

      - name: Build Extra CMake Modules
        run: |
          archive="$RUNNER_TEMP/extra-cmake-modules.tar.xz"
          source="$RUNNER_TEMP/ecm-source"
          build="$RUNNER_TEMP/ecm-build"
          install="$RUNNER_TEMP/ecm-install"
          curl --fail --location --retry 3 \
            "https://download.kde.org/Attic/frameworks/6.15/extra-cmake-modules-$ECM_VERSION.tar.xz" \
            --output "$archive"
          echo "$ECM_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$source"
          tar -xf "$archive" -C "$source" --strip-components=1
          cmake -S "$source" -B "$build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="$install"
          cmake --build "$build" --target install --parallel 2
          echo "ECM_ROOT=$install" >> "$GITHUB_ENV"

      - name: Build MpvQt
        run: |
          archive="$RUNNER_TEMP/mpvqt.tar.xz"
          source="$RUNNER_TEMP/mpvqt-source"
          build="$RUNNER_TEMP/mpvqt-build"
          install="$RUNNER_TEMP/mpvqt-install"
          curl --fail --location --retry 3 --retry-all-errors \
            --retry-delay 5 --connect-timeout 30 --max-time 180 \
            "https://download.kde.org/stable/mpvqt/mpvqt-$MPVQT_VERSION.tar.xz" \
            --output "$archive"
          echo "$MPVQT_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$source"
          tar -xf "$archive" -C "$source" --strip-components=1
          cmake -S "$source" -B "$build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$install" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$ECM_ROOT"
          cmake --build "$build" --target install --parallel 2
          echo "MPVQT_ROOT=$install" >> "$GITHUB_ENV"

      - name: Configure Colosseum on Linux
        run: |
          build="$RUNNER_TEMP/colosseum-linux-build"
          prefix="$QT_ROOT_DIR;$ECM_ROOT;$MPVQT_ROOT"
          cmake -S native -B "$build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCOLOSSEUM_BUILD_PLAYER2=OFF \
            -DCOLOSSEUM_PLAYER2_IN_APP=OFF \
            -DCOLOSSEUM_NO_COMPILER_CACHE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="$prefix" \
            -DMPVQT_PREFIX="$MPVQT_ROOT"
          grep -Eq '^CMAKE_C_COMPILER_LAUNCHER:.*=ccache$' "$build/CMakeCache.txt"
          grep -Eq '^CMAKE_CXX_COMPILER_LAUNCHER:.*=ccache$' "$build/CMakeCache.txt"
          echo "COLOSSEUM_LINUX_BUILD=$build" >> "$GITHUB_ENV"

      - name: Build Linux desktop and tests
        run: cmake --build "$COLOSSEUM_LINUX_BUILD" --parallel 2

      - name: Save Linux compiler cache
        if: always() && steps.restore-linux-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ steps.restore-linux-ccache.outputs.cache-primary-key }}

      - name: Audit Linux CTest inventory
        run: |
          inventory="$RUNNER_TEMP/ctest-inventory.json"
          ctest --test-dir "$COLOSSEUM_LINUX_BUILD" --show-only=json-v1 > "$inventory"
          python - "$inventory" <<'PY'
          import json
          import sys

          tests = json.load(open(sys.argv[1], encoding="utf-8"))["tests"]
          windows = []
          non_windows = []
          requires_x11 = []
          shell_leaks = []
          missing_commands = []
          canary = None
          for test in tests:
              props = {p["name"]: p["value"] for p in test.get("properties", [])}
              labels = {str(label).lower() for label in props.get("LABELS", [])}
              command = test.get("command", [])
              if "windows" in labels:
                  windows.append(test["name"])
              else:
                  non_windows.append(test["name"])
              if "requires-x11" in labels:
                  requires_x11.append(test["name"])
              if "windows" not in labels and not command:
                  missing_commands.append(test["name"])
              if command and "powershell" in str(command[0]).lower() and "windows" not in labels:
                  shell_leaks.append(test["name"])
              if test["name"] == "colosseum.selftest.red_canary":
                  canary = props.get("WILL_FAIL")

          print(f"CTEST_TOTAL={len(tests)}")
          print(f"CTEST_WINDOWS={len(windows)}")
          print(f"CTEST_NON_WINDOWS={len(non_windows)}")
          print(f"CTEST_REQUIRES_X11={len(requires_x11)}")
          expected_x11 = ["colosseum.qttest.journey_play_video"]
          if requires_x11 != expected_x11:
              raise SystemExit(f"unexpected X11 CTest inventory: {requires_x11}")
          if shell_leaks:
              raise SystemExit(f"PowerShell tests leaked into Linux surface: {shell_leaks}")
          if missing_commands:
              raise SystemExit(f"Linux CTests have unresolved commands: {missing_commands}")
          if canary is not True:
              raise SystemExit(f"red canary lost WILL_FAIL semantics: {canary!r}")
          PY
          ctest --test-dir "$COLOSSEUM_LINUX_BUILD" -N -LE windows

      - name: Run platform-neutral Linux CTests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: "1"
        run: |
          ctest --test-dir "$COLOSSEUM_LINUX_BUILD" \
            -LE "windows|requires-x11" \
            --output-on-failure \
            --parallel 1

      - name: Run X11-dependent Linux CTests
        env:
          QT_QPA_PLATFORM: xcb
          QT_FORCE_STDERR_LOGGING: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a ctest --test-dir "$COLOSSEUM_LINUX_BUILD" \
            -L requires-x11 \
            -LE windows \
            --output-on-failure \
            --parallel 1

      - name: Run clang-tidy correctness gate on Linux
        run: |
          python scripts/clang_tidy_quality_gate.py \
            --clang-tidy "$(command -v clang-tidy-20)" \
            --compile-commands "$COLOSSEUM_LINUX_BUILD/compile_commands.json" \
            --source-root native \
            --allowlist .github/clang-tidy-allowlist.txt \
            --required-version "$LLVM_VERSION" \
            --jobs 1 \
            --min-files 184

      - name: Show compiler-cache statistics
        if: always()
        run: ccache --show-stats || true

  dependency-scan:
    if: ${{ !inputs.b1_native_qualification && github.ref != 'refs/heads/dots/b1-cloud-system-proxy-20261018' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.9"
      # Reachability-aware gate: govulncheck fails only when a vulnerability is
      # actually CALLED by the code (unlike a plain version scanner). The known
      # unreachable advisory (x/crypto/openpgp) does NOT fail the gate; a newly
      # reachable vuln in the Go account-service will.
      - name: govulncheck (Go account-service)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd server/account-service
          "$(go env GOPATH)/bin/govulncheck" ./...

  fuzz-smoke:
    if: ${{ !inputs.b1_native_qualification && github.ref != 'refs/heads/dots/b1-cloud-system-proxy-20261018' }}
    needs: public-trust
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      LLVM_VERSION: "22.1.8"
      LLVM_SHA256: "16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c"
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt 6.11.1 (Core)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.11.1"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          cache: true
      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Install pinned LLVM
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_VERSION-win64.exe"
          $install = Join-Path $env:RUNNER_TEMP "llvm-$env:LLVM_VERSION"
          $uri = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.exe"
          Invoke-WebRequest -Uri $uri -OutFile $installer
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:LLVM_SHA256) { throw "LLVM installer checksum mismatch" }
          $process = Start-Process -FilePath $installer -ArgumentList "/S", "/D=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          "LLVM_ROOT=$install" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      # The stock clang_rt.fuzzer is /MT; Qt release libs are /MD and cannot share
      # a link. Build a /MD libFuzzer from the pinned LLVM sources so Qt-linked fuzz
      # targets can link -fsanitize=fuzzer-no-link + this lib + Qt6Core.
      - name: Build /MD libFuzzer runtime
        shell: pwsh
        run: |
          $clangcl = Join-Path $env:LLVM_ROOT "bin/clang-cl.exe"
          $llvmlib = Join-Path $env:LLVM_ROOT "bin/llvm-lib.exe"
          $fz = Join-Path $env:RUNNER_TEMP "llvm-fz"
          git clone --depth 1 --branch "llvmorg-$env:LLVM_VERSION" --filter=blob:none --sparse https://github.com/llvm/llvm-project.git $fz
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $fz sparse-checkout set compiler-rt/lib/fuzzer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fzdir = Join-Path $fz "compiler-rt/lib/fuzzer"
          $obj = Join-Path $env:RUNNER_TEMP "fzobj"; New-Item -ItemType Directory -Force $obj | Out-Null
          $srcs = Get-ChildItem "$fzdir/*.cpp" | ForEach-Object { $_.FullName }
          $a = @('/nologo','/MD','/O2','/EHsc','/std:c++17','-D_DISABLE_STL_ANNOTATION','-c',"-I$fzdir","/Fo$obj\") + $srcs
          & $clangcl @a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $objs = Get-ChildItem "$obj/*.obj" | ForEach-Object { $_.FullName }
          $lib = Join-Path $env:RUNNER_TEMP "libFuzzer_md.lib"
          & $llvmlib '/nologo' "/out:$lib" @objs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "LIBFUZZER_MD=$lib" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build and run fuzz smoke (45s each, seeded; fail on crash)
        shell: pwsh
        run: |
          $clangcl = Join-Path $env:LLVM_ROOT "bin/clang-cl.exe"
          $qt = $env:QT_ROOT_DIR
          $out = Join-Path $env:RUNNER_TEMP "fuzzout"; New-Item -ItemType Directory -Force $out | Out-Null
          Write-Output "LLVM_ROOT=$env:LLVM_ROOT"
          Write-Output "QT_ROOT_DIR=$qt"
          # Locate the ASan runtime DLL by search (installer layout varies) and place it
          # beside the fuzzers so it resolves without any PATH assumption.
          $asanDll = Get-ChildItem $env:LLVM_ROOT -Recurse -Filter "clang_rt.asan_dynamic-x86_64.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $asanDll) { Write-Output "::error::ASan runtime DLL not found under $env:LLVM_ROOT"; throw "ASan runtime DLL missing" }
          Write-Output "ASan DLL: $($asanDll.FullName)"
          Copy-Item $asanDll.FullName $out -Force
          $targets = @(
            @{ name = "miniz_zip_fuzzer";           srcs = @("native/third_party/miniz/miniz.c"); qt = $false },
            @{ name = "cbz_archive_fuzzer";          srcs = @("native/engine/CbzArchive.cpp","native/third_party/miniz/miniz.c"); qt = $true },
            @{ name = "watchparty_protocol_fuzzer";  srcs = @("native/watchparty/WatchPartyProtocol.cpp","native/watchparty/WatchPartyTypes.cpp"); qt = $true },
            @{ name = "update_manifest_fuzzer";      srcs = @("native/update/UpdateManifest.cpp","native/update/UpdateVersion.cpp"); qt = $true }
          )
          foreach ($t in $targets) {
            $exe = Join-Path $out "$($t.name).exe"
            $objd = Join-Path $out "obj_$($t.name)"; New-Item -ItemType Directory -Force $objd | Out-Null
            $a = @('/nologo','/std:c++17','/EHsc','/MD','/Zi','/O1','-fsanitize=fuzzer-no-link,address','-D_DISABLE_STL_ANNOTATION','-Inative')
            if ($t.qt) { $a += @("-I$qt/include","-I$qt/include/QtCore") }
            $a += "tests/fuzz/$($t.name).cpp"
            $a += $t.srcs
            $a += @("/Fo$objd\","/Fe:$exe",'/link',$env:LIBFUZZER_MD)
            if ($t.qt) { $a += @("/libpath:$qt/lib",'Qt6Core.lib') }
            Write-Output "--- building $($t.name) ---"
            $log = Join-Path $out "build_$($t.name).log"
            & $clangcl @a 2>&1 | Out-File -FilePath $log -Encoding utf8
            if ($LASTEXITCODE -ne 0) {
              $tail = ((Get-Content $log | Where-Object { $_ -match 'error|LNK\d|cannot|unresolved|No such' } | Select-Object -Last 3) -join ' || ')
              Write-Output "::error::fuzz build failed ($($t.name)): $tail"
              Get-Content $log | Select-Object -Last 30
              throw "fuzz build failed: $($t.name)"
            }
          }
          # Put the Qt runtime DLLs next to the exes so the Qt-linked targets resolve
          # them without any PATH assumption (the ASan DLL is already in $out).
          Copy-Item (Join-Path $qt "bin/Qt6Core.dll") $out -Force
          Get-ChildItem (Join-Path $qt "bin") -Filter "icu*.dll" -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName $out -Force }
          $env:PATH = "$out;$qt\bin;$env:PATH"
          $env:ASAN_OPTIONS = "abort_on_error=1"
          foreach ($t in $targets) {
            $exe = Join-Path $out "$($t.name).exe"
            # Run against a temp COPY so libFuzzer's discovered units are written to
            # RUNNER_TEMP, never back into the checked-out source tree.
            $corpus = Join-Path $out "corpus_$($t.name)"
            Copy-Item "tests/fuzz/corpora/$($t.name)" $corpus -Recurse -Force
            Write-Output "--- running $($t.name) ---"
            $rlog = Join-Path $out "run_$($t.name).log"
            & $exe "-artifact_prefix=$out\$($t.name)_" "-max_total_time=45" "-rss_limit_mb=2048" $corpus 2>&1 | Tee-Object -FilePath $rlog | Out-Null
            $rc = $LASTEXITCODE
            Write-Output "--- $($t.name) exit=$rc ---"
            if ($rc -ne 0) {
              $key = ((Get-Content $rlog -ErrorAction SilentlyContinue | Where-Object { $_ -match 'ERROR|SUMMARY|runtime error|libFuzzer|abort|0x[0-9A-Fa-f]{6,}' } | Select-Object -Last 4) -join ' || ')
              Write-Output "::error::fuzz $($t.name) exit=$rc : $key"
              Get-Content $rlog -ErrorAction SilentlyContinue | Select-Object -Last 30
              throw "fuzz failure: $($t.name) (exit $rc)"
            }
          }

  b1-native-qualification:
    if: ${{ inputs.b1_native_qualification || github.ref == 'refs/heads/dots/b1-cloud-system-proxy-20261018' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      ECM_VERSION: "6.15.0"
      ECM_SHA256: "f7cd022095a9e6bdbe5897720a24bfda81d211757b7c08b173061962bf2ee0b2"
      MPVQT_VERSION: "1.2.0"
      MPVQT_SHA256: "8660ad79c0d60fed77f29b36e1742841466af5405de702c81a121e6eeb625ebb"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepare evidence directories
        run: |
          mkdir -p "$RUNNER_TEMP/b1-evidence" "$RUNNER_TEMP/b1-build-logs"
          echo "COLOSSEUM_LINUX_BUILD=$RUNNER_TEMP/b1-build" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$RUNNER_TEMP/b1-evidence/source-commit.txt"
          git status --porcelain > "$RUNNER_TEMP/b1-evidence/source-status-before.txt"
      - name: Install qualification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config clang-format \
            libmpv-dev libtorrent-rasterbar-dev libboost-all-dev libssl-dev libsecret-1-dev \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev libxkbcommon-dev libxcb-cursor0 \
            libnss3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 \
            xvfb xauth xdotool ffmpeg p7zip-full libarchive-tools
          python -m pip install 'cmake==3.31.6' 'Pillow==12.3.0'
      - name: Install full Qt 6.11.1 SDK
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.11.1"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: "qtwebengine qtwebchannel qtwebsockets qtpositioning qtmultimedia qtimageformats qttasktree"
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          cache: true
      - name: Build checksum-pinned ECM and MpvQt
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/b1-deps"
          mkdir -p "$deps"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 180 \
            "https://download.kde.org/Attic/frameworks/6.15/extra-cmake-modules-$ECM_VERSION.tar.xz" \
            --output "$deps/ecm.tar.xz"
          echo "$ECM_SHA256  $deps/ecm.tar.xz" | sha256sum --check --strict
          tar -xf "$deps/ecm.tar.xz" -C "$deps"
          cmake -S "$deps/extra-cmake-modules-$ECM_VERSION" -B "$deps/ecm-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX="$deps/install" \
            2>&1 | tee "$RUNNER_TEMP/b1-build-logs/ecm-configure.log"
          cmake --build "$deps/ecm-build" --target install --parallel 2 \
            2>&1 | tee "$RUNNER_TEMP/b1-build-logs/ecm-build.log"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 180 \
            "https://download.kde.org/stable/mpvqt/mpvqt-$MPVQT_VERSION.tar.xz" \
            --output "$deps/mpvqt.tar.xz"
          echo "$MPVQT_SHA256  $deps/mpvqt.tar.xz" | sha256sum --check --strict
          tar -xf "$deps/mpvqt.tar.xz" -C "$deps"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cmake -S "$deps/mpvqt-$MPVQT_VERSION" -B "$deps/mpvqt-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$deps/install" -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$deps/install" \
            2>&1 | tee "$RUNNER_TEMP/b1-build-logs/mpvqt-configure.log"
          cmake --build "$deps/mpvqt-build" --target install --parallel 2 \
            2>&1 | tee "$RUNNER_TEMP/b1-build-logs/mpvqt-build.log"
          echo "MPVQT_ROOT=$deps/install" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$QT_ROOT_DIR/lib:$deps/install/lib:$deps/install/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Download exact previously qualified native binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: "12137078740"
          run-id: "39129013913"
          repository: kingoftheseas56/Colosseum
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/b1-prior-artifact
          merge-multiple: true
      - name: Verify exact qualified native and QML identities
        run: |
          set -euo pipefail
          python - <<'PYVERIFY'
          import hashlib, json, os, pathlib, shutil, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          prior = root / "b1-prior-artifact"
          compiled = "cb2db25904dfe9f86660efebffa498aa3f06e5e8"
          runtime = "6199235afcd6768010bd87816ce2d14a00ae77a4"
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          subprocess.run(["git", "merge-base", "--is-ancestor", runtime, "HEAD"], check=True)
          assert not git("status", "--porcelain"), "Qualification source must be clean"
          changed = set(filter(None, git("diff", "--name-only", runtime, "HEAD").splitlines()))
          # Parked component assets are QA only, and are never executed here.
          allowed = {'tests/capture_deep_onepiece_v3.py', 'tests/test_capture_deep_onepiece_v3.py', 'tests/capture_native_promos_v2.py', 'tests/test_capture_native_promos_v2.py', 'tests/capture_native_promos.py', 'tests/test_capture_native_promos.py', 'tests/release_qualification/test_universe_observation.py', 'tests/controlled_stream/stream_component.py', 'tests/controlled_stream/fixture/create-options.json', 'tests/release_qualification/universe_journey.py', 'tests/release_qualification/test_universe_geometry.py', 'tests/release_qualification/verify_offline.py', 'tests/controlled_stream/runtime-provenance.json', 'tests/controlled_stream/fixture/loopback_tracker.py', 'tests/release_qualification/native_recovery_controller.py', 'tests/release_qualification/test_recovery_helpers.py', 'tests/release_qualification/build_catalogue.mjs', '.github/workflows/desktop-ci.yml', 'tests/controlled_stream/check_isolation.py', 'tests/controlled_stream/fixture/owned-test-pattern.mp4', 'tests/release_qualification/native_ui.py', 'tests/release_qualification/probe.py', 'tests/release_qualification/test_probe.py', 'tests/controlled_stream/fixture/loopback_seed.cpp', 'tests/controlled_stream/fixture/owned-test-pattern.torrent', 'tests/release_qualification/prepare_content.py', 'tests/release_qualification/test_prepare_content.py', 'tests/controlled_stream/launch_isolated.py', 'tests/controlled_stream/fixture/fixture.json', 'tests/controlled_stream/fixture/SOURCE_SHA256SUMS', 'tests/release_qualification/b1_catalogue_fault_fixture.py', 'tests/release_qualification/expected-catalogue.json'}
          assert changed <= allowed, sorted(changed - allowed)
          expected = {
              "colosseum": "acb86ce66202531629c137f8706d8d873c3065df8a08867cbeb8bd60eafaa677",
              "lanista": "9577113c1fe48521755d964431e7c76dece2d8d82b3cd30c83ddf1a29cc88aad",
              "qml-build.manifest": "d52158f306a2f5588ad5370ea1aa95fb72074af49a4cea27e76eccc5b48b0dd5",
          }
          for name, digest in expected.items():
              assert hashlib.sha256((prior / "b1-build" / name).read_bytes()).hexdigest() == digest, name
          receipt = json.loads((prior / "b1-evidence/compiled-provenance.json").read_text())
          launch = json.loads((prior / "b1-evidence/runtime/launch.json").read_text())
          assert receipt["compiledNativeSourceCommit"] == compiled
          assert receipt["runtimeQmlSourceCommit"] == runtime
          assert receipt["runtimeQmlTreeSha256"] == "bc48a019a12d408ce983d0f4ed8b9f0b075934c4c19090a9c2aa2c9f0fb399cf"
          assert launch["qualificationSourceCommit"] == runtime and launch["sourceStatus"] == ""
          for field, name in [("binarySha256", "colosseum"), ("lanistaSha256", "lanista"), ("qmlManifestSha256", "qml-build.manifest")]:
              assert receipt[field] == launch[field] == expected[name]
          assert receipt["configuredContentEndpoint"] == launch["configuredContentEndpoint"] == "https://colosseum-content-api-staging.colosseum-watchparty-relay.workers.dev"
          build = pathlib.Path(os.environ["COLOSSEUM_LINUX_BUILD"])
          build.mkdir()
          for name in expected:
              shutil.copy2(prior / "b1-build" / name, build / name)
          for name in ["colosseum", "lanista"]:
              (build / name).chmod(0o755)
          receipt.update(qualificationSourceCommit=git("rev-parse", "HEAD"), priorRunId=39129013913,
                         priorArtifactId=12137078740, nativeReuseMode="exact-qualified-native-and-runtime-qml",
                         focusedRegressionTests="reused prior evidence; not rerun", changedPaths=sorted(changed))
          (root / "b1-evidence/compiled-provenance.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PYVERIFY
          cmake "-DQML_ROOT=$GITHUB_WORKSPACE/qml" \
            "-DOUTPUT_FILE=$RUNNER_TEMP/b1-evidence/current-qml.manifest" \
            -P native/bootstrap/write_qml_build_manifest.cmake
          cmp "$COLOSSEUM_LINUX_BUILD/qml-build.manifest" "$RUNNER_TEMP/b1-evidence/current-qml.manifest"
          { cmake --version; c++ --version; "$QT_ROOT_DIR/bin/qmake" -query QT_VERSION; \
            pkg-config --modversion mpv libtorrent-rasterbar openssl; } > "$RUNNER_TEMP/b1-evidence/runtime-toolchain.txt"
          cp "$RUNNER_TEMP/b1-prior-artifact/b1-evidence/compiled-library-versions.txt" "$RUNNER_TEMP/b1-evidence/compiled-library-versions.txt"
          tail -n 4 "$RUNNER_TEMP/b1-evidence/runtime-toolchain.txt" > "$RUNNER_TEMP/b1-evidence/runtime-library-versions.txt"
          cmp "$RUNNER_TEMP/b1-evidence/compiled-library-versions.txt" "$RUNNER_TEMP/b1-evidence/runtime-library-versions.txt"
      - name: Check native capture driver without launching app
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_capture_deep_onepiece_v3.py
          python -m py_compile tests/capture_deep_onepiece_v3.py tests/test_capture_deep_onepiece_v3.py
      - name: Capture only deep interactive One Piece journey
        timeout-minutes: 32
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          ffmpeg -version > "$RUNNER_TEMP/b1-evidence/capture-ffmpeg-version.txt"
          timeout --signal=TERM --kill-after=60s 1800s \
            xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24 -nolisten tcp' \
            python tests/capture_deep_onepiece_v3.py --source "$GITHUB_WORKSPACE" \
              --binary "$COLOSSEUM_LINUX_BUILD/colosseum" --output "$RUNNER_TEMP/promo-capture" --record
      - name: Record final source status
        if: always()
        run: |
          set -euo pipefail
          git status --porcelain > "$RUNNER_TEMP/b1-evidence/source-status-after.txt"
          test ! -s "$RUNNER_TEMP/b1-evidence/source-status-after.txt"
          cmake "-DQML_ROOT=$GITHUB_WORKSPACE/qml" \
            "-DOUTPUT_FILE=$RUNNER_TEMP/b1-evidence/after-qml.manifest" \
            -P native/bootstrap/write_qml_build_manifest.cmake
          cmp "$COLOSSEUM_LINUX_BUILD/qml-build.manifest" "$RUNNER_TEMP/b1-evidence/after-qml.manifest"

      - name: Upload native capture videos and bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-native-deep-onepiece-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/b1-evidence/*.txt
            ${{ runner.temp }}/b1-evidence/compiled-provenance.json
            ${{ runner.temp }}/b1-evidence/current-qml.manifest
            ${{ runner.temp }}/b1-evidence/after-qml.manifest
            ${{ runner.temp }}/promo-capture/summary.json
            ${{ runner.temp }}/promo-capture/*/result.json
            ${{ runner.temp }}/promo-capture/*/scenes.json
            ${{ runner.temp }}/promo-capture/*/ffprobe.json
            ${{ runner.temp }}/promo-capture/*/*.mp4
            ${{ runner.temp }}/promo-capture/*/failure.png
            ${{ runner.temp }}/promo-capture/*/last-frame.png
