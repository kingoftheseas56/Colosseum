name: android

# First installable Android lane. Manual dispatch only; A02 CI gate passed.
on:
  workflow_dispatch:
    inputs:
      nuvio_diagnostic_arm64:
        description: "Opt-in: hardened Nuvio ARM64 diagnostic APK only (false keeps the normal build)"
        type: boolean
        default: false
      nuvio_diagnostic_package:
        description: "Distinct diagnostic package id (org.qtproject.example.colosseum.nuvio<id>)"
        type: string
        default: org.qtproject.example.colosseum.nuvio014local
      release_unsigned_arm64:
        description: "Opt-in: build one unsigned arm64 preview Release APK; no emulator or test signer"
        type: boolean
        default: false
      release_preview_package:
        description: "Side-by-side preview package id"
        type: string
        default: org.qtproject.example.colosseum.previewnuvio1
      release_version_code:
        description: "Android versionCode for the preview APK"
        type: number
        default: 2
      release_content_api_url:
        description: "HTTPS staging content API origin compiled into the preview"
        type: string
        default: https://colosseum-content-api-staging.colosseum-watchparty-relay.workers.dev

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.11.1"
  COLOSSEUM_ANDROID_TOOLCHAIN: ${{ github.workspace }}/../colosseum-android
  COLOSSEUM_ANDROID_DEPS: ${{ github.workspace }}/../colosseum-android-deps

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Reader publication and message boundary
        run: |
          python tests/test_android_cache_paths.py
          python tests/test_android_unsigned_release.py
          python tests/test_android_reader_session.py
          node tests/android_reader_boot_test.mjs
          python tests/test_android_openssl_packaging_contract.py
          python tests/test_android_runtime_bundle.py
          python tests/test_android_feria_contract.py
          python tests/test_android_vault_contract.py
          python tests/test_android_vault_media_boundary.py
          python tests/android_emulator_smoke_test.py

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift || true
          df -h "$GITHUB_WORKSPACE" | tail -1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache binutils patch \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libx11-6 libdbus-1-3 libglib2.0-0t64
          ccache --max-size=2G

      - name: Normalize Android cache paths
        id: android-paths
        run: bash scripts/android/prepare_cache_paths.sh

      - name: Restore toolchain (Qt, SDK, NDK)
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.android-paths.outputs.toolchain }}/Qt
            ${{ steps.android-paths.outputs.sdk }}/ndk/27.2.12479018
          key: android-toolchain-v1-${{ hashFiles('scripts/android/install_toolchain.sh') }}

      - name: Install toolchain
        run: scripts/android/install_toolchain.sh

      - name: Save installed toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.android-paths.outputs.toolchain }}/Qt
            ${{ steps.android-paths.outputs.sdk }}/ndk/27.2.12479018
          key: android-toolchain-v1-${{ hashFiles('scripts/android/install_toolchain.sh') }}

      - name: Validate Android build mode and release inputs
        env:
          DIAGNOSTIC_MODE: ${{ inputs.nuvio_diagnostic_arm64 }}
          RELEASE_MODE: ${{ inputs.release_unsigned_arm64 }}
          RELEASE_PACKAGE: ${{ inputs.release_preview_package }}
          RELEASE_VERSION_CODE: ${{ inputs.release_version_code }}
          RELEASE_ENDPOINT: ${{ inputs.release_content_api_url }}
        run: |
          if [[ "$DIAGNOSTIC_MODE" == "true" && "$RELEASE_MODE" == "true" ]]; then
            python3 scripts/android/release_apk.py validate-dispatch --diagnostic --release
          elif [[ "$DIAGNOSTIC_MODE" == "true" ]]; then
            python3 scripts/android/release_apk.py validate-dispatch --diagnostic
          elif [[ "$RELEASE_MODE" == "true" ]]; then
            python3 scripts/android/release_apk.py validate-dispatch --release \
              --package "$RELEASE_PACKAGE" --version-code "$RELEASE_VERSION_CODE" \
              --endpoint "$RELEASE_ENDPOINT"
          else
            python3 scripts/android/release_apk.py validate-dispatch
          fi

      - name: Compile Android-selected QML before building APKs
        run: |
          set -o pipefail
          QT_HOST="$COLOSSEUM_ANDROID_TOOLCHAIN/Qt/$QT_VERSION/gcc_64"
          ldd "$QT_HOST/lib/libQt6Gui.so.6" "$QT_HOST/plugins/platforms/libqoffscreen.so" | tee qt-host-dependencies.log
          if grep -q 'not found' qt-host-dependencies.log; then exit 1; fi
          python tests/android_qml_preflight.py --qt-root "$QT_HOST" 2>&1 | tee qml-preflight.log
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software "$QT_HOST/bin/qmltestrunner" -input tests/qml/tst_account_choice_accessibility.qml 2>&1 | tee qml-accessibility.log

      - name: Restore dependency prefixes
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.android-paths.outputs.deps }}
          # Keep the opt-in arm64 Release preparation from populating the
          # long-lived Debug/diagnostic dependency cache namespace.
          key: ${{ inputs.release_unsigned_arm64 && 'android-deps-release-arm64-v1-' || 'android-deps-v1-' }}${{ hashFiles('scripts/android/build_deps.sh') }}

      - name: Build OpenSSL / Boost / libtorrent (cache miss only)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        env:
          RELEASE_MODE: ${{ inputs.release_unsigned_arm64 }}
        run: |
          source "$COLOSSEUM_ANDROID_TOOLCHAIN/env.sh"
          if [[ "$RELEASE_MODE" == "true" ]]; then
            scripts/android/build_deps.sh arm64-v8a
          else
            scripts/android/build_deps.sh arm64-v8a x86_64
          fi

      - name: Save built dependency prefixes
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.android-paths.outputs.deps }}
          key: ${{ inputs.release_unsigned_arm64 && 'android-deps-release-arm64-v1-' || 'android-deps-v1-' }}${{ hashFiles('scripts/android/build_deps.sh') }}

      - name: Decode stable test signing key
        if: ${{ !inputs.release_unsigned_arm64 }}
        # Test-only keystore shared by every CI build so a new APK installs over the previous one.
        # Secrets: ANDROID_TEST_KEYSTORE_B64 (base64 .jks) and ANDROID_TEST_KEYSTORE_PASSWORD.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_TEST_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::ANDROID_TEST_KEYSTORE_B64/PASSWORD secrets are not set; APKs keep a per-run debug signature and will not install over each other."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/colosseum-test.jks"
          echo "COLOSSEUM_ANDROID_KEYSTORE=$RUNNER_TEMP/colosseum-test.jks" >> "$GITHUB_ENV"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: android-ccache-v1-${{ github.sha }}
          restore-keys: android-ccache-v1-

      - name: Build x86_64 APK
        if: ${{ !inputs.nuvio_diagnostic_arm64 && !inputs.release_unsigned_arm64 }}
        env:
          COLOSSEUM_ANDROID_CMAKE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          COLOSSEUM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
        run: |
          source "$COLOSSEUM_ANDROID_TOOLCHAIN/env.sh"
          set -o pipefail
          scripts/android/build_apk.sh x86_64 apk-out 2>&1 | tee build-x86_64.log

      # Opt-in Nuvio ARM64 diagnostic (task014). The product feature stays OFF
      # unless this input is set; x86_64 and the emulator smoke are skipped.
      - name: Nuvio build - restore pinned donor, prove patches, prepare hardened engine
        if: ${{ inputs.nuvio_diagnostic_arm64 || inputs.release_unsigned_arm64 }}
        env:
          DIAG_PACKAGE: ${{ inputs.nuvio_diagnostic_package }}
          DIAGNOSTIC_MODE: ${{ inputs.nuvio_diagnostic_arm64 }}
        run: |
          set -euo pipefail
          if [[ "$DIAGNOSTIC_MODE" == "true" ]]; then
            [[ "$DIAG_PACKAGE" =~ ^org\.qtproject\.example\.colosseum\.nuvio[0-9a-z]+$ ]] || {
              echo "::error::nuvio_diagnostic_package must be org.qtproject.example.colosseum.nuvio<id>"; exit 1; }
          fi
          source "$COLOSSEUM_ANDROID_TOOLCHAIN/env.sh"
          DIAG="$RUNNER_TEMP/nuvio014"
          mkdir -p "$DIAG" nuvio-diag
          echo "NUVIO_DIAG=$DIAG" >> "$GITHUB_ENV"
          python3 cloud-handoff/android-013/restore_donor.py "$DIAG/donor-working" 2>&1 | tee nuvio-diag/donor-restore.log
          NUVIO_DONOR_SOURCE="$DIAG/donor-working" python3 tests/test_android_nuvio_backend_contract.py \
            2>&1 | tee nuvio-diag/backend-contract.log
          grep -q 'SKIPPED_CASES=0' nuvio-diag/backend-contract.log
          python3 scripts/android/prepare_nuvio_engine.py --source "$DIAG/donor-working" \
            --ndk "$ANDROID_NDK_ROOT" --abi arm64-v8a --api 28 --prefix "$DIAG/nuvio-prefix" \
            2>&1 | tee nuvio-diag/engine-prepare.log
          python3 scripts/android/verify_nuvio_hardened_artifact.py --prefix "$DIAG/nuvio-prefix" \
            --abi arm64-v8a 2>&1 | tee nuvio-diag/engine-artifact-verify.log
          cp "$DIAG/nuvio-prefix/.colosseum-nuvio-hardened-stamp" nuvio-diag/engine-stamp.txt

      - name: Nuvio diagnostic - build arm64-v8a APK (correspondence gate, skips fail)
        if: ${{ inputs.nuvio_diagnostic_arm64 }}
        env:
          DIAG_PACKAGE: ${{ inputs.nuvio_diagnostic_package }}
          COLOSSEUM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
        run: |
          source "$COLOSSEUM_ANDROID_TOOLCHAIN/env.sh"
          set -o pipefail
          export COLOSSEUM_ANDROID_CMAKE_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCOLOSSEUM_ANDROID_NUVIO_BACKEND=ON -DCOLOSSEUM_NUVIO_ENGINE_PREFIX=$NUVIO_DIAG/nuvio-prefix -DCOLOSSEUM_NUVIO_DIAGNOSTIC_PACKAGE=$DIAG_PACKAGE -DCOLOSSEUM_ANDROID_NUVIO_X86_64_DIAGNOSTIC=OFF"
          echo "$COLOSSEUM_ANDROID_CMAKE_ARGS" > nuvio-diag/configure-args.txt
          scripts/android/build_apk.sh arm64-v8a apk-out 2>&1 | tee nuvio-diag/build-arm64-v8a.log
          grep -E '^(ANDROID_ABI|CMAKE_BUILD_TYPE|COLOSSEUM_ANDROID_NUVIO_BACKEND|COLOSSEUM_ANDROID_NUVIO_X86_64_DIAGNOSTIC|COLOSSEUM_NUVIO_ENGINE_PREFIX|COLOSSEUM_NUVIO_DIAGNOSTIC_PACKAGE):' \
            native/build-android/arm64-v8a/CMakeCache.txt | tee nuvio-diag/cmake-cache-identity.txt
          grep -q '^PACKAGING_GATE_OK tests=6 skipped=0' nuvio-diag/build-arm64-v8a.log
          grep -q '^ANDROID_RUNTIME_BUNDLE_OK' nuvio-diag/build-arm64-v8a.log
          grep -q '^APK_OPENSSL_RUNTIME_PAIR_OK' nuvio-diag/build-arm64-v8a.log

      - name: Nuvio diagnostic - verify final APK (identity, signer, 16 KiB, ELF ABI, engine member)
        if: ${{ inputs.nuvio_diagnostic_arm64 }}
        env:
          DIAG_PACKAGE: ${{ inputs.nuvio_diagnostic_package }}
        run: |
          source "$COLOSSEUM_ANDROID_TOOLCHAIN/env.sh"
          set -euo pipefail
          bash cloud-handoff/android-014/claude-014/ci/verify_diagnostic_apk.sh \
            apk-out/colosseum-arm64-v8a-debug.apk "$DIAG_PACKAGE" "$NUVIO_DIAG/nuvio-prefix" nuvio-diag
          python3 cloud-handoff/android-014/claude-014/ci/write_manifest.py nuvio-diag "$DIAG_PACKAGE"
          cp apk-out/colosseum-arm64-v8a-debug.apk apk-out/colosseum-arm64-v8a-debug.apk.sha256 nuvio-diag/
          cat nuvio-diag/MANIFEST.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.nuvio_diagnostic_arm64 }}
        with:
          name: task014-nuvio-arm64-diagnostic-${{ github.run_id }}
          path: nuvio-diag
          if-no-files-found: error

      # The same checksum-pinned OpenSSL/Boost/libtorrent prefix the APK linked,
      # for host-independent local Android builds. Not the Nuvio engine: that is
      # always prepared and stamp-verified from the donor on the building host.
      - name: Nuvio diagnostic - package arm64 dependency prefix
        if: ${{ success() && inputs.nuvio_diagnostic_arm64 }}
        run: |
          tar -C "$COLOSSEUM_ANDROID_DEPS" -czf android-deps-arm64-v8a.tgz arm64-v8a
          sha256sum android-deps-arm64-v8a.tgz | tee android-deps-arm64-v8a.tgz.sha256
      - uses: actions/upload-artifact@v4
        if: ${{ success() && inputs.nuvio_diagnostic_arm64 }}
        with:
          name: task014-android-deps-arm64-v8a-${{ github.run_id }}
          path: |
            android-deps-arm64-v8a.tgz
            android-deps-arm64-v8a.tgz.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Build arm64-v8a APK
        if: ${{ !inputs.nuvio_diagnostic_arm64 && !inputs.release_unsigned_arm64 }}
        env:
          COLOSSEUM_ANDROID_CMAKE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          COLOSSEUM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
        run: |
          source "$COLOSSEUM_ANDROID_TOOLCHAIN/env.sh"
          set -o pipefail
          scripts/android/build_apk.sh arm64-v8a apk-out 2>&1 | tee build-arm64-v8a.log

      - name: Build unsigned arm64 Release preview APK
        if: ${{ inputs.release_unsigned_arm64 }}
        env:
          COLOSSEUM_ANDROID_APK_FLAVOUR: release-unsigned
          COLOSSEUM_ANDROID_BUILD: ${{ github.workspace }}/native/build-android
          COLOSSEUM_ANDROID_PREVIEW_PACKAGE: ${{ inputs.release_preview_package }}
          COLOSSEUM_ANDROID_VERSION_CODE: ${{ inputs.release_version_code }}
          COLOSSEUM_CONTENT_API_URL: ${{ inputs.release_content_api_url }}
          COLOSSEUM_ANDROID_CMAKE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        run: |
          source "$COLOSSEUM_ANDROID_TOOLCHAIN/env.sh"
          export COLOSSEUM_NUVIO_ENGINE_PREFIX="$NUVIO_DIAG/nuvio-prefix"
          set -o pipefail
          scripts/android/build_apk.sh arm64-v8a apk-out-release-unsigned 2>&1 | tee build-release-unsigned.log
          grep -q '^PACKAGING_GATE_OK tests=6 skipped=0' build-release-unsigned.log
          grep -q '^ANDROID_RUNTIME_BUNDLE_OK' build-release-unsigned.log
          grep -q '^APK_OPENSSL_RUNTIME_PAIR_OK' build-release-unsigned.log
          grep -q '^UNSIGNED_APK_STRUCTURAL_CHECK_OK ' build-release-unsigned.log
          grep -E '^(ANDROID_ABI|CMAKE_BUILD_TYPE|COLOSSEUM_ANDROID_NUVIO_BACKEND|COLOSSEUM_ANDROID_NUVIO_X86_64_DIAGNOSTIC|COLOSSEUM_NUVIO_ENGINE_PREFIX|COLOSSEUM_NUVIO_DIAGNOSTIC_PACKAGE|COLOSSEUM_ANDROID_PREVIEW_PACKAGE|COLOSSEUM_ANDROID_VERSION_CODE|COLOSSEUM_CONTENT_API_URL|QT_ANDROID_DEPLOYMENT_TYPE|QT_ANDROID_SIGN_APK):' \
            native/build-android/release-unsigned/arm64-v8a/CMakeCache.txt | tee release-cmake-identity.txt
          grep -q '^ANDROID_ABI:STRING=arm64-v8a$' release-cmake-identity.txt
          grep -q '^CMAKE_BUILD_TYPE:STRING=Release$' release-cmake-identity.txt
          grep -q '^COLOSSEUM_ANDROID_NUVIO_BACKEND:BOOL=ON$' release-cmake-identity.txt
          grep -q '^COLOSSEUM_ANDROID_NUVIO_X86_64_DIAGNOSTIC:BOOL=OFF$' release-cmake-identity.txt
          grep -Fx "COLOSSEUM_ANDROID_PREVIEW_PACKAGE:STRING=$COLOSSEUM_ANDROID_PREVIEW_PACKAGE" release-cmake-identity.txt
          grep -Fx "COLOSSEUM_ANDROID_VERSION_CODE:STRING=$COLOSSEUM_ANDROID_VERSION_CODE" release-cmake-identity.txt
          grep -Fx "COLOSSEUM_CONTENT_API_URL:STRING=$COLOSSEUM_CONTENT_API_URL" release-cmake-identity.txt
          grep -Fx "COLOSSEUM_NUVIO_ENGINE_PREFIX:PATH=$COLOSSEUM_NUVIO_ENGINE_PREFIX" release-cmake-identity.txt
          grep -q '^COLOSSEUM_NUVIO_DIAGNOSTIC_PACKAGE:STRING=$' release-cmake-identity.txt
          grep -q '^QT_ANDROID_SIGN_APK:BOOL=OFF$' release-cmake-identity.txt

      - name: Write unsigned Release provenance manifest
        if: ${{ success() && inputs.release_unsigned_arm64 }}
        env:
          RELEASE_ENDPOINT: ${{ inputs.release_content_api_url }}
        run: |
          source "$COLOSSEUM_ANDROID_TOOLCHAIN/env.sh"
          python3 scripts/android/release_apk.py write-provenance \
            --repo . --build-dir native/build-android/release-unsigned/arm64-v8a \
            --apk apk-out-release-unsigned/colosseum-arm64-v8a-release-unsigned.apk \
            --verification apk-out-release-unsigned/release-verification.json \
            --engine-stamp "$NUVIO_DIAG/nuvio-prefix/.colosseum-nuvio-hardened-stamp" \
            --endpoint "$RELEASE_ENDPOINT" \
            --source-before apk-out-release-unsigned/source-before.json \
            --source-after apk-out-release-unsigned/source-after.json \
            --branch-ref "$GITHUB_REF" --run-id "$GITHUB_RUN_ID" \
            --output apk-out-release-unsigned/release-manifest.json
          cat apk-out-release-unsigned/release-manifest.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ success() && inputs.release_unsigned_arm64 }}
        with:
          name: colosseum-arm64-v8a-release-unsigned-${{ github.run_id }}
          path: |
            apk-out-release-unsigned/colosseum-arm64-v8a-release-unsigned.apk
            apk-out-release-unsigned/colosseum-arm64-v8a-release-unsigned.apk.sha256
            apk-out-release-unsigned/release-verification.json
            apk-out-release-unsigned/release-manifest.json
            apk-out-release-unsigned/source-before.json
            apk-out-release-unsigned/source-after.json
            release-cmake-identity.txt
            build-release-unsigned.log
            nuvio-diag/engine-artifact-verify.log
            nuvio-diag/engine-stamp.txt
          retention-days: 14
          if-no-files-found: error

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: android-ccache-v1-${{ github.sha }}

      - name: APK checksums
        if: ${{ !inputs.nuvio_diagnostic_arm64 && !inputs.release_unsigned_arm64 }}
        run: cat apk-out/*.sha256 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.nuvio_diagnostic_arm64 && !inputs.release_unsigned_arm64 }}
        with:
          name: colosseum-x86_64-debug-apk
          path: |
            apk-out/colosseum-x86_64-debug.apk
            apk-out/colosseum-x86_64-debug.apk.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.nuvio_diagnostic_arm64 && !inputs.release_unsigned_arm64 }}
        with:
          name: colosseum-arm64-v8a-debug-apk
          path: |
            apk-out/colosseum-arm64-v8a-debug.apk
            apk-out/colosseum-arm64-v8a-debug.apk.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-build-logs
          path: |
            build-*.log
            qt-host-dependencies.log
            qml-*.log

  emulator-smoke:
    needs: build
    if: ${{ !inputs.nuvio_diagnostic_arm64 && !inputs.release_unsigned_arm64 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: colosseum-x86_64-debug-apk
          path: apk
      - name: Verify APK checksum
        run: cd apk && sha256sum -c colosseum-x86_64-debug.apk.sha256
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, reach initial world, and hold for 60 s on an API 34 x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/android/emulator_smoke.sh apk/colosseum-x86_64-debug.apk smoke-artifacts 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-x86_64
          path: smoke-artifacts
