name: android-hosted-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify hosted runner resources and download access
        shell: bash
        run: |
          set -euo pipefail
          printf 'ANDROID_HOSTED_PROBE_START\n'
          uname -sm
          nproc
          free -h
          df -h "$RUNNER_TEMP"
          for url in https://download.qt.io https://dl.google.com/android/repository/repository2-1.xml; do
            curl --fail --location --head --max-time 30 --silent --show-error --output /dev/null "$url"
          done
          printf 'ANDROID_HOSTED_PROBE_PASS\n'
