name: android

# The normal Android lane and optional emulator proof are manual.
on:
  workflow_dispatch:
    inputs:
      publish_apks:
        description: Upload both APKs as workflow artifacts
        type: boolean
        default: true
      nuvio_proof:
        description: Run the isolated Nuvio crash and timeout proof on an emulator
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.11.1"
  COLOSSEUM_ANDROID_TOOLCHAIN: ${{ github.workspace }}/../colosseum-android
  COLOSSEUM_ANDROID_DEPS: ${{ github.workspace }}/../colosseum-android-deps
  COLOSSEUM_ANDROID_BUILD: ${{ github.workspace }}/native/build-android

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.nuvio_proof && 255 || 195 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Android source and build contracts
        run: |
          set -o pipefail
          bash -e <<'BASH' 2>&1 | tee android-preflight.log
          python tests/test_android_cache_paths.py
          python tests/test_android_reader_session.py
          node tests/android_reader_boot_test.mjs
          python tests/test_android_openssl_packaging_contract.py
          python tests/test_android_runtime_bundle.py
          python tests/test_android_feria_contract.py
          python tests/test_android_vault_contract.py
          python tests/test_android_vault_media_boundary.py
          python tests/android_emulator_smoke_test.py
          python tests/test_android_nuvio_proof_driver.py
          python tests/test_android_nuvio_cmake.py
          python tests/test_android_build_variants.py
          python tests/test_android_streamserver_stub.py
          python tests/android_nuvio_bridge_test.py
          python tests/test_android_toolchain_install.py
          BASH

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift || true
          df -h "$GITHUB_WORKSPACE" | tail -1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache binutils patch \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libx11-6 libdbus-1-3 libglib2.0-0t64
          ccache --max-size=2G

      - name: Normalize Android cache paths
        id: android-paths
        run: bash scripts/android/prepare_cache_paths.sh

      - name: Restore toolchain (Qt, SDK, NDK)
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.android-paths.outputs.toolchain }}/Qt
            ${{ steps.android-paths.outputs.sdk }}/ndk/27.2.12479018
          key: android-toolchain-v1-${{ hashFiles('scripts/android/install_toolchain.sh') }}

      - name: Install toolchain
        run: scripts/android/install_toolchain.sh

      - name: Save installed toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.android-paths.outputs.toolchain }}/Qt
            ${{ steps.android-paths.outputs.sdk }}/ndk/27.2.12479018
          key: android-toolchain-v1-${{ hashFiles('scripts/android/install_toolchain.sh') }}

      - name: Compile Android-selected QML before building APKs
        run: |
          set -o pipefail
          QT_HOST="$COLOSSEUM_ANDROID_TOOLCHAIN/Qt/$QT_VERSION/gcc_64"
          ldd "$QT_HOST/lib/libQt6Gui.so.6" "$QT_HOST/plugins/platforms/libqoffscreen.so" | tee qt-host-dependencies.log
          if grep -q 'not found' qt-host-dependencies.log; then exit 1; fi
          python tests/android_qml_preflight.py --qt-root "$QT_HOST" 2>&1 | tee qml-preflight.log
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software "$QT_HOST/bin/qmltestrunner" -input tests/qml/tst_account_choice_accessibility.qml 2>&1 | tee qml-accessibility.log

      - name: Restore dependency prefixes
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.android-paths.outputs.deps }}
          key: android-deps-v1-${{ hashFiles('scripts/android/build_deps.sh') }}

      - name: Build OpenSSL / Boost / libtorrent (cache miss only)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          source "$COLOSSEUM_ANDROID_TOOLCHAIN/env.sh"
          scripts/android/build_deps.sh arm64-v8a x86_64

      - name: Save built dependency prefixes
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.android-paths.outputs.deps }}
          key: android-deps-v1-${{ hashFiles('scripts/android/build_deps.sh') }}

      - name: Decode stable test signing key
        # Test-only keystore shared by every CI build so a new APK installs over the previous one.
        # Secrets: ANDROID_TEST_KEYSTORE_B64 (base64 .jks) and ANDROID_TEST_KEYSTORE_PASSWORD.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_TEST_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::ANDROID_TEST_KEYSTORE_B64/PASSWORD secrets are not set; APKs keep a per-run debug signature and will not install over each other."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/colosseum-test.jks"
          echo "COLOSSEUM_ANDROID_KEYSTORE=$RUNNER_TEMP/colosseum-test.jks" >> "$GITHUB_ENV"

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: android-ccache-v1-${{ github.sha }}
          restore-keys: android-ccache-v1-

      - name: Build x86_64 APK
        env:
          COLOSSEUM_ANDROID_CMAKE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCOLOSSEUM_NUVIO_ANDROID=ON -DCOLOSSEUM_NUVIO_ANDROID_PROOF=OFF
          COLOSSEUM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          COLOSSEUM_TMDB_KEY: ${{ secrets.COLOSSEUM_TMDB_KEY }}
        run: |
          source "$COLOSSEUM_ANDROID_TOOLCHAIN/env.sh"
          set -o pipefail
          scripts/android/build_apk.sh x86_64 apk-out 2>&1 | tee build-x86_64.log

      - name: Build arm64-v8a APK
        env:
          COLOSSEUM_ANDROID_CMAKE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCOLOSSEUM_NUVIO_ANDROID=ON -DCOLOSSEUM_NUVIO_ANDROID_PROOF=OFF
          COLOSSEUM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          COLOSSEUM_TMDB_KEY: ${{ secrets.COLOSSEUM_TMDB_KEY }}
        run: |
          source "$COLOSSEUM_ANDROID_TOOLCHAIN/env.sh"
          set -o pipefail
          scripts/android/build_apk.sh arm64-v8a apk-out 2>&1 | tee build-arm64-v8a.log

      - name: Verify normal APKs contain Nuvio without proof hooks
        run: |
          python - <<'PY'
          from zipfile import ZipFile

          markers = (b"NUVIO_ANDROID_PROOF=", b"proofWorkerStarted",
                     b"proofWorkerFinished", b"__proofNativeCrash")
          for abi in ("x86_64", "arm64-v8a"):
              with ZipFile(f"apk-out/colosseum-{abi}-debug.apk") as apk:
                  helper = f"lib/{abi}/libcolosseum_nuvio_host_{abi}.so"
                  if helper not in apk.namelist():
                      raise SystemExit(f"Missing Nuvio helper in normal {abi} APK")
                  for member in apk.namelist():
                      if member.startswith(f"lib/{abi}/") and member.endswith(".so"):
                          binary = apk.read(member)
                          if any(marker in binary for marker in markers):
                              raise SystemExit(f"Proof hooks in normal {abi} APK: {member}")
          PY

      - name: APK checksums
        run: cat apk-out/*.sha256 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: inputs.publish_apks
        with:
          name: colosseum-x86_64-debug-apk
          path: |
            apk-out/colosseum-x86_64-debug.apk
            apk-out/colosseum-x86_64-debug.apk.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.publish_apks
        with:
          name: colosseum-arm64-v8a-debug-apk
          path: |
            apk-out/colosseum-arm64-v8a-debug.apk
            apk-out/colosseum-arm64-v8a-debug.apk.sha256
          if-no-files-found: error
      - name: Verify x86_64 APK checksum
        run: cd apk-out && sha256sum -c colosseum-x86_64-debug.apk.sha256
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test (API 34 x86_64, initial world and 60 s hold)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/android/emulator_smoke.sh apk-out/colosseum-x86_64-debug.apk smoke-artifacts 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-x86_64
          path: smoke-artifacts
          if-no-files-found: ignore

      - name: Build instrumented Nuvio proof APK for emulator only
        if: inputs.nuvio_proof
        env:
          COLOSSEUM_ANDROID_CMAKE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCOLOSSEUM_NUVIO_ANDROID=ON -DCOLOSSEUM_NUVIO_ANDROID_PROOF=ON
          COLOSSEUM_ANDROID_BUILD: ${{ github.workspace }}/native/build-android-proof
          COLOSSEUM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          COLOSSEUM_TMDB_KEY: ${{ secrets.COLOSSEUM_TMDB_KEY }}
        run: |
          source "$COLOSSEUM_ANDROID_TOOLCHAIN/env.sh"
          set -o pipefail
          scripts/android/build_apk.sh x86_64 apk-nuvio-proof 2>&1 | tee build-nuvio-proof-x86_64.log
          # Instrumentation changes Qt's generated meta-object ABI. Never reuse
          # production autogen/package outputs for this distinct variant.
          proof_moc=$(find "$COLOSSEUM_ANDROID_BUILD/x86_64/nuvio/colosseum_nuvio_autogen" -name moc_NuvioSourceResolver.cpp -type f -print -quit)
          test -n "$proof_moc"
          grep -q 'proofWorkerStarted' "$proof_moc"
          grep -q 'proofWorkerFinished' "$proof_moc"
          cp "$proof_moc" apk-nuvio-proof/proof-moc_NuvioSourceResolver.cpp

      - uses: actions/upload-artifact@v4
        if: inputs.nuvio_proof
        with:
          name: nuvio-proof-x86_64-debug-apk
          path: apk-nuvio-proof
          retention-days: 1
          if-no-files-found: error

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: android-ccache-v1-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-build-logs
          path: |
            build-*.log
            android-preflight.log
            qt-host-dependencies.log
            qml-*.log

  nuvio-emulator-proof:
    if: inputs.nuvio_proof
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: nuvio-proof-x86_64-debug-apk
          path: apk
      - name: Verify proof APK checksum
        run: cd apk && sha256sum -c colosseum-x86_64-debug.apk.sha256
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prove repo, stream, crash and timeout on disposable emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            bash scripts/android/emulator_smoke.sh apk/colosseum-x86_64-debug.apk nuvio-artifacts/startup 10
            python scripts/android/nuvio_emulator_proof.py --apk apk/colosseum-x86_64-debug.apk --artifacts nuvio-artifacts --commit "$GITHUB_SHA" --repository "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/tests/fixtures/nuvio-android-proof/manifest.json" --plugin public-domain-archive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuvio-emulator-proof-x86_64
          path: nuvio-artifacts
          if-no-files-found: error
