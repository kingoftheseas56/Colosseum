name: android
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify Android smoke test contracts
        run: python tests/android_emulator_smoke_test.py
