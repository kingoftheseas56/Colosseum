name: Linux Debian installer candidate

on:
  workflow_dispatch:
    inputs:
      receive_run_id:
        description: Existing Linux candidate run to qualify without rebuilding (empty builds normally)
        required: false
        default: ''
        type: string
      receive_source_sha:
        description: Required exact application source commit in receive-only mode
        required: false
        default: ''
        type: string
      receive_sha256:
        description: Required exact DEB SHA256 in receive-only mode
        required: false
        default: ''
        type: string
  push:
    branches: ['codex/120-linux-deb-closure-20261101']
    paths:
      - '.github/workflows/release-linux-deb.yml'
      - 'native/player/**'
      - 'qml/PlayerPage.qml'
      - 'qml/Main.qml'
      - 'tests/continue_local_detail_routing_test.mjs'
      - 'tests/player_local_error_retry_test.mjs'
      - 'tests/theatre_terminal_replay_test.mjs'
      - 'tools/linux-release/**'
      - 'scripts/stage_api_content.py'
      - '.gitattributes'
      - 'tests/test_linux_release_policy.py'
      - 'tests/test_linux_installed_player_smoke.py'
      - 'tests/test_linux_installed_picker_smoke.py'
      - 'tests/test_vinyl_release_gate.py'
      - 'tests/test_stage_api_content.py'

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: inputs.receive_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      ECM_VERSION: '6.15.0'
      ECM_SHA256: f7cd022095a9e6bdbe5897720a24bfda81d211757b7c08b173061962bf2ee0b2
      MPVQT_VERSION: '1.2.0'
      MPVQT_SHA256: 8660ad79c0d60fed77f29b36e1742841466af5405de702c81a121e6eeb625ebb
    steps:
      - uses: actions/checkout@v7
      - name: Install build and package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config patchelf binutils dpkg-dev \
            libmpv-dev libtorrent-rasterbar-dev libboost-all-dev libssl-dev libsecret-1-dev \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxcb-cursor0 ffmpeg \
            libgdk-pixbuf-2.0-dev librsvg2-common \
            gnome-keyring dbus-daemon
      - name: Packaging regressions and public path guard
        run: |
          python3 -m unittest -v tests.test_linux_release_policy tests.test_linux_installed_player_smoke tests.test_linux_installed_picker_smoke tests.test_stage_api_content tests.test_vinyl_release_gate
          python3 tools/linux-release/test_packaging.py
          python3 scripts/check_public_paths.py
      - name: Continue local detail routing regressions
        run: |
          node tests/continue_local_detail_routing_test.mjs
          node tests/continue_local_comic_routing_test.mjs
          node tests/continue_manga_resume_routing_test.mjs
          node tests/collections_routes_test.mjs
          node tests/player_local_error_retry_test.mjs
          node tests/player_recovery_resume_test.mjs
          node tests/theatre_terminal_replay_test.mjs
      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.11.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtwebengine qtwebchannel qtwebsockets qtpositioning qtserialport qtimageformats qtquick3d qtshadertools'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'
          cache: true
      - name: Verify Linux account persistence and locked-keyring failures
        run: |
          mkdir -p release-output/accounts
          cmake -S tests/account_secure_storage -B "$RUNNER_TEMP/account-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build "$RUNNER_TEMP/account-build" --parallel 2
          sh tests/account_secure_storage/run-linux-tests.sh "$RUNNER_TEMP/account-build" \
            2>&1 | tee release-output/accounts/secret-service-tests.txt
      - name: Build pinned ECM and MpvQt
        run: |
          curl --fail --location --retry 3 "https://download.kde.org/Attic/frameworks/6.15/extra-cmake-modules-$ECM_VERSION.tar.xz" -o "$RUNNER_TEMP/ecm.tar.xz"
          echo "$ECM_SHA256  $RUNNER_TEMP/ecm.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/ecm-source"
          tar -xf "$RUNNER_TEMP/ecm.tar.xz" -C "$RUNNER_TEMP/ecm-source" --strip-components=1
          cmake -S "$RUNNER_TEMP/ecm-source" -B "$RUNNER_TEMP/ecm-build" -G Ninja -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/ecm-install"
          cmake --build "$RUNNER_TEMP/ecm-build" --target install --parallel 2
          curl --fail --location --retry 3 "https://download.kde.org/stable/mpvqt/mpvqt-$MPVQT_VERSION.tar.xz" -o "$RUNNER_TEMP/mpvqt.tar.xz"
          echo "$MPVQT_SHA256  $RUNNER_TEMP/mpvqt.tar.xz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/mpvqt-source"
          tar -xf "$RUNNER_TEMP/mpvqt.tar.xz" -C "$RUNNER_TEMP/mpvqt-source" --strip-components=1
          cmake -S "$RUNNER_TEMP/mpvqt-source" -B "$RUNNER_TEMP/mpvqt-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/mpvqt-install" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$RUNNER_TEMP/ecm-install"
          cmake --build "$RUNNER_TEMP/mpvqt-build" --target install --parallel 2
      - name: Build matching Qt TIFF plugin with bundled libtiff
        run: |
          git init "$RUNNER_TEMP/qtimageformats"
          git -C "$RUNNER_TEMP/qtimageformats" remote add origin https://github.com/qt/qtimageformats.git
          git -C "$RUNNER_TEMP/qtimageformats" fetch --depth 1 origin 77f35e5694885844c3eb3a737769b5ed290b8ccc
          git -C "$RUNNER_TEMP/qtimageformats" checkout --detach FETCH_HEAD
          cmake -S "$RUNNER_TEMP/qtimageformats" -B "$RUNNER_TEMP/qtimageformats-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DFEATURE_system_tiff=OFF -DQT_BUILD_EXAMPLES=OFF -DQT_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/qtimageformats-build" --target QTiffPlugin --parallel 2
      - name: Compile standard production candidate
        run: |
          cmake -S native -B "$RUNNER_TEMP/app-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCOLOSSEUM_BUILD_PLAYER2=OFF -DCOLOSSEUM_PLAYER2_IN_APP=OFF \
            -DCOLOSSEUM_NO_ACCOUNT_EDITION=OFF -DCOLOSSEUM_UPDATE_TESTING=OFF \
            -DCOLOSSEUM_FERIA_IN_APP=OFF -DCOLOSSEUM_VINYL_IN_APP=OFF \
            -DCOLOSSEUM_ENABLE_VINYL_QUALIFICATION=OFF -DCOLOSSEUM_ENABLE_VINYL_TEST_FIXTURES=OFF \
            -DCOLOSSEUM_CONTENT_API_URL=https://colosseum-content-api.colosseum-watchparty-relay.workers.dev \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$RUNNER_TEMP/ecm-install;$RUNNER_TEMP/mpvqt-install" \
            -DMPVQT_PREFIX="$RUNNER_TEMP/mpvqt-install"
          cmake --build "$RUNNER_TEMP/app-build" --target colosseum_runtime_ready --parallel 2
      - name: Assemble and verify Linux runtime
        run: |
          notices="$RUNNER_TEMP/notices"
          mkdir -p "$notices/host-copyrights"
          cp -r "$RUNNER_TEMP/mpvqt-source/LICENSES" "$notices/MpvQt-LICENSES"
          cp -r "$RUNNER_TEMP/qtimageformats/LICENSES" "$notices/QtImageFormats-LICENSES"
          cp "$RUNNER_TEMP/qtimageformats/src/3rdparty/libtiff/COPYRIGHT" "$notices/libtiff-COPYRIGHT"
          cp "$RUNNER_TEMP/qtimageformats/src/3rdparty/libtiff/qt_attribution.json" "$notices/libtiff-qt_attribution.json"
          find /usr/share/doc -name copyright -type f -exec cp --parents '{}' "$notices/host-copyrights/" ';'
          dpkg-query -W -f='${Package}\t${Version}\t${source:Package}\t${source:Version}\n' > "$notices/ubuntu-package-provenance.tsv"
          printf '%s\n' 'Private review candidate. Bundled libmpv/FFmpeg/Qt dependencies retain their own licenses. Corresponding-source and redistribution obligations remain a public-release gate.' > "$notices/NOTICE-CANDIDATE.txt"
          args=()
          # The app uses SQLite, not the SDK's optional external database clients.
          for plugin in "$QT_ROOT_DIR"/plugins/sqldrivers/*.so; do
            [[ "$(basename "$plugin")" == libqsqlite.so ]] || args+=(--exclude-plugin "sqldrivers/$(basename "$plugin")")
          done
          tiff="$(find "$RUNNER_TEMP/qtimageformats-build" -name libqtiff.so -type f -print -quit)"
          test -n "$tiff"
          args+=(--plugin-override "imageformats/libqtiff.so=$tiff")
          pixbuf_loaders="$(pkg-config --variable=gdk_pixbuf_moduledir gdk-pixbuf-2.0)"
          pixbuf_query="$(pkg-config --variable=gdk_pixbuf_query_loaders gdk-pixbuf-2.0)"
          test -d "$pixbuf_loaders"
          test -x "$pixbuf_query"
          args+=(--gdk-pixbuf-loaders-dir "$pixbuf_loaders" --gdk-pixbuf-query-loaders "$pixbuf_query")
          python3 tools/linux-release/assemble.py \
            --source "$GITHUB_WORKSPACE" --build "$RUNNER_TEMP/app-build" --qt "$QT_ROOT_DIR" \
            --stage "$RUNNER_TEMP/AppDir" --commit "$(git rev-parse HEAD)" --patchelf "$(command -v patchelf)" \
            --dep-lib "$RUNNER_TEMP/mpvqt-install/lib" --dep-lib "$RUNNER_TEMP/mpvqt-install/lib/x86_64-linux-gnu" \
            --binary /usr/bin/ffmpeg --binary /usr/bin/ffprobe --dependency-notices "$notices" "${args[@]}"
          mkdir -p release-output
          python3 tools/linux-release/check_package.py "$RUNNER_TEMP/AppDir" --report release-output/package-check.json
          python3 scripts/linux_runtime_dependency_gate.py --appdir "$RUNNER_TEMP/AppDir"
          cp "$RUNNER_TEMP/AppDir/BUILD-IDENTITY.json" release-output/
          python3 tools/linux-release/package_deb.py --stage "$RUNNER_TEMP/AppDir" --output release-output/Colosseum-1.2.0-linux-amd64.deb
          ar t release-output/Colosseum-1.2.0-linux-amd64.deb > release-output/deb-archive-members.txt
          printf 'debian-binary\ncontrol.tar.xz\ndata.tar.xz\n' | diff -u - release-output/deb-archive-members.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Colosseum-1.2.0-linux-deb-candidate
          path: release-output/
          if-no-files-found: warn
          retention-days: 7

  installed-smoke:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.receive_run_id != '')) }}
    runs-on: ubuntu-24.04
    name: Installed smoke (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-24.04
            image: ubuntu:24.04
          - label: debian-13
            image: debian:13
    container: ${{ matrix.image }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: Colosseum-1.2.0-linux-deb-candidate
          path: package
          run-id: ${{ inputs.receive_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install on clean Linux without a Qt SDK
        env:
          DEBIAN_FRONTEND: noninteractive
          RECEIVE_RUN_ID: ${{ inputs.receive_run_id }}
          EXPECTED_SOURCE_SHA: ${{ inputs.receive_source_sha || github.sha }}
          EXPECTED_DEB_SHA256: ${{ inputs.receive_sha256 }}
          QUALIFICATION_SOURCE_SHA: ${{ github.sha }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 xvfb xauth desktop-file-utils libgl1-mesa-dri libglx-mesa0 xdotool librsvg2-common adwaita-icon-theme dbus
          # Trust-prerequisite probe: record whether the clean container has any
          # system CA store before the package installs, so the after-install
          # state proves the Debian dependency (not a recommendation) supplied it.
          mkdir -p /tmp/installed-receipts
          dpkg-query -W -f='${db:Status-Abbrev}' ca-certificates > /tmp/installed-receipts/ca-certificates-before.txt 2>/dev/null || echo 'absent' > /tmp/installed-receipts/ca-certificates-before.txt
          dpkg-query -W -f='${db:Status-Abbrev}' libgtk-3-common > /tmp/installed-receipts/gtk-schemas-before.txt 2>/dev/null || echo 'absent' > /tmp/installed-receipts/gtk-schemas-before.txt
          cd package
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          expected = os.environ['EXPECTED_SOURCE_SHA']
          received = os.environ.get('RECEIVE_RUN_ID', '')
          if not re.fullmatch('[0-9a-f]{40}', expected):
              raise SystemExit('Exact application source commit required')
          if received and (not re.fullmatch('[0-9]+', received) or not re.fullmatch('[0-9a-f]{64}', os.environ.get('EXPECTED_DEB_SHA256', ''))):
              raise SystemExit('Receive-only qualification requires exact run ID and DEB digest')
          identity = json.loads(Path('BUILD-IDENTITY.json').read_text())
          if identity['source_commit'] != expected:
              raise SystemExit('Received candidate source does not match the requested pin')
          receipt = {'application_source_commit': expected, 'qualification_source_commit': os.environ['QUALIFICATION_SOURCE_SHA'],
                     'received_build_run': received or None, 'expected_deb_sha256': os.environ.get('EXPECTED_DEB_SHA256') or None}
          Path('/tmp/installed-receipts/qualification-identity.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          sha256sum --check --strict Colosseum-1.2.0-linux-amd64.deb.sha256
          if [ -n "$RECEIVE_RUN_ID" ]; then
            printf '%s  %s\n' "$EXPECTED_DEB_SHA256" 'Colosseum-1.2.0-linux-amd64.deb' | sha256sum --check --strict
          fi
          apt-get install -y --no-install-recommends ./Colosseum-1.2.0-linux-amd64.deb
          python3 -c 'import json,os; from pathlib import Path; assert json.loads(Path("/opt/colosseum/BUILD-IDENTITY.json").read_text())["source_commit"] == os.environ["EXPECTED_SOURCE_SHA"], "Installed source pin mismatch"'
          dpkg-query -W -f='${db:Status-Abbrev}' ca-certificates > /tmp/installed-receipts/ca-certificates-after.txt
          test "$(cat /tmp/installed-receipts/ca-certificates-after.txt)" = 'ii '
          test -s /etc/ssl/certs/ca-certificates.crt
          dpkg-query -W -f='${db:Status-Abbrev}' libgtk-3-common > /tmp/installed-receipts/gtk-schemas-after.txt
          test "$(cat /tmp/installed-receipts/gtk-schemas-after.txt)" = 'ii '
          test -f /usr/share/glib-2.0/schemas/org.gtk.Settings.FileChooser.gschema.xml
          test -s /usr/share/glib-2.0/schemas/gschemas.compiled
          desktop-file-validate /usr/share/applications/colosseum.desktop
          test "$(/usr/bin/colosseum --version)" = 'Colosseum 1.2.0'
      - name: Start and quit installed UI as a normal user
        run: |
          useradd --create-home --shell /bin/bash package-test
          mkdir -p /tmp/installed-receipts
          chown package-test:package-test /tmp/installed-receipts
          runuser -u package-test -- dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' \
            python3 tools/linux-release/smoke_installed.py --platform-theme gtk3 --output /tmp/installed-receipts
      - name: Play a checked-in local fixture through installed Player 1
        run: |
          runuser -u package-test -- dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' \
            python3 tools/linux-release/smoke_installed_player.py \
              --fixture "$GITHUB_WORKSPACE/tests/lanista_capture/assets/Colosseum.mp4" \
              --output /tmp/installed-receipts
      - name: Verify clean uninstall preserves user files
        run: |
          runuser -u package-test -- sh -c 'mkdir -p "$HOME/.local/share/Colosseum"; echo preserve > "$HOME/.local/share/Colosseum/package-uninstall-sentinel"'
          apt-get remove -y colosseum
          test ! -e /opt/colosseum
          test ! -e /usr/bin/colosseum
          test ! -e /usr/share/applications/colosseum.desktop
          test "$(cat /home/package-test/.local/share/Colosseum/package-uninstall-sentinel)" = preserve
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Colosseum-1.2.0-linux-installed-smoke-${{ matrix.label }}
          path: /tmp/installed-receipts/
          if-no-files-found: warn
          retention-days: 7
