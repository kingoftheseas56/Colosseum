name: arc63-b-glide-verify

on:
  push:
    branches:
      - preflight/arc63-b-verify-linux

permissions:
  contents: read

env:
  PRODUCT_SHA: e958ccc5ae885ee1420bb44c450ff4ad0a6b5bf3
  PINNED_WIP: 32646ca3483776ded987c27b6f67d9f7d89a32db
  ECM_VERSION: "6.15.0"
  ECM_SHA256: "f7cd022095a9e6bdbe5897720a24bfda81d211757b7c08b173061962bf2ee0b2"
  MPVQT_VERSION: "1.2.0"
  MPVQT_SHA256: "8660ad79c0d60fed77f29b36e1742841466af5405de702c81a121e6eeb625ebb"

jobs:
  linux-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Prove exact product SHA
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"

      - name: B diff whitespace check
        run: |
          git diff --check "$PINNED_WIP..$PRODUCT_SHA" -- \
            docs/colosseum-lanista-verification.md \
            native/devtools/LanistaServer.cpp \
            qml/UniversesWorld.qml \
            tests/lanista_capture/arc63_b_glide.json \
            tests/lanista_harness.cpp \
            tests/qml/tst_UniversesWorld.qml

      - name: Validate production scenario JSON
        run: python -m json.tool tests/lanista_capture/arc63_b_glide.json >/dev/null

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Correct inherited stale depth assertion in runner only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/lanista_harness.cpp")
          s = p.read_text(encoding="utf-8")
          old1 = 'absurd.value("maxDepthUsed").toInt() == 64'
          old2 = '"ceiling (64), got %1"'
          if s.count(old1) != 1 or s.count(old2) != 1:
              raise SystemExit(f"unexpected stale assertion counts: {s.count(old1)}, {s.count(old2)}")
          s = s.replace(old1, 'absurd.value("maxDepthUsed").toInt() == 256', 1)
          s = s.replace(old2, '"ceiling (256), got %1"', 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: "6.11.1"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: "qtwebengine qtwebchannel qtwebsockets qtpositioning"
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build pkg-config libmpv-dev libtorrent-rasterbar-dev \
            libboost-all-dev libssl-dev libsecret-1-dev libgl1-mesa-dev libegl1-mesa-dev \
            libxkbcommon-dev libxcb-cursor0 xvfb xauth ffmpeg p7zip-full libarchive-tools

      - name: Build Extra CMake Modules
        run: |
          archive="$RUNNER_TEMP/ecm.tar.xz"
          source="$RUNNER_TEMP/ecm-source"
          build="$RUNNER_TEMP/ecm-build"
          install="$RUNNER_TEMP/ecm-install"
          curl --fail --location --retry 3 "https://download.kde.org/Attic/frameworks/6.15/extra-cmake-modules-$ECM_VERSION.tar.xz" --output "$archive"
          echo "$ECM_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$source"
          tar -xf "$archive" -C "$source" --strip-components=1
          cmake -S "$source" -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX="$install"
          cmake --build "$build" --target install --parallel 2
          echo "ECM_ROOT=$install" >> "$GITHUB_ENV"

      - name: Build MpvQt
        run: |
          archive="$RUNNER_TEMP/mpvqt.tar.xz"
          source="$RUNNER_TEMP/mpvqt-source"
          build="$RUNNER_TEMP/mpvqt-build"
          install="$RUNNER_TEMP/mpvqt-install"
          curl --fail --location --retry 3 "https://download.kde.org/stable/mpvqt/mpvqt-$MPVQT_VERSION.tar.xz" --output "$archive"
          echo "$MPVQT_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$source"
          tar -xf "$archive" -C "$source" --strip-components=1
          cmake -S "$source" -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$install" -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$ECM_ROOT"
          cmake --build "$build" --target install --parallel 2
          echo "MPVQT_ROOT=$install" >> "$GITHUB_ENV"

      - name: Configure B harness
        run: |
          build="$RUNNER_TEMP/arc63-b-linux"
          cmake -S native -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON -DCOLOSSEUM_BUILD_PLAYER2=OFF -DCOLOSSEUM_PLAYER2_IN_APP=OFF \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$ECM_ROOT;$MPVQT_ROOT" -DMPVQT_PREFIX="$MPVQT_ROOT"
          echo "B_BUILD=$build" >> "$GITHUB_ENV"

      - name: Build B harness
        run: cmake --build "$B_BUILD" --target lanista_harness --parallel 2

      - name: Run B harness on Xvfb
        env:
          QT_QPA_PLATFORM: xcb
          QSG_NO_VSYNC: "1"
          QT_FORCE_STDERR_LOGGING: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a "$B_BUILD/lanista_harness"

      - name: Run Universes production QML test
        env:
          QT_QPA_PLATFORM: xcb
          QSG_NO_VSYNC: "1"
          QT_FORCE_STDERR_LOGGING: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a "$QT_ROOT_DIR/bin/qmltestrunner" -input tests/qml/tst_UniversesWorld.qml -import qml
