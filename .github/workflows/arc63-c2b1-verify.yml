name: arc63-c2b1-verify

on:
  push:
    branches:
      - preflight/arc63-c2-hover-click

permissions:
  contents: read

jobs:
  linux-xvfb:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MPVQT_VERSION: "1.2.0"
      MPVQT_SHA256: "8660ad79c0d60fed77f29b36e1742841466af5405de702c81a121e6eeb625ebb"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Exact C2b1 whitespace gate
        shell: bash
        run: |
          git diff --check 68c14d33a1a618d685533a04f0dd08d13def90c8..HEAD -- \
            native/devtools/LanistaServer.cpp \
            native/devtools/LanistaServer.h \
            tests/lanista_harness.cpp

      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: "6.11.1"
          host: linux
          target: desktop
          modules: "qtwebengine qtwebchannel qtwebsockets qtpositioning"
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          cache: true

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake curl xz-utils pkg-config \
            libmpv-dev libtorrent-rasterbar-dev libboost-all-dev \
            libssl-dev libsecret-1-dev xvfb xauth libxtst6 libxcb-cursor0 \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb-xinerama0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0

      - name: Build pinned ECM 6.15.0
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/ecm-source"
          build_root="$RUNNER_TEMP/ecm-build"
          install_root="$RUNNER_TEMP/ecm-install"
          git clone --filter=blob:none https://github.com/KDE/extra-cmake-modules.git "$source_root"
          git -C "$source_root" checkout d3263ec15541584c211ce106db92486881e07172
          cmake -S "$source_root" -B "$build_root" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$install_root"
          cmake --build "$build_root" --target install --parallel 2
          echo "ECM_ROOT=$install_root" >> "$GITHUB_ENV"

      - name: Build pinned MpvQt
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mpvqt.tar.xz"
          source_root="$RUNNER_TEMP/mpvqt-source"
          build_root="$RUNNER_TEMP/mpvqt-build"
          install_root="$RUNNER_TEMP/mpvqt-install"
          curl -L --fail --retry 3 \
            "https://download.kde.org/stable/mpvqt/mpvqt-$MPVQT_VERSION.tar.xz" \
            -o "$archive"
          echo "$MPVQT_SHA256  $archive" | sha256sum -c -
          mkdir -p "$source_root"
          tar -xf "$archive" -C "$source_root"
          source_dir="$(find "$source_root" -maxdepth 1 -mindepth 1 -type d -name 'mpvqt-*' | head -n1)"
          test -n "$source_dir"
          cmake -S "$source_dir" -B "$build_root" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$install_root" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$ECM_ROOT" \
            -DBUILD_EXAMPLES=OFF
          cmake --build "$build_root" --target install --parallel 2
          echo "MPVQT_ROOT=$install_root" >> "$GITHUB_ENV"

      - name: Apply inherited harness-only depth correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tests/lanista_harness.cpp")
          s = p.read_text(encoding="utf-8")
          a = 'absurd.value("maxDepthUsed").toInt() == 64'
          b = '"ceiling (64), got %1"'
          if s.count(a) != 1 or s.count(b) != 1:
              raise SystemExit("inherited 64-vs-256 assertion shape changed")
          s = s.replace(a, 'absurd.value("maxDepthUsed").toInt() == 256', 1)
          s = s.replace(b, '"ceiling (256), got %1"', 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Configure focused native build
        shell: bash
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/c2b1-build"
          cmake -S native -B "$build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DCOLOSSEUM_NO_COMPILER_CACHE=ON \
            -DMPVQT_PREFIX="$MPVQT_ROOT" \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR;$MPVQT_ROOT"
          echo "C2B1_BUILD=$build" >> "$GITHUB_ENV"

      - name: Focused compile
        shell: bash
        run: cmake --build "$C2B1_BUILD" --target lanista_harness --parallel 2

      - name: Focused native pointer-click harness under Xvfb
        shell: bash
        env:
          QT_QPA_PLATFORM: xcb
          QSG_NO_VSYNC: "1"
          QT_FORCE_STDERR_LOGGING: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          xvfb-run -a "$C2B1_BUILD/lanista_harness" | tee "$RUNNER_TEMP/lanista-c2b1.log"
          grep -F "LANISTA_OK" "$RUNNER_TEMP/lanista-c2b1.log"
