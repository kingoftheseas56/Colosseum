name: RCO Common Crawl recovery

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/chatgpt-rco-commoncrawl.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 warcio

      - name: Recover exact ranking pages
        run: |
          python - <<'PY'
          import io
          import json
          import time
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup
          from warcio.archiveiterator import ArchiveIterator

          OUT = Path('rco-recovery-artifact')
          OUT.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers.update({'User-Agent': 'Colosseum-RCO-Recovery/3.0'})

          EXPECTED = {
            2: ['Action Comics (2016)','Fantastic Four (1961)','Doomsday Clock','Detective Comics (1937)','Teen Titans (2016)','Star Wars: Darth Vader (2020)','Watchmen (1986)','Spider-Man/Deadpool','Preacher','Injustice: Gods Among Us Year Three','Injustice: Gods Among Us: Year Two','Injustice: Gods Among Us Year Four','Hellblazer','Nickelodeon Avatar: The Last Airbender - The Promise','Wonder Woman (2016)','Deadly Class','Old Man Logan (2016)','Absolute Batman','Batman (2011)','Star Wars (2015)','Monstress','Teenage Mutant Ninja Turtles (2011)','Darth Vader (2015)','The Avengers (1963)','Dark Nights: Metal','Action Comics (1938)','Thor (2020)','Miles Morales: Spider-Man (2019)','Justice League (2011)','Nickelodeon Avatar: The Last Airbender - The Search','The Batman Who Laughs','Superior Spider-Man (2013)'],
            4: ['Teenage Mutant Ninja Turtles: The Last Ronin','Batman/Superman (2019)','Lucifer (2000)','Superman (2018)','Secret Wars','Moon Knight (2016)','Ultimate X-Men (2001)','The Wicked + The Divine','Marauders (2019)','Sonic Universe','Ultimate Spider-Man (2009)','Dark Nights: Death Metal','Daredevil (1964)','Aquaman (2016)','House of X','Birthright (2014)','The Boys: Herogasm','The Spectacular Spider-Man (1976)','Harley Quinn (2016)','Bone (1991)','Justice League Dark (2018)','Invader Zim','Sex Criminals','Ultimate Spider-Man (2024)','Ultimate Comics Spider-Man (2011)','New Mutants (2019)','Star Wars: Knights Of The Old Republic','The Amazing Spider-Man (2014)','DCeased: Dead Planet','Star Wars (2020)','Hellboy','Hal Jordan And The Green Lantern Corps'],
            5: ['Deathstroke (2016)','Excalibur (2019)','East Of West','Runaways (2017)','The Incredible Hulk (1968)','Superman (1939)',"DCeased: Hope At World's End",'Batman: Three Jokers','Nightwing (1996)','Civil War (2006)','Something is Killing the Children','Green Lanterns','Young Justice (2019)',"Saban's Go Go Power Rangers",'Transmetropolitan','Spider-Gwen [II]','Civil War II','Red Hood And The Outlaws (2011)','Suicide Squad (2016)','Mighty Thor (2016)','Nickelodeon The Legend of Korra: Ruins of the Empire','Paper Girls','Bloodborne','Moon Knight (2021)','Thanos (2016)','Superman/Batman','X-Men (1991)','Catwoman (2018)','Deadpool Kills the Marvel Universe','Batman: The Killing Joke','Infinity Gauntlet (1991)','Peter Parker: The Spectacular Spider-Man'],
            7: ['Radiant Black','Captain Marvel (2019)','Avengers Vs. X-Men','King In Black','Batman and Robin (2011)','Amazing Spider-Man: Renew Your Vows (2017)','Ms. Marvel (2016)','Adventure Time (2012)','Daredevil (1998)','Die','G.I. Joe: A Real American Hero','Doctor Strange (2018)','Champions (2016)','Hawkeye (2012)','The Umbrella Academy: Hotel Oblivion','Injustice: Year Zero','All Star Superman (2006)','Scooby Apocalypse','Kingdom Come (1996)','Dark Knights of Steel','Powers of X','X-Men: Gold (2017)','Giant Days (2015)','Dark Nights: The Batman Who Laughs',"Batman/Superman: World's Finest",'The Savage Dragon (1993)','Batman: Damned','Batman Eternal','Deadpool (2013)','Robin (1993)','Batman: Legends of the Dark Knight','Doctor Strange (2015)']
          }

          def url_for(page):
              return f'https://readcomiconline.li/ComicList/MostPopular?page={page}'

          def parse_titles(html):
              soup = BeautifulSoup(html or '', 'html.parser')
              titles = []
              for block in soup.select('.list-comic .item'):
                  title = ''
                  tooltip_html = block.get('title', '')
                  if tooltip_html:
                      node = BeautifulSoup(tooltip_html, 'html.parser').select_one('p.title')
                      if node:
                          title = node.get_text(' ', strip=True)
                  if not title:
                      node = block.select_one('span.title')
                      if node:
                          title = node.get_text(' ', strip=True)
                  if not title:
                      anchor = block.select_one('a[href*="/Comic/"]')
                      if anchor:
                          title = anchor.get_text(' ', strip=True)
                  if title:
                      titles.append(title)
              return titles

          def query_index(api, page):
              last = None
              for attempt in range(4):
                  try:
                      response = session.get(api, params={'url': url_for(page), 'output': 'json', 'filter': 'status:200'}, timeout=35)
                      last = {'status': response.status_code, 'prefix': response.text[:400]}
                      if response.status_code == 200:
                          records = [json.loads(line) for line in response.text.splitlines() if line.strip().startswith('{')]
                          return records, last
                  except Exception as exc:
                      last = {'error': repr(exc)}
                  time.sleep(2 + attempt * 3)
              return [], last

          def fetch_record(record):
              try:
                  offset = int(record['offset']); length = int(record['length'])
                  response = session.get(f"https://data.commoncrawl.org/{record['filename']}", headers={'Range': f'bytes={offset}-{offset+length-1}'}, timeout=70)
                  response.raise_for_status()
                  html = ''
                  for rec in ArchiveIterator(io.BytesIO(response.content)):
                      if rec.rec_type in ('response','conversion'):
                          html = rec.content_stream().read().decode('utf-8', errors='ignore')
                          break
                  return html, parse_titles(html), None
              except Exception as exc:
                  return '', [], repr(exc)

          collections = requests.get('https://index.commoncrawl.org/collinfo.json', timeout=40).json()[:32]
          report = {'collections_checked': [], 'snapshots': []}

          for collection in collections:
              cid = collection.get('id'); api = collection.get('cdx-api')
              entry = {'collection': cid, 'queries': {}, 'pages': {}, 'score': 0}
              found_missing = False
              for page in (3,6):
                  records, meta = query_index(api, page)
                  entry['queries'][str(page)] = {'meta': meta, 'record_count': len(records)}
                  valid = []
                  for record in sorted(records, key=lambda r: r.get('timestamp',''), reverse=True)[:5]:
                      html, titles, error = fetch_record(record)
                      item = {'timestamp': record.get('timestamp'), 'url': record.get('url'), 'digest': record.get('digest'), 'titles': titles, 'error': error}
                      if len(titles) == 32:
                          valid.append(item)
                          safe = str(cid).replace('/','-')
                          (OUT / f'{safe}-page-{page}-{record.get("timestamp","")}.html').write_text(html, encoding='utf-8', errors='ignore')
                  if valid:
                      entry['pages'][str(page)] = valid
                      found_missing = True
              if found_missing:
                  for page in (2,4,5,7):
                      records, meta = query_index(api, page)
                      entry['queries'][str(page)] = {'meta': meta, 'record_count': len(records)}
                      valid = []
                      for record in sorted(records, key=lambda r: r.get('timestamp',''), reverse=True)[:5]:
                          html, titles, error = fetch_record(record)
                          item = {'timestamp': record.get('timestamp'), 'url': record.get('url'), 'digest': record.get('digest'), 'titles': titles, 'error': error}
                          if len(titles) == 32:
                              item['exact_current_match'] = titles == EXPECTED[page]
                              item['positional_matches'] = sum(a == b for a,b in zip(titles, EXPECTED[page]))
                              valid.append(item)
                              entry['score'] += 100 if item['exact_current_match'] else item['positional_matches']
                      if valid:
                          entry['pages'][str(page)] = valid
                  report['snapshots'].append(entry)
              report['collections_checked'].append({'collection': cid, 'queries': entry['queries']})
              time.sleep(1)

          report['snapshots'].sort(key=lambda item: item['score'], reverse=True)
          (OUT / 'exact-commoncrawl-recovery.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          for snapshot in report['snapshots']:
              print(snapshot['collection'], 'score=', snapshot['score'], 'pages=', sorted(snapshot['pages']))
              for page in sorted(snapshot['pages']):
                  for item in snapshot['pages'][page]:
                      print(' ', page, item.get('timestamp'), len(item.get('titles',[])), item.get('exact_current_match'), item.get('positional_matches'))
          PY

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: rco-exact-commoncrawl-recovery
          path: rco-recovery-artifact/
          if-no-files-found: error
          retention-days: 1
