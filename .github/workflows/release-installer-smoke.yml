name: release-installer-smoke

on:
  push:
    paths:
      - ".github/workflows/release-installer-smoke.yml"
      - "tests/installer/release_installer_smoke.ps1"
      - "tests/test_release_installer_smoke_contract.py"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Colosseum source commit to package
        required: true
        type: string
      expected_version:
        description: Expected installed Colosseum version
        required: true
        default: "1.1.6"
        type: string

permissions:
  contents: read

concurrency:
  group: release-installer-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-installer:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      VERSION: ${{ inputs.expected_version || '1.1.6' }}
      VCPKG_TAG: "2026.07.29"
      MPV_RELEASE: "20260814"
      MPV_VERSION: "20260814-git-7b8915bc1d"
      MPV_SHA256: "0af22b28e920620036d3ae08fd9283156dc9af0420bf4df84b0e02282094599c"
      MPVQT_VERSION: "1.2.0"
      MPVQT_SHA256: "8660ad79c0d60fed77f29b36e1742841466af5405de702c81a121e6eeb625ebb"
    outputs:
      sha256: ${{ steps.fingerprint.outputs.sha256 }}
      bytes: ${{ steps.fingerprint.outputs.bytes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and locally tag trusted release source
        shell: pwsh
        run: |
          git fetch origin master --no-tags
          if ($LASTEXITCODE -ne 0) { throw "failed to fetch origin/master" }
          git cat-file -e "$env:SOURCE_SHA^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "source SHA is not a commit in this repository" }
          git merge-base --is-ancestor $env:SOURCE_SHA origin/master
          if ($LASTEXITCODE -ne 0) { throw "source SHA is not reachable from origin/master" }
          git checkout --detach $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw "failed to checkout trusted source SHA" }
          $head = git rev-parse HEAD
          if ($head -ne $env:SOURCE_SHA) { throw "source SHA drift: $head" }
          git tag -d "v$env:VERSION" 2>$null
          git tag "v$env:VERSION" $head
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.11.1"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qtwebengine qtwebchannel qtwebsockets qtpositioning qtimageformats"
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          cache: true
      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Install native dependencies
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --depth 1 --branch $env:VCPKG_TAG https://github.com/microsoft/vcpkg.git $vcpkg
          & "$vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$vcpkg/vcpkg.exe" install libtorrent:x64-windows openssl:x64-windows boost-filesystem:x64-windows boost-system:x64-windows ecm:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$vcpkg" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "$vcpkg/installed/x64-windows/bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prepare libmpv
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "mpv-dev.7z"
          $extract = Join-Path $env:RUNNER_TEMP "libmpv"
          $uri = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$env:MPV_RELEASE/mpv-dev-x86_64-$env:MPV_VERSION.7z"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:MPV_SHA256) { throw "libmpv checksum mismatch" }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          7z x $archive "-o$extract" -y | Out-Null
          $dll = Get-ChildItem $extract -Recurse -Filter "libmpv-2.dll" | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll missing" }
          $root = $dll.Directory.FullName
          $libDir = Join-Path $root "lib"
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null
          $def = Join-Path $root "mpv.def"
          @("LIBRARY libmpv-2.dll", "EXPORTS") | Set-Content $def
          dumpbin /exports $dll.FullName | ForEach-Object {
            if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(mpv_\S+)\s*$') { $Matches[1] }
          } | Sort-Object -Unique | Add-Content $def
          lib.exe "/def:$def" "/out:$libDir/mpv.lib" /machine:x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "LIBMPV_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $root | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build MpvQt
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "mpvqt.tar.xz"
          $sourceRoot = Join-Path $env:RUNNER_TEMP "mpvqt-source"
          $build = Join-Path $env:RUNNER_TEMP "mpvqt-build"
          $install = Join-Path $env:RUNNER_TEMP "mpvqt-install"
          $uri = "https://download.kde.org/stable/mpvqt/mpvqt-$env:MPVQT_VERSION.tar.xz"
          curl.exe --fail --location --retry 5 --retry-all-errors --retry-delay 2 --output $archive $uri
          if ($LASTEXITCODE -ne 0) { throw "MpvQt download failed after retries" }
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:MPVQT_SHA256) { throw "MpvQt checksum mismatch" }
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
          tar -xf $archive -C $sourceRoot
          $source = Get-ChildItem $sourceRoot -Directory -Filter "mpvqt-*" | Select-Object -First 1
          if (-not $source) { throw "MpvQt source directory missing" }
          $prefix = "$env:QT_ROOT_DIR;$env:VCPKG_ROOT/installed/x64-windows"
          cmake -S $source.FullName -B $build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_INSTALL_PREFIX=$install" "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DCMAKE_PREFIX_PATH=$prefix" "-DLibmpv_INCLUDE_DIRS=$env:LIBMPV_ROOT/include" `
            "-DLibmpv_LIBRARIES=$env:LIBMPV_ROOT/lib/mpv.lib" -DBUILD_EXAMPLES=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build --target install --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "MPVQT_ROOT=$install" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "$install/bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure and build Colosseum release
        shell: pwsh
        run: |
          $build = Join-Path $env:GITHUB_WORKSPACE "native\build-msvc"
          $prefix = "$env:QT_ROOT_DIR;$env:MPVQT_ROOT;$env:VCPKG_ROOT/installed/x64-windows"
          cmake -S native -B $build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF `
            -DCOLOSSEUM_UPDATE_TESTING=OFF `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DCMAKE_PREFIX_PATH=$prefix" "-DMPVQT_PREFIX=$env:MPVQT_ROOT" "-DLIBMPV_PREFIX=$env:LIBMPV_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build --target colosseum --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Deploy standalone runtime
        shell: pwsh
        run: |
          $build = Join-Path $env:GITHUB_WORKSPACE "native\build-msvc"
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --qmldir "$env:GITHUB_WORKSPACE\qml" "$build\colosseum.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:QT_ROOT_DIR\plugins\imageformats\qwebp.dll" "$build\imageformats\qwebp.dll" -Force
          $mpvqt = Get-ChildItem $env:MPVQT_ROOT -Recurse -Filter "MpvQt.dll" | Select-Object -First 1
          if (-not $mpvqt) { throw "MpvQt.dll missing after install" }
          Copy-Item $mpvqt.FullName $build -Force
          Copy-Item "$env:LIBMPV_ROOT\libmpv-2.dll" $build -Force
          Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows\bin" -Filter "*.dll" | Copy-Item -Destination $build -Force
      - name: Stage native media tools
        shell: pwsh
        run: |
          $build = Join-Path $env:GITHUB_WORKSPACE "native\build-msvc"
          $media = Join-Path $env:RUNNER_TEMP "ffmpeg"
          choco install ffmpeg --version=7.1.1 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ffmpeg = (Get-Command ffmpeg.exe -ErrorAction Stop).Source
          $ffprobe = (Get-Command ffprobe.exe -ErrorAction Stop).Source
          New-Item -ItemType Directory -Force -Path (Join-Path $media "bin") | Out-Null
          Copy-Item $ffmpeg (Join-Path $media "bin\ffmpeg.exe") -Force
          Copy-Item $ffprobe (Join-Path $media "bin\ffprobe.exe") -Force
          Get-ChildItem (Split-Path $ffmpeg) -Filter "*.dll" | Copy-Item -Destination (Join-Path $media "bin") -Force
          "MEDIA_TOOLS_DIR=$(Join-Path $media 'bin')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (!(Test-Path $makensis)) { throw "makensis missing after install" }
      - name: Package canonical 1.1.6 installer
        shell: bash
        run: |
          set -euo pipefail
          export BUILD_DIR="$(cygpath -u "$GITHUB_WORKSPACE")/native/build-msvc"
          bash scripts/installer/package_release.sh "$VERSION"
      - name: Fingerprint canonical installer
        id: fingerprint
        shell: pwsh
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE "dist\Colosseum-$env:VERSION-setup.exe"
          if (!(Test-Path $installer)) { throw "packaged installer missing" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $installer).Length
          if ($bytes -gt 300MB) { throw "installer exceeds 300 MiB: $bytes" }
          "sha256=$hash" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "bytes=$bytes" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "CANONICAL_INSTALLER SHA256=$hash BYTES=$bytes"
      - name: Upload canonical installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Colosseum-${{ env.VERSION }}-setup
          path: dist/Colosseum-${{ env.VERSION }}-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  fresh-windows-install:
    needs: build-installer
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.expected_version || '1.1.6' }}
    steps:
      - uses: actions/checkout@v7
      - name: Download canonical installer artifact
        uses: actions/download-artifact@v4
        with:
          name: Colosseum-${{ env.VERSION }}-setup
          path: ${{ runner.temp }}/release-installer
      - name: Fresh install, boot, runtime, and uninstall smoke
        shell: pwsh
        run: |
          $installer = Get-ChildItem "$env:RUNNER_TEMP\release-installer" -Filter "Colosseum-$env:VERSION-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "canonical installer artifact missing" }
          & .\tests\installer\release_installer_smoke.ps1 `
            -Installer $installer.FullName `
            -ExpectedSha256 "${{ needs.build-installer.outputs.sha256 }}" `
            -ExpectedVersion $env:VERSION
