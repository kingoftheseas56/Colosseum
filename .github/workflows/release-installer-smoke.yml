name: Windows staging installer diagnostic replay

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: release-installer-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Restore the producer's pinned Qt 6.11.1 environment
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '6.11.1'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtwebsockets qtpositioning qtimageformats qtquick3d qtquicktimeline qtshadertools'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'
          cache: true
      - name: Receive retained Windows installers
        uses: actions/download-artifact@v4
        with:
          name: Windows-staging-only-installer-pair
          run-id: 45900608282
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/colosseum-update-diagnostic/fixtures
      - name: Receive retained signed manifest and package identities
        uses: actions/download-artifact@v4
        with:
          name: Windows-staging-rehearsal-evidence
          run-id: 45900608282
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/colosseum-update-diagnostic/received-evidence
      - name: Replay exact Windows installers with diagnostics
        shell: pwsh
        timeout-minutes: 12
        run: |
          python tests/installer/windows_update_diagnose.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve raw Windows installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-installer-diagnostic-evidence
          path: ${{ runner.temp }}/colosseum-update-diagnostic/diagnostic-evidence/
          retention-days: 14
          if-no-files-found: warn
