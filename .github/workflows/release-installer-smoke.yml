name: Windows retained staged 1.5.1 same-version check

on:
  workflow_dispatch:
    inputs:
      fixture_sha:
        description: Exact staged 1.5.1 installer digest
        required: true
        type: string
      executable_sha:
        description: Exact staged 1.5.1 installed executable digest
        required: true
        type: string
      manifest_sha:
        description: Exact retained manifest digest
        required: true
        type: string
      signature_sha:
        description: Exact retained signature digest
        required: true
        type: string
      public_key_sha:
        description: Exact retained public DER digest
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: windows-retained-same-version-45911333361
  cancel-in-progress: false

jobs:
  receive-same-version:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      SOURCE_SHA: 0f6c3c9c2d799b1ac2889806a238fa6bea3a41ce
      PRODUCER_RUN: '45911333361'
      PRODUCTION_INSTALLER_SHA: 852d4f20a763fa9afc76f93b1240c3351534723db35f457633e776d54399608e
      TARGET_INSTALLER_SHA: ${{ inputs.fixture_sha }}
      TARGET_EXE_SHA: ${{ inputs.executable_sha }}
      MANIFEST_SHA: ${{ inputs.manifest_sha }}
      SIGNATURE_SHA: ${{ inputs.signature_sha }}
      PUBLIC_KEY_SHA: ${{ inputs.public_key_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Restore the producer's pinned Qt 6.11.1 environment
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '6.11.1'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtwebsockets qtpositioning qtimageformats qtquick3d qtquicktimeline qtshadertools'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'
          cache: true
      - name: Receive exact retained fixture artifact
        uses: actions/download-artifact@v4
        with:
          name: Windows-staging-only-installer-pair
          run-id: ${{ env.PRODUCER_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/colosseum-same-version-receiving/fixtures
      - name: Receive exact originally signed feed
        uses: actions/download-artifact@v4
        with:
          name: Windows-staging-rehearsal-evidence
          run-id: ${{ env.PRODUCER_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/colosseum-same-version-receiving/received-evidence
      - name: Exercise fresh signed Check again on installed exact 1.5.1
        shell: pwsh
        timeout-minutes: 9
        run: |
          python tests/installer/windows_update_same_version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve installed identity, signed requests, and UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-same-version-receiving-evidence
          path: ${{ runner.temp }}/colosseum-same-version-receiving/evidence/
          retention-days: 14
          if-no-files-found: warn
