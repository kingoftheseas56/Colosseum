name: Staging-only Windows update replay

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: release-installer-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Receive exact retained Windows fixtures
        uses: actions/download-artifact@v4
        with:
          name: Windows-staging-only-installer-pair
          run-id: 45887841731
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/colosseum-update-rehearsal/fixtures
      - name: Receive retained signed fixture metadata
        uses: actions/download-artifact@v4
        with:
          name: Windows-staging-rehearsal-evidence
          run-id: 45887841731
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/colosseum-update-rehearsal/received-evidence
      - name: Replay installed Windows update with temporary runner user trust
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Disposable hosted runner required'
          }
          $driver = 'tests/installer/windows_update_rehearsal.py'
          python $driver prepare-tls
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $caPath = Join-Path $env:RUNNER_TEMP 'colosseum-update-rehearsal/keys/ca.cer'
          $ca = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($caPath)
          $store = [System.Security.Cryptography.X509Certificates.X509Store]::new('Root', 'CurrentUser')
          $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
          $created = $false
          try {
            $selector = [System.Security.Cryptography.X509Certificates.X509FindType]::FindByThumbprint
            if ($store.Certificates.Find($selector, $ca.Thumbprint, $false).Count -ne 0) {
              throw 'Unexpected existing CA thumbprint on runner'
            }
            $created = $true
            $store.Add($ca)
            if ($store.Certificates.Find($selector, $ca.Thumbprint, $false).Count -ne 1) {
              throw 'Could not establish the temporary CurrentUser Root fixture certificate'
            }
            Write-Host "Temporary runner CurrentUser Root certificate $($ca.Thumbprint)"
            python $driver verify
            if ($LASTEXITCODE -ne 0) { throw "Windows replay failed with exit code $LASTEXITCODE" }
          } finally {
            try {
              if ($created) {
                foreach ($added in $store.Certificates.Find($selector, $ca.Thumbprint, $false)) {
                  $store.Remove($added)
                }
                if ($store.Certificates.Find($selector, $ca.Thumbprint, $false).Count -ne 0) {
                  throw 'Temporary runner CA remained in CurrentUser Root'
                }
                Write-Host "Removed runner CurrentUser Root certificate $($ca.Thumbprint)"
              }
            } finally {
              $store.Close()
            }
          }
      - name: Preserve replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-staging-replay-evidence
          path: ${{ runner.temp }}/colosseum-update-rehearsal/evidence/
          retention-days: 7
          if-no-files-found: warn
