name: build-qtwebengine-codecs

# Builds Qt WebEngine 6.11.1 FROM SOURCE with proprietary codecs.
# H.264/AAC support is compiled in, and Chromium is built Widevine-capable;
# Google's Widevine CDM itself is NOT bundled. Produces a downloadable artifact:
# the codec-enabled
# Qt6WebEngineCore/Quick DLLs + resources + cmake package, to drop into a
# Colosseum Qt install for the Streaming (OTT) runtime.
#
# Manual-only: this is a multi-hour job, never run it on push.
# Standard GitHub-hosted Windows jobs are capped at 360 minutes. This workflow
# therefore supports a resumable compiler-cache build:
#   seed   - compile for up to 320 minutes and continuously populate sccache/GHA.
#   finish - rebuild from a fresh VM, consume compiler-cache results, then package.
#   resume - restore a timed-out build-tree artifact from an earlier run at the
#            exact build path, verify it, and continue Ninja incrementally.
# A timed-out finish/resume uploads a downloadable build-tree checkpoint before
# the hosted runner is destroyed, while sccache continues to preserve compiler results.
# Keep SCCACHE_GHA_VERSION unchanged between phases and run resume from the same
# branch so GitHub's branch-scoped sccache entries remain eligible.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (windows-2025, or a larger self-hosted/paid label)"
        required: true
        default: "windows-2025"
      qt_version:
        description: "Qt version to build WebEngine for"
        required: true
        default: "6.11.1"
      phase:
        description: "seed = warm cache; finish = rebuild from cache; resume = restore a timeout build tree"
        required: true
        type: choice
        options:
          - seed
          - finish
          - resume
        default: seed
      resume_run_id:
        description: "Workflow run ID that owns the timeout build-tree artifact (required for resume)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  build-webengine:
    runs-on: ${{ github.event.inputs.runner }}
    timeout-minutes: 360   # platform maximum for a hosted job
    env:
      QT_VERSION: ${{ github.event.inputs.qt_version }}
      # Native sccache GHA storage writes compiler results during the run, so
      # completed compilations survive even when the disposable runner goes away.
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_GHA_VERSION: "qtwebengine-${{ github.event.inputs.qt_version }}-msvc2022_64-codecs-v1"
      # Resume consumes the already-warm #19/#20 cache without churning GitHub's
      # ~10 GB repository cache ceiling. Seed/finish remain read-write.
      SCCACHE_GHA_RW_MODE: "${{ github.event.inputs.phase == 'resume' && 'READ_ONLY' || 'READ_WRITE' }}"

    steps:
      - name: Checkout (workflow host only)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set build paths (RUNNER_TEMP is on the larger D drive)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false  # native stderr must not abort the step
          "WEBENGINE_SRC_DIR=$env:RUNNER_TEMP\qtwebengine-src"         | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WEBENGINE_BUILD_DIR=$env:RUNNER_TEMP\qtwebengine-build"     | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WEBENGINE_INSTALL_DIR=$env:RUNNER_TEMP\qtwebengine-install" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GPERF_DIR=$env:RUNNER_TEMP\gperf"                           | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Reclaim disk (Chromium build needs the space)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false  # native stderr must not abort the step
          foreach ($d in @("C:\Android","C:\Program Files (x86)\Android","C:\Miniconda","C:\hostedtoolcache\CodeQL")) {
            if (Test-Path $d) { Write-Output "removing $d"; Remove-Item -Recurse -Force $d -ErrorAction SilentlyContinue }
          }
          Get-PSDrive C,D | Select-Object Name,@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-Table -AutoSize

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Qt ${{ env.QT_VERSION }} (base + WebEngine build deps)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # WebEngine's build-time module dependencies (NOT the prebuilt webengine).
          modules: "qtwebchannel qtwebsockets qtpositioning"
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          cache: true

      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Qt WebEngine Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false  # pip can report progress on stderr
          python -m pip install --disable-pip-version-check --no-warn-script-location "html5lib==1.1" "spdx-tools==0.8.5"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import importlib.metadata as m; import html5lib; import spdx_tools.spdx.clitools.pyspdxtools as pyspdxtools; print('html5lib', html5lib.__version__); print('spdx-tools', m.version('spdx-tools')); print('pyspdxtools import OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Chromium host tools (gperf, flex, bison)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false  # choco writes its nuspec-license warning to stderr; must not abort the step
          # All three host tools land in ONE dedicated, self-contained directory
          # (GPERF_DIR) added to PATH. NEVER add msys64\usr\bin or any MSYS/Cygwin
          # bin dir to PATH: GITHUB_PATH entries are PREPENDED for later steps (not
          # appended), so MSYS's GNU tar silently shadowed Windows' bsdtar and broke
          # the next step -- MSYS tar parses "D:\..." as a remote-host target and
          # fails with "Cannot connect to D:". Isolation avoids that class entirely.
          New-Item -ItemType Directory -Force -Path $env:GPERF_DIR | Out-Null

          # flex + bison via winflexbison. Chromium invokes them as `flex`/`bison`,
          # so alias win_flex/win_bison to those names; copy the whole tools dir so
          # bison finds its data\ skeletons next to the exe.
          choco install --no-progress -y winflexbison3
          if ($LASTEXITCODE -ne 0) { throw "winflexbison3 install failed" }
          $wfb = "C:\ProgramData\chocolatey\lib\winflexbison3\tools"
          Copy-Item "$wfb\*" $env:GPERF_DIR -Recurse -Force
          Copy-Item (Join-Path $env:GPERF_DIR "win_flex.exe")  (Join-Path $env:GPERF_DIR "flex.exe")  -Force
          Copy-Item (Join-Path $env:GPERF_DIR "win_bison.exe") (Join-Path $env:GPERF_DIR "bison.exe") -Force

          # gperf: use the approved Chocolatey package, which carries a bundled
          # Windows x64 binary. This avoids SourceForge mirror responses that can
          # be HTML error pages with HTTP 200 on hosted runners.
          function Test-ExeRuns($exe) {
            try { & $exe --version *>$null; return ($LASTEXITCODE -eq 0) } catch { return $false }
          }
          choco install --no-progress -y gperf
          if ($LASTEXITCODE -ne 0) { throw "gperf install failed" }
          $gperfRoot = "C:\ProgramData\chocolatey\lib\gperf\tools"
          $gperfFile = Get-ChildItem $gperfRoot -Recurse -File -Filter "gperf.exe" | Select-Object -First 1
          if (-not $gperfFile) { throw "gperf.exe missing from Chocolatey package" }
          Get-ChildItem $gperfFile.DirectoryName -File | Copy-Item -Destination $env:GPERF_DIR -Force
          $gperfExe = Join-Path $env:GPERF_DIR "gperf.exe"
          if (-not (Test-ExeRuns $gperfExe)) { throw "gperf.exe did not run from the Chocolatey package" }

          $env:GPERF_DIR | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          & $gperfExe --version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw "gperf.exe --version failed (exit $LASTEXITCODE)" }
          & (Join-Path $env:GPERF_DIR "bison.exe") --version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw "bison.exe --version failed (exit $LASTEXITCODE)" }
          & (Join-Path $env:GPERF_DIR "flex.exe")  --version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw "flex.exe --version failed (exit $LASTEXITCODE)" }

      - name: Install sccache (persistent compiler cache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.18.0"

      - name: Verify warm resume cache inventory
        if: github.event.inputs.phase == 'resume'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ref = "refs/heads/$env:GITHUB_REF_NAME"
          $cacheInventory = gh api --method GET "repos/$env:GITHUB_REPOSITORY/actions/caches" -f ref="$ref" -f per_page=1 | ConvertFrom-Json
          $cacheUsage = gh api "repos/$env:GITHUB_REPOSITORY/actions/cache/usage" | ConvertFrom-Json
          Write-Output "resume cache ref: $ref"
          Write-Output "resume cache entries: $($cacheInventory.total_count)"
          Write-Output "repository cache bytes: $($cacheUsage.active_caches_size_in_bytes)"
          Write-Output "repository cache entries: $($cacheUsage.active_caches_count)"
          Write-Output "sccache mode: $env:SCCACHE_GHA_RW_MODE"
          Write-Output "sccache namespace: $env:SCCACHE_GHA_VERSION"
          if ($env:SCCACHE_GHA_RW_MODE -ne 'READ_ONLY') {
            throw "resume must use read-only GHA sccache to prevent cache churn"
          }
          if ([int64]$cacheInventory.total_count -lt 1000) {
            throw "warm branch sccache inventory is unexpectedly small; refusing to burn the resume runner"
          }

      - name: Verify toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false  # native stderr must not abort the step
          cmake --version
          ninja --version
          python --version
          gperf --version 2>&1 | Select-Object -First 1
          cl 2>&1 | Select-Object -First 1
          sccache --version
          Write-Output "cores: $env:NUMBER_OF_PROCESSORS"
          Write-Output "phase: ${{ github.event.inputs.phase }}"
          Write-Output "sccache namespace: $env:SCCACHE_GHA_VERSION"

      - name: Download Qt WebEngine ${{ env.QT_VERSION }} source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false  # native stderr must not abort the step
          $v = $env:QT_VERSION
          $mm = ($v -split '\.')[0..1] -join '.'
          $tar = Join-Path $env:RUNNER_TEMP "qtwebengine-src.tar.xz"
          $uri = "https://download.qt.io/archive/qt/$mm/$v/submodules/qtwebengine-everywhere-src-$v.tar.xz"
          Write-Output "fetching $uri"
          Invoke-WebRequest -Uri $uri -OutFile $tar -MaximumRetryCount 5 -RetryIntervalSec 15
          New-Item -ItemType Directory -Force -Path $env:WEBENGINE_SRC_DIR | Out-Null
          tar -xf $tar -C $env:WEBENGINE_SRC_DIR
          $inner = Get-ChildItem $env:WEBENGINE_SRC_DIR -Directory -Filter "qtwebengine-everywhere-src-*" | Select-Object -First 1
          if (-not $inner) { throw "qtwebengine source dir missing after extract" }
          "WEBENGINE_SRC=$($inner.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore timeout build tree
        if: github.event.inputs.phase == 'resume'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.inputs.resume_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: qtwebengine-${{ env.QT_VERSION }}-timeout-build-run-*
          path: ${{ env.WEBENGINE_BUILD_DIR }}
          merge-multiple: true

      - name: Verify restored build tree
        if: github.event.inputs.phase == 'resume'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not '${{ github.event.inputs.resume_run_id }}') {
            throw 'resume_run_id is required when phase=resume'
          }
          $ninja = Join-Path $env:WEBENGINE_BUILD_DIR 'build.ninja'
          $cache = Join-Path $env:WEBENGINE_BUILD_DIR 'CMakeCache.txt'
          if (-not (Test-Path -LiteralPath $ninja -PathType Leaf)) {
            throw "restored checkpoint is missing build.ninja: $ninja"
          }
          if (-not (Test-Path -LiteralPath $cache -PathType Leaf)) {
            throw "restored checkpoint is missing CMakeCache.txt: $cache"
          }
          $toolchains = @(Get-ChildItem $env:WEBENGINE_BUILD_DIR -Recurse -Filter 'toolchain.ninja' -File -ErrorAction Stop)
          $objects = @(Get-ChildItem $env:WEBENGINE_BUILD_DIR -Recurse -Filter '*.obj' -File -ErrorAction SilentlyContinue)
          if (-not $toolchains) { throw 'restored checkpoint contains no Chromium toolchain.ninja' }
          if (-not $objects) { throw 'restored checkpoint contains no compiled .obj files' }
          Write-Output "restored checkpoint: $($objects.Count) object files; $($toolchains.Count) Chromium toolchain file(s)"
          Select-String -Path $cache -Pattern '^CMAKE_HOME_DIRECTORY:INTERNAL=' | ForEach-Object { Write-Output $_.Line }
          Select-String -Path $cache -Pattern '^CMAKE_INSTALL_PREFIX:PATH=' | ForEach-Object { Write-Output $_.Line }
          Get-PSDrive C,D | Select-Object Name,@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-Table -AutoSize

      - name: Configure WebEngine module (proprietary codecs, Release)
        if: github.event.inputs.phase != 'resume'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false  # gn/python/cmake write routine progress to stderr; must not abort the step
          # Mirrors the local configure-webengine.cmd but as a stripped Release
          # build, far smaller/faster/lighter than the local RelWithDebInfo attempt.
          # qt-configure-module accepts module switches before `--`; the build type
          # must be passed as a CMake definition after `--`.
          # Proprietary codecs + Chrome ffmpeg branding bring H.264/AAC; Widevine
          # stays on by default.
          & "$env:QT_ROOT_DIR\bin\qt-configure-module.bat" $env:WEBENGINE_SRC `
            -cmake-generator Ninja `
            -webengine-proprietary-codecs `
            -no-webengine-printing-and-pdf `
            -no-webengine-spellchecker `
            -no-webengine-webrtc `
            -no-build-qtpdf `
            -- `
            -B "$env:WEBENGINE_BUILD_DIR" `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_INSTALL_PREFIX=$env:WEBENGINE_INSTALL_DIR" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DFEATURE_qtwebengine_widgets_build=OFF `
            -DFEATURE_webengine_geolocation=OFF `
            -DFEATURE_webengine_kerberos=OFF `
            -DFEATURE_webengine_extensions=OFF `
            -DFEATURE_webenginedriver=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $env:WEBENGINE_BUILD_DIR -PathType Container)) {
            throw "Qt module configure did not create build directory: $env:WEBENGINE_BUILD_DIR"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $env:WEBENGINE_BUILD_DIR "build.ninja") -PathType Leaf)) {
            Get-ChildItem -LiteralPath $env:WEBENGINE_BUILD_DIR -Force | Format-Table -AutoSize | Out-String | Write-Output
            throw "Qt module configure did not create the expected single-config Ninja file: $env:WEBENGINE_BUILD_DIR\build.ninja"
          }

      - name: Generate Chromium Ninja files
        if: github.event.inputs.phase != 'resume'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $jobs = [int]$env:NUMBER_OF_PROCESSORS
          Write-Output "Running Qt's GN-only target before the expensive Chromium compile."
          cmake --build "$env:WEBENGINE_BUILD_DIR" --target run_core_GnDone --parallel $jobs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $generatedToolchains = Get-ChildItem $env:WEBENGINE_BUILD_DIR -Recurse -Filter 'toolchain.ninja' -File
          if (-not $generatedToolchains) {
            throw 'run_core_GnDone completed but generated no Chromium toolchain.ninja files.'
          }
          Write-Output "Generated $($generatedToolchains.Count) Chromium toolchain file(s)."

      - name: Verify Chromium compiler cache wiring
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $argsHit = Get-ChildItem $env:WEBENGINE_BUILD_DIR -Recurse -Filter 'args.gn' -File |
            Select-String -SimpleMatch 'cc_wrapper="sccache"' |
            Select-Object -First 1
          if (-not $argsHit) {
            throw 'Qt did not propagate the compiler launcher into Chromium args.gn as cc_wrapper="sccache".'
          }
          Write-Output "GN wrapper: $($argsHit.Path):$($argsHit.LineNumber): $($argsHit.Line)"
          $toolchains = Get-ChildItem $env:WEBENGINE_BUILD_DIR -Recurse -Filter 'toolchain.ninja' -File
          $hit = $toolchains |
            Select-String -Pattern 'sccache' |
            Where-Object { $_.Line -match 'cl\.exe' } |
            Select-Object -First 1
          if (-not $hit) {
            Write-Output 'No generated compile command contained both sccache and cl.exe. Dumping cache-related GN evidence:'
            Get-ChildItem $env:WEBENGINE_BUILD_DIR -Recurse -Filter 'args.gn' -File |
              Select-String -Pattern 'cc_wrapper|sccache' |
              Select-Object -First 20 |
              ForEach-Object { Write-Output "$($_.Path):$($_.LineNumber): $($_.Line)" }
            $toolchains |
              Select-String -Pattern 'command =|sccache|cl\.exe' |
              Select-Object -First 40 |
              ForEach-Object { Write-Output "$($_.Path):$($_.LineNumber): $($_.Line)" }
            throw 'Chromium GN toolchain is not invoking sccache before cl.exe; refusing to burn a multi-hour runner.'
          }
          Write-Output "cache wiring: $($hit.Path):$($hit.LineNumber)"
          Write-Output $hit.Line
          sccache --zero-stats
      - name: Build WebEngine (${{ github.event.inputs.phase }})
        id: webengine_build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $phase = '${{ github.event.inputs.phase }}'
          $budgetMinutes = if ($phase -eq 'seed') { 320 } else { 300 }
          $jobs = [int]$env:NUMBER_OF_PROCESSORS
          $stdoutLog = Join-Path $env:RUNNER_TEMP 'webengine-build.stdout.log'
          $stderrLog = Join-Path $env:RUNNER_TEMP 'webengine-build.stderr.log'

          Write-Output "phase=$phase; building with -j$jobs; controlled budget=$($budgetMinutes)m"
          if ($phase -eq 'finish' -or $phase -eq 'resume') {
            Write-Output "$phase reserves roughly 45 minutes of the hosted-job window for checkpoint upload and normal packaging."
          }
          Write-Output 'Completed compiler results are written continuously to the sccache GHA backend.'

          $proc = Start-Process -FilePath 'cmake.exe' -ArgumentList @('--build', $env:WEBENGINE_BUILD_DIR, '--parallel', "$jobs") -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog -PassThru
          $deadline = (Get-Date).AddMinutes($budgetMinutes)
          $nextReport = Get-Date

          while (-not $proc.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 15
            $proc.Refresh()
            if ((Get-Date) -ge $nextReport) {
              Write-Output "---- build heartbeat $(Get-Date -Format o) ----"
              if (Test-Path $stdoutLog) { Get-Content $stdoutLog -Tail 3 }
              if (Test-Path $stderrLog) { Get-Content $stderrLog -Tail 3 }
              $nextReport = (Get-Date).AddMinutes(5)
            }
          }

          $proc.Refresh()
          if (-not $proc.HasExited) {
            Write-Output "::warning::Build phase '$phase' reached its $budgetMinutes-minute budget; stopping the process tree before GitHub's six-hour job guillotine."
            & taskkill.exe /PID $proc.Id /T /F | Out-Null
            Start-Sleep -Seconds 3
            'completed=false' | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            'budget_exhausted=true' | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

            if ($phase -eq 'seed') {
              Write-Output 'Seed phase complete: compiler cache has been warmed. Re-run this workflow with phase=finish.'
              exit 0
            }

            Write-Output "::error::$phase phase exhausted its build budget. Re-run phase=resume against this run's timeout build-tree artifact."
            exit 124
          }

          $proc.WaitForExit()
          $rc = $proc.ExitCode
          'budget_exhausted=false' | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if (Test-Path $stdoutLog) { Get-Content $stdoutLog -Tail 20 }
          if (Test-Path $stderrLog) { Get-Content $stderrLog -Tail 20 }

          if ($rc -ne 0) {
            $patterns = 'FAILED:|fatal error|\berror\b|LNK\d+|No such'
            Select-String -Path @($stdoutLog, $stderrLog) -Pattern $patterns -ErrorAction SilentlyContinue | Select-Object -Last 40 | ForEach-Object {
              $m = $_.Line.Replace('%','%25')
              Write-Output "::error::$m"
            }
            'completed=false' | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit $rc
          }

          'completed=true' | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "WebEngine build completed inside the $phase phase."
          Get-PSDrive C,D | Select-Object Name,@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-Table -AutoSize

      - name: Report sccache stats
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $cmd = Get-Command sccache -ErrorAction SilentlyContinue
          if (-not $cmd) {
            Write-Output 'sccache is unavailable; no stats to report.'
            exit 0
          }
          $stats = (sccache --show-stats 2>&1 | Out-String).TrimEnd()
          Write-Output $stats
          '### QtWebEngine sccache stats' | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          '```text' | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $stats | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - name: Prepare timeout checkpoint metadata
        if: always() && steps.webengine_build.outputs.budget_exhausted == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $checkpointMeta = Join-Path $env:RUNNER_TEMP 'qtwebengine-timeout-checkpoint-meta'
          New-Item -ItemType Directory -Force -Path $checkpointMeta | Out-Null

          $stdoutLog = Join-Path $env:RUNNER_TEMP 'webengine-build.stdout.log'
          $stderrLog = Join-Path $env:RUNNER_TEMP 'webengine-build.stderr.log'
          if (Test-Path $stdoutLog) { Copy-Item $stdoutLog (Join-Path $checkpointMeta 'webengine-build.stdout.log') -Force }
          if (Test-Path $stderrLog) { Copy-Item $stderrLog (Join-Path $checkpointMeta 'webengine-build.stderr.log') -Force }

          @(
            "run_id=$env:GITHUB_RUN_ID"
            "run_number=$env:GITHUB_RUN_NUMBER"
            "qt_version=$env:QT_VERSION"
            "build_dir=$env:WEBENGINE_BUILD_DIR"
            "source_dir=$env:WEBENGINE_SRC"
            "sccache_namespace=$env:SCCACHE_GHA_VERSION"
            "checkpoint_reason=controlled_build_budget_exhausted"
            "created=$(Get-Date -Format o)"
          ) | Out-File (Join-Path $checkpointMeta 'checkpoint.txt') -Encoding utf8

          if (Test-Path $stdoutLog) {
            Get-Content $stdoutLog -Tail 200 | Out-File (Join-Path $checkpointMeta 'last-build-output.txt') -Encoding utf8
          }
          $argsFiles = Get-ChildItem $env:WEBENGINE_BUILD_DIR -Recurse -Filter 'args.gn' -File -ErrorAction SilentlyContinue
          foreach ($f in $argsFiles) {
            "### $($f.FullName)" | Out-File (Join-Path $checkpointMeta 'args-gn.txt') -Encoding utf8 -Append
            Get-Content $f.FullName | Out-File (Join-Path $checkpointMeta 'args-gn.txt') -Encoding utf8 -Append
          }
          sccache --show-stats 2>&1 | Out-File (Join-Path $checkpointMeta 'sccache-stats.txt') -Encoding utf8

      - name: Upload timeout checkpoint metadata
        if: always() && steps.webengine_build.outputs.budget_exhausted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qtwebengine-${{ env.QT_VERSION }}-timeout-metadata-run-${{ github.run_number }}
          path: ${{ runner.temp }}/qtwebengine-timeout-checkpoint-meta
          retention-days: 7
          if-no-files-found: error
          compression-level: 1

      - name: Upload timeout build tree
        if: always() && steps.webengine_build.outputs.budget_exhausted == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qtwebengine-${{ env.QT_VERSION }}-timeout-build-run-${{ github.run_number }}
          path: ${{ env.WEBENGINE_BUILD_DIR }}
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true

      - name: Install WebEngine module
        if: steps.webengine_build.outputs.completed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false  # native stderr must not abort the step
          cmake --install "$env:WEBENGINE_BUILD_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $core = Get-ChildItem $env:WEBENGINE_INSTALL_DIR -Recurse -Filter "Qt6WebEngineCore.dll" | Select-Object -First 1
          if (-not $core) { throw "Qt6WebEngineCore.dll missing from install prefix" }
          Write-Output "installed: $($core.FullName)"

      - name: Package artifact
        if: steps.webengine_build.outputs.completed == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false  # native stderr must not abort the step
          $zip = Join-Path $env:RUNNER_TEMP "qtwebengine-$($env:QT_VERSION)-msvc2022_64-codecs.zip"
          Compress-Archive -Path (Join-Path $env:WEBENGINE_INSTALL_DIR '*') -DestinationPath $zip -Force
          "ARTIFACT_ZIP=$zip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "{0:N1} MB" -f ((Get-Item $zip).Length/1MB)

      - name: Upload codec-enabled WebEngine
        if: steps.webengine_build.outputs.completed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qtwebengine-${{ env.QT_VERSION }}-msvc2022_64-codecs
          path: ${{ env.ARTIFACT_ZIP }}
          retention-days: 14
          if-no-files-found: error
