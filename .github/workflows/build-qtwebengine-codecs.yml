name: build-qtwebengine-codecs

# Builds Qt WebEngine 6.11.1 FROM SOURCE with proprietary codecs
# (H.264 / AAC / Widevine) enabled -- the capability the stock Qt binaries
# ship DISABLED. Produces a downloadable artifact: the codec-enabled
# Qt6WebEngineCore/Quick DLLs + resources + cmake package, to drop into a
# Colosseum Qt install for the Streaming (OTT) runtime.
#
# Manual-only: this is a multi-hour job, never run it on push.
# NOTE: GitHub-hosted runners cap a job at 360 min (6h) -- that is the max.
# A standard 4-core windows-2025 runner may not finish in time; if it times
# out, re-run with a larger runner via the `runner` input.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (windows-2025, or a larger self-hosted/paid label)"
        required: true
        default: "windows-2025"
      qt_version:
        description: "Qt version to build WebEngine for"
        required: true
        default: "6.11.1"

permissions:
  contents: read

jobs:
  build-webengine:
    runs-on: ${{ github.event.inputs.runner }}
    timeout-minutes: 360   # platform maximum for a hosted job
    env:
      QT_VERSION: ${{ github.event.inputs.qt_version }}

    steps:
      - name: Checkout (workflow host only)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set build paths (RUNNER_TEMP is on the larger D drive)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false  # native stderr must not abort the step
          "WEBENGINE_SRC_DIR=$env:RUNNER_TEMP\qtwebengine-src"         | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WEBENGINE_BUILD_DIR=$env:RUNNER_TEMP\qtwebengine-build"     | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WEBENGINE_INSTALL_DIR=$env:RUNNER_TEMP\qtwebengine-install" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "GPERF_DIR=$env:RUNNER_TEMP\gperf"                           | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Reclaim disk (Chromium build needs the space)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false  # native stderr must not abort the step
          foreach ($d in @("C:\Android","C:\Program Files (x86)\Android","C:\Miniconda","C:\hostedtoolcache\CodeQL")) {
            if (Test-Path $d) { Write-Output "removing $d"; Remove-Item -Recurse -Force $d -ErrorAction SilentlyContinue }
          }
          Get-PSDrive C,D | Select-Object Name,@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-Table -AutoSize

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Qt ${{ env.QT_VERSION }} (base + WebEngine build deps)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # WebEngine's build-time module dependencies (NOT the prebuilt webengine).
          modules: "qtwebchannel qtwebsockets qtpositioning"
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          cache: true

      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Qt WebEngine Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false  # pip can report progress on stderr
          python -m pip install --disable-pip-version-check --no-warn-script-location "html5lib==1.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import html5lib; print('html5lib', html5lib.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Chromium host tools (gperf, flex, bison)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false  # choco writes its nuspec-license warning to stderr; must not abort the step
          # All three host tools land in ONE dedicated, self-contained directory
          # (GPERF_DIR) added to PATH. NEVER add msys64\usr\bin or any MSYS/Cygwin
          # bin dir to PATH: GITHUB_PATH entries are PREPENDED for later steps (not
          # appended), so MSYS's GNU tar silently shadowed Windows' bsdtar and broke
          # the next step -- MSYS tar parses "D:\..." as a remote-host target and
          # fails with "Cannot connect to D:". Isolation avoids that class entirely.
          New-Item -ItemType Directory -Force -Path $env:GPERF_DIR | Out-Null

          # flex + bison via winflexbison. Chromium invokes them as `flex`/`bison`,
          # so alias win_flex/win_bison to those names; copy the whole tools dir so
          # bison finds its data\ skeletons next to the exe.
          choco install --no-progress -y winflexbison3
          if ($LASTEXITCODE -ne 0) { throw "winflexbison3 install failed" }
          $wfb = "C:\ProgramData\chocolatey\lib\winflexbison3\tools"
          Copy-Item "$wfb\*" $env:GPERF_DIR -Recurse -Force
          Copy-Item (Join-Path $env:GPERF_DIR "win_flex.exe")  (Join-Path $env:GPERF_DIR "flex.exe")  -Force
          Copy-Item (Join-Path $env:GPERF_DIR "win_bison.exe") (Join-Path $env:GPERF_DIR "bison.exe") -Force

          # gperf: use the approved Chocolatey package, which carries a bundled
          # Windows x64 binary. This avoids SourceForge mirror responses that can
          # be HTML error pages with HTTP 200 on hosted runners.
          function Test-ExeRuns($exe) {
            try { & $exe --version *>$null; return ($LASTEXITCODE -eq 0) } catch { return $false }
          }
          choco install --no-progress -y gperf
          if ($LASTEXITCODE -ne 0) { throw "gperf install failed" }
          $gperfRoot = "C:\ProgramData\chocolatey\lib\gperf\tools"
          $gperfFile = Get-ChildItem $gperfRoot -Recurse -File -Filter "gperf.exe" | Select-Object -First 1
          if (-not $gperfFile) { throw "gperf.exe missing from Chocolatey package" }
          Get-ChildItem $gperfFile.DirectoryName -File | Copy-Item -Destination $env:GPERF_DIR -Force
          $gperfExe = Join-Path $env:GPERF_DIR "gperf.exe"
          if (-not (Test-ExeRuns $gperfExe)) { throw "gperf.exe did not run from the Chocolatey package" }

          $env:GPERF_DIR | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          & $gperfExe --version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw "gperf.exe --version failed (exit $LASTEXITCODE)" }
          & (Join-Path $env:GPERF_DIR "bison.exe") --version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw "bison.exe --version failed (exit $LASTEXITCODE)" }
          & (Join-Path $env:GPERF_DIR "flex.exe")  --version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw "flex.exe --version failed (exit $LASTEXITCODE)" }

      - name: Verify toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false  # native stderr must not abort the step
          cmake --version
          ninja --version
          python --version
          gperf --version 2>&1 | Select-Object -First 1
          cl 2>&1 | Select-Object -First 1
          Write-Output "cores: $env:NUMBER_OF_PROCESSORS"

      - name: Download Qt WebEngine ${{ env.QT_VERSION }} source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false  # native stderr must not abort the step
          $v = $env:QT_VERSION
          $mm = ($v -split '\.')[0..1] -join '.'
          $tar = Join-Path $env:RUNNER_TEMP "qtwebengine-src.tar.xz"
          $uri = "https://download.qt.io/archive/qt/$mm/$v/submodules/qtwebengine-everywhere-src-$v.tar.xz"
          Write-Output "fetching $uri"
          Invoke-WebRequest -Uri $uri -OutFile $tar -MaximumRetryCount 5 -RetryIntervalSec 15
          New-Item -ItemType Directory -Force -Path $env:WEBENGINE_SRC_DIR | Out-Null
          tar -xf $tar -C $env:WEBENGINE_SRC_DIR
          $inner = Get-ChildItem $env:WEBENGINE_SRC_DIR -Directory -Filter "qtwebengine-everywhere-src-*" | Select-Object -First 1
          if (-not $inner) { throw "qtwebengine source dir missing after extract" }
          "WEBENGINE_SRC=$($inner.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure WebEngine module (proprietary codecs, Release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false  # gn/python/cmake write routine progress to stderr; must not abort the step
          # Mirrors the local configure-webengine.cmd but as a stripped Release
          # build, far smaller/faster/lighter than the local RelWithDebInfo attempt.
          # qt-configure-module accepts module switches before `--`; the build type
          # must be passed as a CMake definition after `--`.
          # Proprietary codecs + Chrome ffmpeg branding bring H.264/AAC; Widevine
          # stays on by default.
          & "$env:QT_ROOT_DIR\bin\qt-configure-module.bat" $env:WEBENGINE_SRC `
            -cmake-generator Ninja `
            -webengine-proprietary-codecs `
            -no-webengine-printing-and-pdf `
            -no-webengine-spellchecker `
            -no-webengine-webrtc `
            -no-build-qtpdf `
            -- `
            -B "$env:WEBENGINE_BUILD_DIR" `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_INSTALL_PREFIX=$env:WEBENGINE_INSTALL_DIR" `
            -DFEATURE_qtwebengine_widgets_build=OFF `
            -DFEATURE_webengine_geolocation=OFF `
            -DFEATURE_webengine_kerberos=OFF `
            -DFEATURE_webengine_extensions=OFF `
            -DFEATURE_webenginedriver=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $env:WEBENGINE_BUILD_DIR -PathType Container)) {
            throw "Qt module configure did not create build directory: $env:WEBENGINE_BUILD_DIR"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $env:WEBENGINE_BUILD_DIR "build.ninja") -PathType Leaf)) {
            Get-ChildItem -LiteralPath $env:WEBENGINE_BUILD_DIR -Force | Format-Table -AutoSize | Out-String | Write-Output
            throw "Qt module configure did not create the expected single-config Ninja file: $env:WEBENGINE_BUILD_DIR\build.ninja"
          }

      - name: Build WebEngine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # CRITICAL for this step specifically: cl.exe/ninja write routine compiler
          # warnings to stderr constantly across a multi-hour Chromium build. Without
          # this, PS7's native-stderr-as-terminating-error default would abort the
          # ENTIRE build on the first warning anywhere in ~20k translation units --
          # the exact failure mode that killed the "Install Chromium host tools" step
          # on choco's harmless nuspec warning. Only the explicit $LASTEXITCODE check
          # below decides pass/fail.
          $PSNativeCommandUseErrorActionPreference = $false
          $jobs = [int]$env:NUMBER_OF_PROCESSORS
          Write-Output "building with -j$jobs"
          cmake --build "$env:WEBENGINE_BUILD_DIR" --parallel $jobs 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "webengine-build.log")
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            Get-Content (Join-Path $env:RUNNER_TEMP "webengine-build.log") | Where-Object { $_ -match 'FAILED:|fatal error|\berror\b|LNK\d+|No such' } | Select-Object -Last 40 | ForEach-Object {
              $m = $_.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A'); Write-Output "::error::$m"
            }
            exit $rc
          }
          Get-PSDrive C,D | Select-Object Name,@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-Table -AutoSize

      - name: Install WebEngine module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false  # native stderr must not abort the step
          cmake --install "$env:WEBENGINE_BUILD_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $core = Get-ChildItem $env:WEBENGINE_INSTALL_DIR -Recurse -Filter "Qt6WebEngineCore.dll" | Select-Object -First 1
          if (-not $core) { throw "Qt6WebEngineCore.dll missing from install prefix" }
          Write-Output "installed: $($core.FullName)"

      - name: Package artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false  # native stderr must not abort the step
          $zip = Join-Path $env:RUNNER_TEMP "qtwebengine-$($env:QT_VERSION)-msvc2022_64-codecs.zip"
          Compress-Archive -Path (Join-Path $env:WEBENGINE_INSTALL_DIR '*') -DestinationPath $zip -Force
          "ARTIFACT_ZIP=$zip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "{0:N1} MB" -f ((Get-Item $zip).Length/1MB)

      - name: Upload codec-enabled WebEngine
        uses: actions/upload-artifact@v4
        with:
          name: qtwebengine-${{ env.QT_VERSION }}-msvc2022_64-codecs
          path: ${{ env.ARTIFACT_ZIP }}
          retention-days: 14
          if-no-files-found: error
