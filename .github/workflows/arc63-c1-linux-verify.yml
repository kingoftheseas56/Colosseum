name: arc63-c1-linux-verify

on:
  push:
    branches:
      - preflight/arc63-c1-pointer-verify-linux

permissions:
  contents: read

jobs:
  linux-c1:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ECM_VERSION: "6.15.0"
      ECM_SHA256: "f7cd022095a9e6bdbe5897720a24bfda81d211757b7c08b173061962bf2ee0b2"
      MPVQT_VERSION: "1.2.0"
      MPVQT_SHA256: "8660ad79c0d60fed77f29b36e1742841466af5405de702c81a121e6eeb625ebb"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: C1 diff whitespace check
        run: git diff --check 7e56664ec11d6987bdc6540c04ac98c5aeca4fcb..HEAD -- docs/colosseum-lanista-verification.md native/devtools/LanistaServer.cpp native/devtools/LanistaServer.h qml/UniversesWorld.qml tests/lanista_harness.cpp
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Correct inherited stale depth assertion in runner only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/lanista_harness.cpp")
          s = p.read_text(encoding="utf-8")
          old = '''            require(absurd.value("maxDepthUsed").toInt() == 64,
                    QStringLiteral("requested_bounds_are_clamped: maxDepth clamped to the server "
                                   "ceiling (64), got %1").arg(absurd.value("maxDepthUsed").toInt())
                        + why());'''
          new = '''            require(absurd.value("maxDepthUsed").toInt() == 256,
                    QStringLiteral("requested_bounds_are_clamped: maxDepth clamped to the server "
                                   "ceiling (256), got %1").arg(absurd.value("maxDepthUsed").toInt())
                        + why());'''
          if old not in s:
              raise SystemExit("stale baseline assertion not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: "6.11.1"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: "qtwebengine qtwebchannel qtwebsockets qtpositioning"
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          cache: true
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ninja-build pkg-config libmpv-dev libtorrent-rasterbar-dev libboost-all-dev libssl-dev libsecret-1-dev libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxcb-cursor0 xvfb xauth ffmpeg p7zip-full libarchive-tools
      - name: Build Extra CMake Modules
        run: |
          archive="$RUNNER_TEMP/ecm.tar.xz"
          source="$RUNNER_TEMP/ecm-source"
          build="$RUNNER_TEMP/ecm-build"
          install="$RUNNER_TEMP/ecm-install"
          curl --fail --location --retry 3 "https://download.kde.org/Attic/frameworks/6.15/extra-cmake-modules-$ECM_VERSION.tar.xz" --output "$archive"
          echo "$ECM_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$source"
          tar -xf "$archive" -C "$source" --strip-components=1
          cmake -S "$source" -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX="$install"
          cmake --build "$build" --target install --parallel 2
          echo "ECM_ROOT=$install" >> "$GITHUB_ENV"
      - name: Build MpvQt
        run: |
          archive="$RUNNER_TEMP/mpvqt.tar.xz"
          source="$RUNNER_TEMP/mpvqt-source"
          build="$RUNNER_TEMP/mpvqt-build"
          install="$RUNNER_TEMP/mpvqt-install"
          curl --fail --location --retry 3 "https://download.kde.org/stable/mpvqt/mpvqt-$MPVQT_VERSION.tar.xz" --output "$archive"
          echo "$MPVQT_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$source"
          tar -xf "$archive" -C "$source" --strip-components=1
          cmake -S "$source" -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$install" -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$ECM_ROOT"
          cmake --build "$build" --target install --parallel 2
          echo "MPVQT_ROOT=$install" >> "$GITHUB_ENV"
      - name: Configure C1 harness
        run: |
          build="$RUNNER_TEMP/arc63-c1-linux"
          cmake -S native -B "$build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCOLOSSEUM_BUILD_PLAYER2=OFF -DCOLOSSEUM_PLAYER2_IN_APP=OFF -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$ECM_ROOT;$MPVQT_ROOT" -DMPVQT_PREFIX="$MPVQT_ROOT"
          echo "C1_BUILD=$build" >> "$GITHUB_ENV"
      - name: Build C1 harness
        run: cmake --build "$C1_BUILD" --target lanista_harness --parallel 2
      - name: Run C1 harness on Xvfb
        env:
          QT_QPA_PLATFORM: xcb
          QSG_NO_VSYNC: "1"
          QT_FORCE_STDERR_LOGGING: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a "$C1_BUILD/lanista_harness"
