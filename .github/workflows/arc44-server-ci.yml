name: arc44-server-ci

on:
  push:
    branches:
      - "arc44/**"
  pull_request:
    paths:
      - "native/colosseum_server/**"
      - "native/player/streamserver.*"
      - ".github/workflows/arc44-server-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arc44-server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retry-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Require a per-request refusal retry budget
        run: |
          python - <<'PY'
          from pathlib import Path

          header = Path("native/player/streamserver.h").read_text(encoding="utf-8")
          source = Path("native/player/streamserver.cpp").read_text(encoding="utf-8")

          required = {
              "pending request carries retry state": "connectionRefusedRetries" in header,
              "register helper receives retry state": "connectionRefusedRetries" in source,
              "first refusal consumes exactly one retry": "connectionRefusedRetries + 1" in source,
              "exhausted retry becomes terminal": "markEngineUnavailable" in source
                  and "ConnectionRefusedError" in source,
          }
          missing = [name for name, present in required.items() if not present]
          if missing:
              raise SystemExit("UNBOUNDED_RETRY_CONTRACT_FAILED: " + "; ".join(missing))
          print("BOUNDED_RETRY_CONTRACT_OK")
          PY

  streamserver-recovery:
    needs: retry-contract
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      VCPKG_TAG: "2026.07.29"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Qt 6.11.1
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: "6.11.1"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b"
          cache: true
      - name: Enable MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Install native server dependencies
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --depth 1 --branch $env:VCPKG_TAG https://github.com/microsoft/vcpkg.git $vcpkg
          & "$vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$vcpkg/vcpkg.exe" install `
            libtorrent:x64-windows `
            openssl:x64-windows `
            boost-filesystem:x64-windows `
            boost-system:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$vcpkg" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "$vcpkg/installed/x64-windows/bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure standalone server tests
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP "arc44-server-tests"
          $prefix = "$env:QT_ROOT_DIR;$env:VCPKG_ROOT/installed/x64-windows"
          cmake -S native/colosseum_server/tests -B $build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DCMAKE_PREFIX_PATH=$prefix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ARC44_SERVER_BUILD=$build" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build StreamServer behavior tests
        shell: pwsh
        run: |
          cmake --build $env:ARC44_SERVER_BUILD `
            --target streamserver_native_cutover_test streamserver_readiness_test `
            --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run StreamServer behavior tests
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:VCPKG_ROOT\installed\x64-windows\bin;$env:PATH"
          ctest --test-dir $env:ARC44_SERVER_BUILD `
            -R '^(streamserver_native_cutover_test|streamserver_readiness_test)$' `
            --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
