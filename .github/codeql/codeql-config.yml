name: Colosseum CodeQL

paths-ignore:
  - archive/**
  - artifacts/**
  - output/**
  - tests/**
  - native/third_party/**
  - native/prototypes/**
  - qml/**
  - resources/reader2/vendor/**
  - resources/reader2/qwebchannel.js
  - docs/research/**
  - server/watchparty-relay/node_modules/**

query-filters:
  - exclude:
      id:
        - cpp/short-global-name
        - cpp/unused-static-variable
        - cpp/function-in-block
        - cpp/ambiguously-signed-bit-field
        - cpp/local-variable-hides-global-variable
        - cpp/poorly-documented-function
        - cpp/trivial-switch
        - cpp/long-switch
        - cpp/complex-block
