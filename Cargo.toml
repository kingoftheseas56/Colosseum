[workspace]
resolver = "2"
members = ["crates/catalog", "crates/account", "crates/daemon", "crates/ui-gpui", "crates/player", "crates/ui-widgets", "crates/addons", "crates/torrent-sidecar"]

[workspace.package]
edition = "2021"
version = "0.1.0"

# Library decisions for the POC. Rationale lives in docs/rust-poc.md;
# adding a dep here should come with a line there.
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = "0.5"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting"] }
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls", "disable-upload"] }

[profile.dev]
# POC: trade a little debug info for much faster link times in the inner loop
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
unwrap_in_result = "warn"
fallible_impl_from = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
redundant_async_block = "warn"
unused_async = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
wildcard_enum_match_arm = "warn"
used_underscore_binding = "warn"
manual_let_else = "warn"
redundant_else = "warn"
if_not_else = "warn"
match_same_arms = "warn"
semicolon_if_nothing_returned = "warn"
needless_pass_by_value = "warn"
unreadable_literal = "warn"
str_to_string = "warn"
string_to_string = "warn"
inefficient_to_string = "warn"
clone_on_ref_ptr = "warn"
missing_errors_doc = "warn"
