<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: qrc:; style-src 'self' file:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Feria player</title><link rel="stylesheet" href="player.css">
<script src="qrc:///qtwebchannel/qwebchannel.js" defer></script><script src="player.js" defer></script>
</head><body>
<header><span>Feria player</span><button id="close" aria-label="Return to website">Back to page</button></header>
<div id="message" role="status">Opening video…</div>
<footer aria-label="Video controls">
<div class="timeline"><input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Playback position"></div>
<div class="transport"><button id="toggle" aria-label="Play or pause">Play</button><span id="time">0:00 / 0:00</span><label>Volume <input id="volume" type="range" min="0" max="100" value="100" aria-label="Volume"></label><label>Speed <select id="rate" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><button id="fullscreen">Full screen</button></div>
</footer></body></html>
